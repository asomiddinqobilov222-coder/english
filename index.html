function sound(ok=true){if(!S.set.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=ok?740:230;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.055,c.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.12);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.13);o.onended=()=>c.close()}catch{}}
function vibrate(pattern=25){if(S.set.vib&&navigator.vibrate)navigator.vibrate(pattern)}
function haptic(ok=true){sound(ok);vibrate(ok?22:[35,30,35])}
function modal(title,body,buttons=[{text:'Close',value:false}]){return new Promise(resolve=>{modalResolve=resolve;$('#modal-root').innerHTML=`<div class="modal-back" role="presentation"><section class="modal" role="dialog" aria-modal="true"><h3>${title}</h3>${body}<div class="modal-actions">${buttons.map((b,i)=>`<button class="btn ${b.primary?'primary':'ghost'}" data-modal="${i}">${esc(b.text)}</button>`).join('')}</div></section></div>`;$('#modal-root').querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>{const v=buttons[+b.dataset.modal].value;$('#modal-root').innerHTML='';resolve(v)});$('#modal-root').querySelector('.modal-back').addEventListener('click',e=>{if(e.target.classList.contains('modal-back')){ $('#modal-root').innerHTML='';resolve(false)}})})}

function applyTheme(theme){const next=theme==='day'?'day':'night';document.body.dataset.theme=next;try{localStorage.setItem('english-soz-theme',next)}catch{}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=next==='day'?'#70c5ff':'#0a1930';const b=$('.theme-toggle');if(b){b.innerHTML=next==='day'?'<span>Tungi</span>':'<span>Kunduzgi</span>';b.setAttribute('aria-label',next==='day'?'Tungi rejimga o‘tish':'Kunduzgi rejimga o‘tish');b.title=b.getAttribute('aria-label')}}
function toggleTheme(){const next=document.body.dataset.theme==='day'?'night':'day';document.querySelector('.celestial-transition')?.remove();document.body.classList.remove('theme-animating');applyTheme(next)}
function ensureThemeToggle(){const top=$('.top');if(page!=='home'){document.querySelectorAll('.theme-toggle').forEach(b=>b.remove());return}if(!top)return;document.querySelectorAll('.theme-toggle').forEach(b=>{if(!top.contains(b))b.remove()});let b=top.querySelector('.theme-toggle');if(!b){b=document.createElement('button');b.type='button';b.className='theme-toggle';b.onclick=toggleTheme;top.appendChild(b)}applyTheme(document.body.dataset.theme||(()=>{try{return localStorage.getItem('english-soz-theme')||'night'}catch{return'night'}})())}

function nav(){const items=[['home','⌂','Home'],['tasks','✓','Tasks'],['translator','⇄','Translator'],['profile','◉','Profile']];$('#nav').innerHTML=items.map(([id,ic,t])=>`<button class="${page===id?'active':''}" data-page="${id}"><span class="navicon">${ic}</span><span>${t}</span></button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){page=p;task=null;render();window.scrollTo({top:0,behavior:'smooth'});haptic(true)}
function header(title,sub=''){return `<div class="screen-title"><div><div class="eyebrow">ENGLISH SO‘Z / ${page==='home'?'OVERVIEW':page.toUpperCase()}</div><h2>${title}</h2><p class="subhead">${sub}</p></div></div>`}
function bar(pct){return `<div class="bar ${pct===0?'zero':''}"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`}
function percentToday(){const p=progressFor();return Math.round(MODES.reduce((sum,m)=>sum+(Number(p.modes[m.id]?.score)||0),0)/4)}
function streakFlameIcon(){return '<svg class="streak-flame" viewBox="0 0 32 38" aria-hidden="true"><path d="M17 2c1 8-5 10-3 16 1-3 4-4 6-8 7 7 9 13 6 20-2 5-6 7-11 7C7 37 2 31 3 23 4 16 10 11 11 6c3 3 4 6 4 9 3-4 3-8 2-13Z" fill="#FF9A55"/><path d="M17 20c1 4-3 5-2 9 1-2 3-2 4-5 3 4 4 7 2 10-1 2-3 3-5 3-4 0-6-3-5-7 0-3 3-6 4-8 1 1 1 2 2 3Z" fill="#FFE19A"/></svg>'}
function libraryIcon(){return '<svg viewBox="0 0 28 28" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 5h5v18H5zM12 4h5v19h-5zM19 7h4v16h-4z"/><path d="M4 24h20"/></svg>'}
function reviewIcon(){return '<svg viewBox="0 0 28 28" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h17l-4-4M23 8l-4 4M23 20H6l4 4M5 20l4-4"/></svg>'}
function streak(){let d=new Date(today()),n=0;const has=()=>{const p=S.progress[dateKey(d)];return p&&Object.keys(p.modes||{}).length>0};if(!has())d.setDate(d.getDate()-1);while(has()&&n<400){n++;d.setDate(d.getDate()-1)}return n}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function home(){const p=progressFor(),pct=percentToday(),done=Object.keys(p.modes).length,dues=dueWords();return `${header('Improve every day','Small steps lead to big results.')}
<div class="panel"><div class="progress-head"><span>Today's tasks:</span><span class="percent">${pct}%</span></div><div class="subhead" style="margin-top:4px">${done}/4 tasks completed${done===4?' · Excellent!':''}</div>${bar(pct)}<div class="row spread" style="margin-top:13px"><small>${new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'})}</small><span class="badge">${done===4?'Day completed':'Keep going'}</span></div></div>
<div class="panel"><div class="quick"><button onclick="openCalendar()"><span class="qicon">'+streakFlameIcon()+'</span><span class="qnum">${streak()}</span><span class="qlabel">Daily streak</span></button><button onclick="openWordList()"><span class="qicon">'+libraryIcon()+'</span><span class="qnum">${S.words.length}</span><span class="qlabel">Word list</span></button><button onclick="go('translator')"><span class="qicon">⌕</span><span class="qnum">Translator</span><span class="qlabel">Add a word</span></button><button onclick="openTodayWords()"><span class="qicon">'+reviewIcon()+'</span><span class="qnum">${dues.length}</span><span class="qlabel">Words due today</span></button></div></div>
<div class="home-grid"><section class="panel"><div class="row spread"><div><div class="eyebrow">PROGRESS HISTORY</div><h3 class="section-title" style="margin-top:5px">Practice activity</h3></div><span class="badge" id="chart-range">7 days</span></div><div class="chart-controls"><button class="btn ghost small" onclick="shiftChart(-1)" aria-label="One day earlier">←</button><span class="subhead" id="chart-caption">Last 7 days</span><button class="btn ghost small" onclick="shiftChart(1)" aria-label="One day later">→</button></div><div class="chart-wrap">${chart()}</div><p class="chart-tip" id="chart-tip">Tap a point or hover over it. You can also swipe the chart.</p></section><section class="panel"><div class="eyebrow">TODAY PLAN</div><h3 class="section-title" style="margin-top:5px">Continue learning</h3><div class="task-list" style="grid-template-columns:1fr">${MODES.map(m=>`<div class="task-card" onclick="startTask('${m.id}')"><div class="task-icon">${m.icon}</div><div class="task-copy"><b>${m.title}</b><small>${m.desc}</small><span class="task-state ${p.modes[m.id]?'done':''}">${p.modes[m.id]?'✓ Completed':'Start'}</span></div><span class="task-right">›</span></div>`).join('')}</div></section></div>`}
let chartWindowOffset=0,chartSliding=false;
function chartCaption(){
 const cap=$('#chart-caption'),range=$('#chart-range'),first=new Date(),last=new Date();
 first.setDate(first.getDate()+chartWindowOffset-6);last.setDate(last.getDate()+chartWindowOffset);
 if(cap)cap.textContent=first.toLocaleDateString('en-US',{day:'numeric',month:'short'})+' – '+last.toLocaleDateString('en-US',{day:'numeric',month:'short'});
 if(range)range.textContent=chartWindowOffset===0?'Last 7 days':Math.abs(chartWindowOffset)+' days '+(chartWindowOffset<0?'ago':'ahead');
}
function shiftChart(delta){
 if(chartSliding||!delta)return;
 chartWindowOffset=Math.max(-520,Math.min(520,chartWindowOffset+delta));
 updateChartWindow(true,delta);
}
function updateChartWindow(animate,direction=1){
 const wrap=$('.chart-wrap');if(!wrap)return;
 const old=wrap.querySelector('svg:last-of-type')||wrap.querySelector('svg');
 if(!animate||!old){wrap.innerHTML=chart();chartCaption();bindChartGestures();return}
 if(chartSliding)return;
 const holder=document.createElement('div');holder.innerHTML=chart();
 const next=holder.firstElementChild;if(!next)return;
 chartSliding=true;
 old.classList.add('chart-slide-svg',direction>0?'chart-slide-out-left':'chart-slide-out-right');
 next.classList.add('chart-slide-svg',direction>0?'chart-slide-in-right':'chart-slide-in-left');
 wrap.appendChild(next);
 chartCaption();
 window.setTimeout(()=>{
  if(old.isConnected)old.remove();
  if(next.isConnected)next.classList.remove('chart-slide-svg','chart-slide-in-right','chart-slide-in-left');
  chartSliding=false;
 },300);
 bindChartGestures();
}
function chart(){const now=new Date(),days=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()+chartWindowOffset-i);const k=dateKey(d),p=S.progress[k],m=p?.modes||{},vals=Object.values(m).map(x=>Number(x.score)||0),pct=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/4):0;days.push({k,label:d.toLocaleDateString('en-US',{weekday:'short'}).replace('.',''),pct})}const W=520,H=220,L=34,R=10,T=12,B=30,iw=W-L-R,ih=H-T-B;const ys=[0,25,50,75,100].map(v=>'<g><line x1="'+L+'" y1="'+(T+ih*(1-v/100))+'" x2="'+(W-R)+'" y2="'+(T+ih*(1-v/100))+'" stroke="currentColor" opacity=".13"/><text x="'+(L-7)+'" y="'+(T+ih*(1-v/100)+4)+'" fill="currentColor" opacity=".65" font-size="10" text-anchor="end">'+v+'</text></g>').join('');const pts=days.map((d,i)=>(L+iw*i/6)+','+(T+ih*(1-d.pct/100))).join(' ');return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Daily progress grafigi">'+ys+'<polyline points="'+pts+'" fill="none" stroke="var(--cyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+days.map((d,i)=>{const x=L+iw*i/6,y=T+ih*(1-d.pct/100);return '<circle class="chart-point" tabindex="0" role="button" aria-label="'+d.k+': '+d.pct+'%" cx="'+x+'" cy="'+y+'" r="5" fill="var(--cyan)" stroke="var(--panel)" stroke-width="2" onmouseenter="chartHover(\''+d.k+'\','+d.pct+')" onfocus="chartHover(\''+d.k+'\','+d.pct+')" onclick="showProgressDay(\''+d.k+'\','+d.pct+')"><title>'+d.k+': '+d.pct+'%</title></circle><text x="'+x+'" y="'+(H-8)+'" fill="currentColor" opacity=".75" font-size="11" text-anchor="middle">'+esc(d.label)+'</text>'}).join('')+'</svg>'}
function chartHover(key,pct){const tip=$('#chart-tip');if(tip)tip.textContent=key+' — progress: '+pct+'% · Tap a point to see more details.'}
function gestureShift(dx){return dx<0?7:-7}
function bindChartGestures(){const el=$('.chart-wrap');if(!el||el.dataset.swipeBound)return;el.dataset.swipeBound='1';let startX=0,startY=0,startAt=0;const down=(x,y)=>{startX=x;startY=y;startAt=Date.now()};const up=(x,y)=>{const dx=x-startX,dy=y-startY;if(Math.abs(dx)>24&&Math.abs(dx)>Math.abs(dy)*1.25)shiftChart(gestureShift(dx,Date.now()-startAt))};el.addEventListener('touchstart',e=>{const t=e.changedTouches[0];down(t.clientX,t.clientY)},{passive:true});el.addEventListener('touchend',e=>{const t=e.changedTouches[0];up(t.clientX,t.clientY)},{passive:true});el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')down(e.clientX,e.clientY)},{passive:true});el.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')up(e.clientX,e.clientY)},{passive:true});const cap=$('#chart-caption'),range=$('#chart-range'),first=new Date(),last=new Date();first.setDate(first.getDate()+chartWindowOffset-6);last.setDate(last.getDate()+chartWindowOffset);if(cap)cap.textContent=first.toLocaleDateString('en-US',{day:'numeric',month:'short'})+' – '+last.toLocaleDateString('uz-UZ',{day:'numeric',month:'short'});if(range)range.textContent=chartWindowOffset===0?'Last 7 days':Math.abs(chartWindowOffset)+' days '+(chartWindowOffset<0?'ago':'ahead')}
function tasksPage(){const p=progressFor(),done=Object.keys(p.modes).length,pct=percentToday();return `${header('Tasks','Practice today’s words in four different ways.') }<div class="panel"><div class="progress-head"><span>Completed: ${done}/4</span><span class="percent">${pct}%</span></div>${bar(pct)}</div><div class="task-list">${MODES.map(m=>`<div class="task-card" onclick="startTask('${m.id}')"><div class="task-icon">${m.icon}</div><div class="task-copy"><b>${m.title}</b><small>${m.desc}</small><span class="task-state ${p.modes[m.id]?'done':''}">${p.modes[m.id]?`✓ ${p.modes[m.id].score}% score`:'Pending'}</span></div><span class="task-right">›</span></div>`).join('')}</div><p class="footnote">No words yet. Add words from your profile or home screen to get started.</p>`}
function render(){nav();const app=$('#app');if(page==='home')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">✦</div><div><h1>Engliwords</h1><p>Welcome, ${esc(cloud?.user?.name||'')}! Keep moving forward every day.</p></div></div>${cloud?.user?.picture?`<img class="avatar" src="${esc(cloud.user.picture)}" alt="Profile picture">`:`<div class="avatar" style="display:grid;place-items:center">✦</div>`}</div>${home()}`;else if(page==='tasks')app.innerHTML=`${tasksPage()}`;else if(page==='translator')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">⇄</div><div><h1>Translator</h1><p>English ↔ Native language</p></div></div></div>${translatorPage()}`;else if(page==='profile')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">◉</div><div><h1>Profile</h1><p>Settings and account</p></div></div></div>${profilePage()}`;else if(page==='add'){page='translator';app.innerHTML=`<div class="top"><div class="brand"><div class="logo">⇄</div><div><h1>Translator</h1><p>English ↔ Native language</p></div></div></div>${translatorPage()}`}else app.innerHTML=`<div class="top task-top"></div>${taskView()}`;ensureThemeToggle();bindPage();if(page==='home')bindChartGestures();if(typeof cloudRender==='function')cloudRender()}
function bindPage(){if(page==='translator'){if(window.translatorDebounce)clearTimeout(window.translatorDebounce);$('#swap')?.addEventListener('click',()=>{[translator.sl,translator.tl]=[translator.tl,translator.sl];translator.tl=translator.sl==='en'?window.engNativeCode():'en';translator.result='';render()});$('#translate-magnifier')?.addEventListener('click',async()=>{const textIn=String($('#src')?.value||'').trim();if(!textIn)return toast('Enter some text first.');translator.source=textIn;scheduleLiveSpellcheck();await translateText(false)});$('#read-src')?.addEventListener('click',()=>speak($('#src')?.value||'',translator.sl));$('#read-dst')?.addEventListener('click',()=>speak(translator.result,translator.tl));$('#clear-translator')?.addEventListener('click',()=>{translator.source='';translator.result='';translator.examples=[];const src=$('#src');if(src)src.value='';const spell=$('#spell-live');if(spell){spell.className='spell-live';spell.textContent=''}if(window.liveSpellTimer)clearTimeout(window.liveSpellTimer);if(window.liveSpellController)window.liveSpellController.abort();const dst=$('#dst');if(dst)dst.textContent='Your translation will appear here';const ex=$('#translator-examples');if(ex)ex.innerHTML='<p class="subhead">Matn va misollar tozalandi.</p>';const add=$('#translator-add-word');if(add)add.classList.add('hide')});$('#clear-result')?.addEventListener('click',()=>{translator.result='';const dst=$('#dst');if(dst)dst.textContent='Your translation will appear here';const add=$('#translator-add-word');if(add)add.classList.add('hide')});$('#src')?.addEventListener('keydown',async e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const textIn=String($('#src')?.value||'').trim();if(!textIn)return toast('Enter some text first.');translator.source=textIn;if(window.translatorDebounce)clearTimeout(window.translatorDebounce);scheduleLiveSpellcheck();await translateText(false)}});$('#src')?.addEventListener('input',()=>{translator.source=$('#src').value;translator.result='';$('#dst').textContent='Keep typing…';if(window.translatorDebounce)clearTimeout(window.translatorDebounce);scheduleLiveSpellcheck()})}}
function profilePage(){const user=cloud?.user||null;return `${header('Profile','Manage your learning progress.')}<section class="panel"><div class="row" style="gap:14px">${user?.picture?`<img class="avatar" style="width:62px;height:62px" src="${esc(user.picture)}" alt="Profile picture">`:`<div class="logo" style="width:62px;height:62px;border-radius:50%">${user?'◉':'◎'}</div>`}<div style="flex:1"><h3 style="margin:0 0 4px">${esc(user?.name||'Create a profile')}</h3><p class="subhead">${esc(cloud?.ready?'Your Engliwords profile is active':'Sign up to create your profile')}</p></div></div></div><div id="cloud-status" class="subhead" style="margin-top:14px">${cloud?.ready?'Supabase sync is active':user?'Your profile is active.':'Sign up to create your profile.'}</div><div id="cloud-actions" style="margin-top:12px">${user?`<button class="btn secondary full" onclick="cloudLogin()">Sync now</button>`:`<button class="btn primary full" onclick="cloudLogin()">Sign up</button>`}</div></section><section class="panel"><h3 class="section-title">AI assistant</h3>${groqApiKey ? '<div style="border:1px solid #287f68;background:#12362f;border-radius:14px;padding:13px;margin:10px 0"><b style="color:var(--green)">✓ AI assistant connected and active</b><p class="subhead" style="margin:6px 0 0">AI connection verified and ready.</p></div><button class="btn ghost" onclick="clearAiKey()">Change or disconnect key</button>' : '<p class="subhead">Your nickname is linked to your profile. Your email address is not shown in the app. The AI key is stored on this device.</p><label class="fieldbox" style="display:block;margin-top:12px"><span class="field-label">Grok (xAI) or Groq API key</span><input id="groq-key" class="field" type="password" autocomplete="off" placeholder="xai-… yoki gsk_…"></label><div class="row" style="margin-top:10px"><button id="groq-save-btn" class="btn primary" onclick="saveAiKey()">Connect and verify</button></div>'}<p class="subhead" style="margin-top:10px">Note: the key is stored only in this browser, not in GitHub or Google Drive. This is not server-side secret storage; do not save it on a shared device.</p></section><section class="panel"><h3 class="section-title">Settings</h3><div class="settings-row"><div><b>Sound</b><div class="subhead">Play a soft sound when a button is pressed</div></div><input class="switch" type="checkbox" ${S.set.sound?'checked':''} onchange="S.set.sound=this.checked;save();haptic(this.checked);render()"></div><div class="settings-row"><div><b>Vibration</b><div class="subhead">If supported by your device</div></div><input class="switch" type="checkbox" ${S.set.vib?'checked':''} onchange="S.set.vib=this.checked;save();render()"></div><div class="settings-row"><div><b>Backup</b><div class="subhead">Save your vocabulary as a JSON file</div></div><button class="btn ghost small" onclick="exportData()">Export</button></div><div class="settings-row"><div><b>Restore data</b><div class="subhead">From a previous backup file</div></div><button class="btn ghost small" onclick="$('#import-file').click()">Import</button><input id="import-file" class="hide" type="file" accept="application/json" onchange="importData(this.files[0])"></div><div class="settings-row"><div><b>Sign out</b><div class="subhead">Sign out of your account</div></div><button class="btn danger small" onclick="confirmLogout()">Sign out →</button></div></section>`}
function translatorPage(){return `${header('Translator','Translate text, listen to pronunciation, and explore examples.')}<section class="panel translator-panel"><div class="row spread" style="margin-bottom:12px"><span class="badge">${translator.sl==='en'?'🇺🇸 English':(window.ENG_LANGUAGES.find(x=>x.code===translator.sl)?.name||translator.sl)}</span><button id="swap" class="btn small">⇄ Swap</button><span class="badge">${window.ENG_LANGUAGES.find(x=>x.code===translator.tl)?.name||translator.tl}</span></div><div class="translator"><div class="board"><label class="field-label">Text</label><div class="translator-input-wrap"><textarea id="src" class="field" placeholder="Enter text…">${esc(translator.source||'')}</textarea><div id="spell-live" class="spell-live" role="status" aria-live="polite"></div></div><div class="translator-action-row"><button id="mic-src" class="translator-icon-btn mic" type="button" aria-label="Enter text by voice" title="Speak to enter text"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button><button id="read-src" class="translator-icon-btn read ${translator.sl==='en'?'':'hide'}" type="button" aria-label="Read text aloud" title="Read aloud"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button><button id="clear-translator" class="translator-icon-btn clear" type="button" aria-label="Clear text" title="Clear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><button id="translate-magnifier" class="translator-icon-btn translate" type="button" aria-label="Translate" title="Translate"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.2 4.2"/></svg></button></div></div><div class="board"><label class="field-label">Translation</label><div class="translator-output-wrap"> function translatorCanAddWord(){const source=String(translator.source||'').trim();return translator.sl==='en'&&translator.tl===window.engNativeCode()&&/^[A-Za-z][A-Za-z'’-]*$/.test(source)&&String(translator.result||'').trim().length>0&&!/[.!?\n]/.test(translator.result)}
function wordEditDistance(a,b){a=String(a).toLowerCase();b=String(b).toLowerCase();if(Math.abs(a.length-b.length)>2)return 99;const dp=Array.from({length:a.length+1},(_,i)=>Array.from({length:b.length+1},(_,j)=>i===0?j:j===0?i:0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return dp[a.length][b.length]}

let liveSpellRequestId=0;

 if(window.liveSpellController)window.liveSpellController.abort();
 liveSpellRequestId++;
 const box=$('#spell-live');
 if(box){box.className='spell-live';box.textContent=''}
 const fullText=String($('#src')?.value||'');
 if(translator.sl!=='en'||translator.tl!=='uz'||!fullText.trim())return;
 const match=fullText.match(/(?:^|\s)([A-Za-z][A-Za-z'’-]*)\s*$/);
 if(!match||match[1].length<3)return;

}
async function checkLiveSpelling(value,fullText){
 const box=$('#spell-live');if(!box||String($('#src')?.value||'')!==fullText)return;
 const requestId=++liveSpellRequestId,controller=new AbortController();window.liveSpellController=controller;
 const current=()=>requestId===liveSpellRequestId&&String($('#src')?.value||'')===fullText;
 const hideNotice=()=>{if(box){box.className='spell-live';box.textContent=''}};
 try{
  const response=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(value),{signal:controller.signal});
  if(!current())return;
  if(response.ok){hideNotice();return}
  if(response.status!==404){hideNotice();return}
  const url=new URL('https://api.datamuse.com/words');url.searchParams.set('sp',value);url.searchParams.set('max','8');url.searchParams.set('md','f');
  const suggestionsResponse=await fetch(url,{signal:controller.signal});if(!suggestionsResponse.ok||!current())return;
  const list=await suggestionsResponse.json();
  const candidate=list.map(x=>({word:String(x.word||''),d:wordEditDistance(value,x.word),score:Number(x.score)||0}))
   .filter(x=>x.word&&x.word.toLowerCase()!==value.toLowerCase()&&x.d>0&&x.d<=Math.min(2,value.length>=7?2:1)&&/^[a-z]+(?:['-][a-z]+)*$/i.test(x.word))
   .sort((x,y)=>x.d-y.d||y.score-x.score||y.word.length-x.word.length)[0];
  if(!candidate){hideNotice();return}
  box.className='spell-live show';box.innerHTML='<strong>⚠️ Word isn\'t found:</strong> <span>'+esc(value)+'</span> → <strong>'+esc(candidate.word)+'</strong> <button type="button" id="spell-live-fix">Tuzatish</button>';
  $('#spell-live-fix')?.addEventListener('click',()=>{const input=$('#src');if(!input)return;const currentText=input.value,pos=currentText.lastIndexOf(value);if(pos<0)return;input.value=currentText.slice(0,pos)+candidate.word+currentText.slice(pos+value.length);translator.source=input.value;translator.result='';hideNotice();if(window.translatorDebounce)clearTimeout(window.translatorDebounce);translateText(true);scheduleLiveSpellcheck()});
 }catch(error){if(error?.name!=='AbortError'&&current())hideNotice()}
}

async function aiFetch(url,options={},timeoutMs=20000){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);
 try{
  if(!AI_PROXY_URL)throw new Error('AI serveri hali sozlanmagan.');
  if(typeof supabaseClient==='undefined'||!supabaseClient?.auth)throw new Error('First Google orqali tizimga kiring.');
  const {data:{session},error}=await supabaseClient.auth.getSession();
  if(error||!session?.access_token)throw new Error('AI ishlashi uchun Google akkauntingizga qayta kiring.');
  const original=new URL(url,location.href);
  const path=original.pathname.endsWith('/models')?'/models':'/chat/completions';
  const headers=new Headers(options.headers||{});
  headers.delete('Authorization');headers.set('Authorization','Bearer '+session.access_token);headers.set('Content-Type','application/json');
  const response=await fetch(AI_PROXY_URL.replace(/\/$/,'')+path,{...options,headers,signal:controller.signal});
  const raw=await response.text();let data=null;try{data=raw?JSON.parse(raw):{}}catch{}
  if(!response.ok){const detail=String(data?.error?.message||data?.error||data?.message||raw||('HTTP '+response.status)).replace(/\s+/g,' ').slice(0,240);throw new Error('HTTP '+response.status+' — '+detail)}
  if(!data)throw new Error('AI serveri JSON formatida javob bermadi.');
  return data;
 }catch(e){if(e?.name==='AbortError')throw new Error('AI so‘rovi vaqt tugagani uchun to‘xtadi. Qayta urinib ko‘ring.');if(e instanceof TypeError)throw new Error('AI serveriga ulanish bo‘lmadi. Worker sozlamalarini tekshiring.');throw e}
 finally{clearTimeout(timer)}
}

 if(provider==='xai'){
  for(const preferred of ['grok-4.7','grok-4.1','grok-4.1-fast','grok-3-mini','latest'])if(ids.includes(preferred))return preferred;
  return ids.find(id=>/grok|latest/i.test(id)&&!/image|voice|embed|video|realtime/i.test(id))||'';
 }

function parseExamples(raw){
 let text=String(raw||'').trim();
 if(text.startsWith('```')){text=text.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim()}
 const first=text.indexOf('{'),last=text.lastIndexOf('}');if(first>=0&&last>first)text=text.slice(first,last+1);
 const parsed=JSON.parse(text),obj=parsed.examples||parsed,out={};
 for(const level of ['easy','normal','hard']){
  const item=obj[level]||obj.examples?.[level]||{};
  out[level]={en:String(item.en||item.english||'').trim(),uz:String(item.uz||item.uzbek||item.translation||'').trim()};
  if(!out[level].en||!out[level].uz)throw new Error('The AI response is missing a '+level+' example or translation.');
 }
 out.nativeLanguage=window.engNativeCode();
 return out;
}

 const payload={model:aiModel||(aiProvider==='xai'?'grok-4.7':'qwen/qwen3.8-27b'),messages:[

  const ids=[...new Set((Array.isArray(listing?.data)?listing.data:[]).map(x=>String(x?.id||'')).filter(id=>id&&id!==selectedModel&&id!=='openai/gpt-oss-120b'&&!/(whisper|guard|embed|speech|tts|vision|image|audio|orpheus|arabic|realtime|video|transcri|diariz)/i.test(id)))];
  const preferred=['openai/gpt-oss-20b','llama-3.3-70b-versatile','llama-3.1-8b-instant','qwen/qwen3.8-27b','groq/compound','groq/compound-mini'];
  const candidates=[...preferred.filter(id=>ids.includes(id)),...ids.filter(id=>!preferred.includes(id))].slice(0,10);
  let lastError=e,success=false;

   try{data=await requestWithFormatFallback(candidate);selectedModel=candidate;success=true;break}
   catch(nextError){

   }
  }

 }
 }
 if(selectedModel!==aiModel){aiModel=selectedModel;try{persistAiKey(groqApiKey,aiProvider,selectedModel)}catch{}console.info('AI model avtomatik almashtirildi:',selectedModel)}

<script>
/* Translator voice input and reliable language-specific speech output. */
(function(){
  let recognition = null;
  let micSilenceTimer = null;
  let micManualStop = false;
  let micLastActivity = 0;
  function scheduleMicSilenceStop(){
    clearTimeout(micSilenceTimer);
    micSilenceTimer=setTimeout(()=>{
      if(!recognition)return;
      micManualStop=true;
      const active=recognition;
      recognition=null;
      setMicState(false);
      try{active.stop()}catch{}
    },5000);
  }
  function setMicState(listening){
    const b=document.getElementById('mic-src');
    if(!b)return;
    b.classList.toggle('is-listening',!!listening);
    b.title=listening?'Tinglayapti…':'Speak to enter text';
    b.setAttribute('aria-label',listening?'Soundni tinglash to‘xtatiladi':'Enter text by voice');
  }
  function startMic(){
    const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SpeechRecognition){toast('Bu brauzer ovoz orqali matn kiritishni qo‘llaMaydi. Chrome brauzerida sinab ko‘ring.');return}
    if(recognition){micManualStop=true;clearTimeout(micSilenceTimer);const active=recognition;recognition=null;try{active.stop()}catch{}setMicState(false);return}
    micManualStop=false;
    micLastActivity=Date.now();
    recognition=new SpeechRecognition();
    recognition.lang=translator.sl==='en'?(S.set.accent||'en-US'):'uz-UZ';
    recognition.interimResults=false;
    recognition.continuous=true;
    recognition.onstart=()=>{setMicState(true);scheduleMicSilenceStop()};
    recognition.onresult=e=>{
      micLastActivity=Date.now();
      scheduleMicSilenceStop();
      const text=Array.from(e.results||[]).map(x=>x[0]?.transcript||'').join(' ').trim();
      if(!text)return;
      const src=document.getElementById('src');
      if(src){src.value=text;src.dispatchEvent(new Event('input',{bubbles:true}));src.focus()}
    };
    recognition.onerror=e=>{
      const messages={
        'not-allowed':'Mikrofon ruxsati berilmadi. Brauzer sozlamalaridan mikrofon ruxsatini yoqing.',
        'service-not-allowed':'Brauzer ovoz tanish xizmatiga ruxsat bermadi.',
        'no-speech':'Sound aniqlanmadi. Try again.',
        'audio-capture':'Microphone not found or already in use by another app.',
        'network':'Check your internet connection for speech recognition.'
      };
      if(e.error!=='aborted'&&!(e.error==='no-speech'&&Date.now()-micLastActivity<5000))toast(messages[e.error]||'Speech recognition failed.');
    };
    recognition.onend=()=>{
      if(micManualStop||!recognition){clearTimeout(micSilenceTimer);recognition=null;setMicState(false);return}
      if(Date.now()-micLastActivity>=5000){clearTimeout(micSilenceTimer);recognition=null;setMicState(false);return}
      const active=recognition;
      setTimeout(()=>{if(recognition===active&&!micManualStop){try{active.start()}catch{}}},120);
    };
    try{recognition.start()}catch(e){recognition=null;setMicState(false);toast('Mikrofonni ishga tushirib bo‘lmadi. Qayta urinib ko‘ring.')}
  }
  document.addEventListener('click',e=>{
    if(e.target.closest('#mic-src')){e.preventDefault();startMic()}
  });
  /* Wait for browser voices to load; never silently use an Uzbek voice for English. */
  speak=async function(text,lang){
    if(!('speechSynthesis' in window))return toast('This browser does not support speech playback.');
    const t=String(text||'').trim();
    if(!t)return toast('There is no text to read.');
    const synth=window.speechSynthesis;
    synth.cancel();
    let voices=synth.getVoices();
    if(!voices.length){
      await Promise.race([
        new Promise(resolve=>synth.addEventListener('voiceschanged',resolve,{once:true})),
        new Promise(resolve=>setTimeout(resolve,1200))
      ]);
      voices=synth.getVoices();
    }
    const isEnglish=lang==='en';
    const requested=isEnglish?(S.set.accent||'en-US'):'uz-UZ';
    let voice=null;
    if(isEnglish){
      voice=voices.find(v=>v.lang.toLowerCase()===requested.toLowerCase())
        ||voices.find(v=>/^en([-_]|$)/i.test(v.lang));
      if(voices.length&&!voice){
        toast('Qurilmada inglizcha ovoz topilmadi. Windows yoki brauzerda English speech voice mavjudligini tekshiring.');
        return;
      }
    }else{
      voice=voices.find(v=>/^uz([-_]|$)/i.test(v.lang))||null;
    }
    const utterance=new SpeechSynthesisUtterance(t);
    utterance.lang=requested;
    if(voice)utterance.voice=voice;
    utterance.rate=0.92;
    utterance.onerror=e=>{
      if(e.error!=='canceled'&&e.error!=='interrupted')toast(isEnglish?'English ovoz ishlamadi. Qurilmadagi English speech voice sozlamalarini tekshiring.':'Soundli o‘qish bajarilmadi.');
    };
    synth.speak(utterance);
  };
})();
</script>

<script id="engliwords-learning-results-patch">
(function(){
  const exerciseTypes=[
    {id:'flash',label:'Flashcards'},
    {id:'match',label:'Matching'},
    {id:'write',label:'Write the English word'},
    {id:'sentence',label:'Sentence translation'},
    {id:'conversation',label:'Real conversations'}
  ];
  const statusText={new:'New',learning:'Learning',ready:'Ready to use'};
  let activeGroup=null,activeTaskWords=null,taskFlowIndex=0,taskTransitionLabel='',resultFilter='',resultsExpanded=false;
  const originalHome=home,originalTasksPage=tasksPage,originalRender=render,originalStartTask=startTask,originalFinishTask=finishTask,originalTaskView=taskView;
  function learningData(w){
    if(!w.learning||typeof w.learning!=='object')w.learning={status:'new',scores:{}};
    if(!w.learning.scores||typeof w.learning.scores!=='object')w.learning.scores={};
    return w.learning;
  }
  function scoreFor(w,id){
    const d=learningData(w).scores[id];
    return d&&Number.isFinite(Number(d.average))?Math.max(0,Math.min(100,Number(d.average))):null;
  }
  function wordAverage(w){
    const values=exerciseTypes.map(t=>scoreFor(w,t.id)).filter(v=>v!==null);
    return values.length?Math.round(values.reduce((a,b)=>a+b,0)/values.length):null;
  }
  function wordStatus(w){
    const data=learningData(w),done=Array.isArray(w.done)?w.done:[];
    if(done.includes(14))data.status='ready';
    else if(done.includes(3))data.status='learning';
    else data.status='new';
    return data.status;
  }
  function wordsForStatus(status){return S.words.filter(w=>wordStatus(w)===status).sort((a,b)=>a.word.localeCompare(b.word,undefined,{sensitivity:'base'}))}
  function dueWordsForStatus(status){return wordsForStatus(status).filter(w=>due(w))}
  function dueMixedWords(){
    const words=S.words.filter(w=>due(w));
    for(let i=words.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[words[i],words[j]]=[words[j],words[i]]}
    return words;
  }
  function wordStatusBadge(w){const status=wordStatus(w);return '<span class="badge word-status-badge status-'+status+'">'+statusText[status]+'</span>'}
  // Bridge helpers across the separate script scopes used by the task views.
  window.engliwordsGetActiveTaskWords=()=>activeTaskWords;
  window.engliwordsWordStatusBadge=w=>wordStatusBadge(w);
  const exerciseStages=[
    {id:'flash',title:'Flashcards',desc:'Recall the meaning'},
    {id:'match',title:'Matching',desc:'Match words and meanings'},
    {id:'write',title:'Writing',desc:'Write the English word'},
    {id:'sentence',title:'Making sentences',desc:'Build a complete sentence'}
  ];
  function exerciseIcon(id){
    const common='viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"';
    if(id==='flash')return '<svg '+common+'><rect x="12" y="15" width="31" height="39" rx="7" stroke="currentColor" stroke-width="2.8"/><rect x="22" y="9" width="31" height="39" rx="7" fill="url(#exg)" stroke="currentColor" stroke-width="2.8"/><path d="M31 26h13M31 33h9" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="m49 8 2.5-5L54 8l5 2.5-5 2.5-2.5 5-2.5-5-5-2.5L49 8Z" fill="#FFE29A"/><defs><linearGradient id="exg" x1="22" y1="9" x2="54" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#78EBD9"/><stop offset="1" stop-color="#8FA8FF"/></linearGradient></defs></svg>';
    if(id==='match')return '<svg '+common+'><rect x="7" y="11" width="20" height="13" rx="6.5" stroke="currentColor" stroke-width="2.8"/><rect x="37" y="40" width="20" height="13" rx="6.5" stroke="currentColor" stroke-width="2.8"/><rect x="7" y="40" width="20" height="13" rx="6.5" stroke="currentColor" stroke-width="2.8"/><rect x="37" y="11" width="20" height="13" rx="6.5" stroke="currentColor" stroke-width="2.8"/><path d="M27 17.5h5a7 7 0 0 1 7 7v15M37 46.5h-5a7 7 0 0 1-7-7v-15" stroke="#77E6D5" stroke-width="3" stroke-linecap="round"/></svg>';
    if(id==='write')return '<svg '+common+'><path d="m15 43 2.8-10.8L42.5 7.5a6 6 0 0 1 8.5 8.5L26.3 40.7 15 43Z" fill="url(#exw)" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/><path d="m34 16 14 14M13 51h39" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><defs><linearGradient id="exw" x1="16" y1="10" x2="50" y2="45" gradientUnits="userSpaceOnUse"><stop stop-color="#8FA8FF"/><stop offset="1" stop-color="#78EBD9"/></linearGradient></defs></svg>';
    return '<svg '+common+'><path d="M8 13a7 7 0 0 1 7-7h34a7 7 0 0 1 7 7v19a7 7 0 0 1-7 7H29l-12 9v-9h-2a7 7 0 0 1-7-7V13Z" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/><path d="M18 18h28M18 26h20" stroke="#78EBD9" stroke-width="3" stroke-linecap="round"/><path d="m35 48 4-1 13-13-3-3-13 13-1 4Z" fill="#8FA8FF" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  }
  function exerciseTiles(){
    const p=progressFor(),flow=p.groupFlow,results=flow?.results||{};
    const passed=id=>Number(p.modes[id]?.score)>=70||Number(results[id]?.score)>=70;
    return '<div class="exercise-grid">'+exerciseStages.map((stage,index)=>{
      const complete=passed(stage.id);
      const state=complete?'<span class="exercise-state complete">Completed · Practice again</span>':'<span class="exercise-state current">Tap to practice</span>';
      return '<div class="exercise-tile '+(complete?'is-complete':'')+'" role="button" tabindex="0" aria-disabled="false" onclick="openExerciseStage('+index+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openExerciseStage('+index+')}"><span class="exercise-art">'+exerciseIcon(stage.id)+'</span><span class="exercise-copy"><b>'+stage.title+'</b><small>'+stage.desc+'</small>'+state+'</span></div>';
    }).join('')+'</div>';
  }
  function groupCards(){return exerciseTiles()}
  window.openExerciseStage=function(index){
    const stageIndex=Math.max(0,Math.min(3,Math.floor(Number(index)||0)));
    const p=progressFor(),group=p.groupFlow?.group||'mixed';
    // All four exercises use the same word-set and task initialization pipeline.
    // This avoids a separate Matching state that can drift from the normal task flow.
    if(!S.words.length){toast('Add words to your vocabulary before starting practice.');return}
    try{
      window.startGroupTask(group,stageIndex);
    }catch(error){
      console.error('Engliwords exercise launch failed:',error);
      toast('Could not open '+(exerciseStages[stageIndex]?.title||'this exercise')+'. Please try again.');
    }
  };
  function allResultsWords(){return ['new','learning','ready'].flatMap(status=>wordsForStatus(status))}
  function resultListHTML(){
    const q=resultFilter.trim().toLocaleLowerCase();
    let words=allResultsWords().filter(w=>!q||(w.word+' '+(w.translation||'')).toLocaleLowerCase().includes(q));
    if(!resultsExpanded)words=words.slice(0,5);
    return words.map(resultRow).join('')||'<p class="subhead">No matching words found.</p>';
  }
  function resultsCard(){
    return '<section class="panel my-results-panel"><div class="row spread my-results-heading"><h3 class="section-title" style="margin:0">My Results</h3><button class="btn secondary small" onclick="toggleResultsExpanded()">'+(resultsExpanded?'Show less':'Show more')+'</button></div>'+
      '<div class="results-legend"><span><i class="status-dot" style="background:#f3b64d"></i>New</span><span><i class="status-dot" style="background:#6d9cff"></i>Learning</span><span><i class="status-dot" style="background:#45d6a0"></i>Ready to use</span></div>'+
      (resultsExpanded?'<input id="results-search-home" class="result-search" type="search" placeholder="Search words…" value="'+esc(resultFilter)+'" oninput="filterHomeResults(this.value)">':'')+
      '<div id="home-results-list">'+resultListHTML()+'</div></section>';
  }
  home=function(){
    let html=originalHome();
    const start=html.indexOf('<section class="panel"><div class="eyebrow">TODAY PLAN</div>');
    if(start>=0){const end=html.indexOf('</section>',start);if(end>=0)html=html.slice(0,start)+'<section class="panel">'+groupCards()+'</section>'+html.slice(end+10)}
    return html+resultsCard();
  };
  let emptyCelebrationActive=false;
  function emptyTaskCelebration(){
    const bursts=[{x:12,y:22},{x:50,y:17},{x:87,y:24},{x:25,y:66},{x:73,y:69},{x:50,y:47}];
    let particles='';
    bursts.forEach((b,bi)=>{for(let i=0;i<38;i++){
      const angle=(i*360/38)+(bi%2?4:0),rad=angle*Math.PI/180;
      const distance=100+(i%7)*22;
      const dx=Math.round(Math.cos(rad)*distance),dy=Math.round(Math.sin(rad)*distance);
      const delay=(1.35+bi*.12+(i%6)*.035).toFixed(2);
      particles+='<i style="--x:'+b.x+'%;--y:'+b.y+'%;--dx:'+dx+'px;--dy:'+dy+'px;--angle:'+(i*47%360)+'deg;--delay:'+delay+'s;--hue:'+((i*29+bi*71)%360)+'"></i>';
    }});
    const flashes=bursts.map((b,i)=>'<span class="tasks-firework-flash" style="--x:'+b.x+'%;--y:'+b.y+'%;--delay:'+(1.34+i*.12)+'s"></span>').join('');
    return '<div class="tasks-empty-screen"><div class="tasks-empty-celebration"><div class="tasks-empty-message">Great job! No tasks left.</div></div><div class="tasks-fullscreen-fireworks" aria-hidden="true">'+flashes+particles+'</div></div>';
  }
  tasksPage=function(){
    emptyCelebrationActive=false;
    return '<div class="panel task-screen">'+exerciseTiles()+'</div>';
  };
  function resultRow(w){
    const status=wordStatus(w),avg=wordAverage(w);
    return '<button type="button" class="result-word status-'+status+'" data-word-id="'+esc(String(w.id))+'" onclick="showWordResult(this.dataset.wordId)" aria-label="'+esc(w.word)+' view results"><span class="result-word-main"><span class="result-word-name">'+esc(w.word)+'</span><span class="result-word-translation">'+esc(w.translation||'Translation not available')+'</span></span><span class="result-word-average">'+(avg===null?'—':avg+'%')+'</span></button>';
  }
  window.startGroupTaskFromButton=function(el){if(el)window.startGroupTask(el.dataset.taskGroup)};
  window.toggleResultsExpanded=function(){resultsExpanded=!resultsExpanded;if(!resultsExpanded)resultFilter='';const panel=document.querySelector('.my-results-panel');if(!panel)return;const button=panel.querySelector('.my-results-heading button'),list=panel.querySelector('#home-results-list');if(button)button.textContent=resultsExpanded?'Show less':'Show more';if(resultsExpanded&&!panel.querySelector('#results-search-home')){const input=document.createElement('input');input.id='results-search-home';input.className='result-search';input.type='search';input.placeholder='Search words…';input.value=resultFilter;input.oninput=()=>window.filterHomeResults(input.value);panel.querySelector('.results-legend')?.after(input)}else if(!resultsExpanded)panel.querySelector('#results-search-home')?.remove();if(list)list.innerHTML=resultListHTML()};
  window.filterHomeResults=function(value){resultFilter=String(value||'');const list=$('#home-results-list');if(list)list.innerHTML=resultListHTML()};
  window.showWordResult=function(wordId){
    const w=S.words.find(x=>String(x.id)===String(wordId));if(!w)return;
    const status=wordStatus(w),avg=wordAverage(w);
    const detail=exerciseTypes.map(t=>'<div class="result-detail-row"><span>'+t.label+'</span><b>'+(scoreFor(w,t.id)===null?'—':Math.round(scoreFor(w,t.id))+'%')+'</b></div>').join('');
    modal(esc(w.word),'<div class="word-result-modal"><div class="result-word-translation">'+esc(w.translation||'Translation not available')+'</div><div class="result-detail-row"><span>Status</span><b>'+statusText[status]+'</b></div>'+detail+'<div class="result-detail-row result-total-row"><span>Overall average</span><b>'+(avg===null?'—':avg+'%')+'</b></div></div>');
  };
  render=function(){if(page!=='results')return originalRender();page='home';return originalRender()};
  window.openResults=function(){resultsExpanded=true;render();window.scrollTo({top:0,behavior:'smooth'})};
  window.filterMyResults=window.filterHomeResults;
  function scoreFromErrorCount(errors){
    const count=Math.max(0,Math.floor(Number(errors)||0));
    return Math.max(0,100-(Math.pow(2,count)-1));
  }
  function scoreForAttempt(id,pool,total,correct){
    const words=Array.isArray(pool)?pool.filter(Boolean):[];
    const weights=taskWeights&&taskWeights[id];
    if(words.length&&weights&&weights.wrong){
      const points=words.reduce((sum,w)=>sum+scoreFromErrorCount(weights.wrong[w.id]||0),0);
      return Math.round(points/words.length);
    }
    return total?Math.round(correct/total*100):0;
  }
  function recordWordScores(id,pool){
    const weights=taskWeights&&taskWeights[id];if(!weights||!Array.isArray(pool))return;
    for(const w of pool){
      if(!w)continue;
      const errors=Math.max(0,Math.floor(Number(weights.wrong?.[w.id]||0)));
      const current=scoreFromErrorCount(errors);
      const data=learningData(w),old=data.scores[id],count=Number(old?.count||0),oldAvg=Number(old?.average||0);
      data.scores[id]={average:Math.round((oldAvg*count+current)/(count+1)),count:count+1,lastScore:current,lastErrors:errors,lastAt:Date.now()};
      data.status=wordStatus(w);
    }
  }
  let dueWordsOriginal=dueWords;
  startTask=function(id){
    if(activeTaskWords){
      const oldDue=dueWords;dueWords=function(){return activeTaskWords};
      try{originalStartTask(id)}finally{dueWords=oldDue}
      return;
    }
    originalStartTask(id);
  };
  const modeLabels={flash:'Flashcards',match:'Matching',write:'Writing',sentence:'Making sentences'};
  function setTaskTransition(id){taskTransitionLabel=modeLabels[id]||''}
  window.startGroupTask=function(group,requestedIndex=0){
    const p=progressFor();
    const saved=p.groupFlow;
    let activeTaskWordsNext=null;
    let startAt=Math.max(0,Math.min(3,Number(requestedIndex)||0));
    let priorResults={};

    // Reuse a saved session only while its word set still matches today's available words.
    const candidates=group==='mixed'?dueMixedWords():dueWordsForStatus(group);
    const fallback=candidates.length?candidates:[...S.words];
    const candidateIds=new Set(fallback.map(w=>String(w.id)));
    const savedIds=Array.isArray(saved?.wordIds)?saved.wordIds.map(String):[];
    const savedSet=new Set(savedIds);
    const sameWordSet=saved&&saved.group===group&&savedIds.length>0&&
      savedIds.length===candidateIds.size&&savedIds.every(id=>candidateIds.has(id));

    if(sameWordSet){
      const words=S.words.filter(w=>savedSet.has(String(w.id)));
      if(words.length){
        activeTaskWordsNext=words;
        // Respect the stage selected in the task list.
        priorResults=saved.results||{};
      }
    }

    // New words were added (or the old flow is stale): restart from Flashcards
    // with the full current word set so every stage uses the same words.
    if(!activeTaskWordsNext){
      activeTaskWordsNext=fallback;
      if(!activeTaskWordsNext.length){
        toast('Add words to your vocabulary before starting practice.');
        return;
      }
      priorResults={};
      p.groupFlow={
        group,
        wordIds:activeTaskWordsNext.map(w=>w.id),
        index:startAt,
        results:{},
        startedAt:Date.now()
      };
    }else{
      p.groupFlow={...saved,results:priorResults,index:startAt};
    }

    activeGroup=group;
    activeTaskWords=activeTaskWordsNext;
    taskFlowIndex=startAt;
    save();

    const current=['flash','match','write','sentence'][taskFlowIndex];
    if(!current||!activeTaskWords.length){
      toast('Could not start this exercise. Please try again.');
      return;
    }
    setTaskTransition(current);
    startTask(current);
    if(task!==current||page!=='task'){
      task=current;
      page='task';
      render();
    }
    setTimeout(()=>{
      taskTransitionLabel='';
      if(page==='task')render();
    },850);
  };
  taskView=function(){return (taskTransitionLabel?'<div class="task-transition"><div><strong>'+taskTransitionLabel+'</strong></div></div>':'')+originalTaskView()};
  finishTask=function(id,correct,total,miss){
    const p=progressFor();
    const pools={flash:flash?.all,match:match?.all,write:write?.all,sentence:sentence?.all};
    const pool=Array.isArray(pools[id])?pools[id]:(Array.isArray(activeTaskWords)?activeTaskWords:[]);
    const missedSet=miss instanceof Set?miss:new Set(miss||[]);
    recordWordScores(id,pool);
    const score=scoreForAttempt(id,pool,total,correct);
    const currentResult={score,correct,total,at:Date.now()};
    const previous=p.modes[id],previousPassed=Number(previous?.score)>=70;
    const best=previousPassed&&Number(previous.score)>score?previous:currentResult;
    const passed=score>=70;

    if(passed||previousPassed){p.modes[id]=best;p.tasks[id]=best}
    else{delete p.modes[id];delete p.tasks[id]}

    const orderedModes=['flash','match','write','sentence'];
    if(activeTaskWords&&p.groupFlow&&Array.isArray(p.groupFlow.wordIds)){
      p.groupFlow.results=p.groupFlow.results||{};
      p.groupFlow.results[id]={...currentResult,passed};
      const selectedIndex=orderedModes.indexOf(id);
      if(selectedIndex>=0)p.groupFlow.index=selectedIndex;
    }

    const history=S.history[today()]||{};
    history[id]={score:best.score,correct:best.correct,total:best.total,passed:Number(best.score)>=70};
    S.history[today()]=history;

    const groupCompleted=!!(activeTaskWords&&p.groupFlow&&orderedModes.every(mode=>
      Number(p.modes[mode]?.score)>=70||Number(p.groupFlow.results?.[mode]?.score)>=70
    ));
    if(groupCompleted){
      // Advance spaced repetition only after all four exercises have passed.
      markReviewed(activeTaskWords,new Set());
      delete p.groupFlow;
      activeGroup=null;activeTaskWords=null;taskFlowIndex=0;taskTransitionLabel='';
    }

    p.score=Math.round(MODES.reduce((sum,m)=>sum+(Number(p.modes[m.id]?.score)||0),0)/4);
    save();
    task=null;page='tasks';
    matchState={id,correct,total,score,miss:[...missedSet],passed:score>=70};
    render();
    toast(passed?(modeLabels[id]||id)+' completed — '+score+'%.':(modeLabels[id]||id)+': '+score+'%. At least 70% is needed.');
    };
  // Add persistent per-word fields to words created before this feature.
  S.words.forEach(w=>{learningData(w);wordStatus(w)});
  // Profile view should use the app's own title, not a host-derived title.
  const oldProfilePage=profilePage;
  profilePage=function(){document.title='Engliwords';return oldProfilePage()};
  // Expose stable helpers for diagnostics and future conversation-practice integration.
  window.engliwordsWordStatus=wordStatus;
  window.engliwordsWordAverage=wordAverage;
  window.engliwordsRecordConversationScore=function(wordId,score,errors=0){
    const w=S.words.find(x=>x.id===wordId);if(!w)return false;
    const data=learningData(w),id='conversation',current=Math.max(0,Math.min(100,Number(score)||0));
    const old=data.scores[id],count=Number(old?.count||0),avg=Number(old?.average||0);
    data.scores[id]={average:Math.round((avg*count+current)/(count+1)),count:count+1,lastScore:current,lastErrors:Math.max(0,Number(errors)||0),lastAt:Date.now()};
    data.status=wordStatus(w);save();if(page==='results')render();return true;

<script id="engliwords-account-gates">
(function(){
  const signedIn=()=>Boolean(typeof cloud!=='undefined'&&cloud&&cloud.ready&&cloud.user);
  const originalGo=go;
  go=function(target){
    if(target==='add'&&!signedIn()){
      window.engliwordsPendingAuthAction='translator';
      cloudLogin();
      return;
    }
    return originalGo(target);
  };
  const originalAdd=window.addTranslatorWord;
  window.addTranslatorWord=async function(){
    if(!signedIn()){
      window.engliwordsPendingAuthAction='dictionary';
      cloudLogin();
      return;
    }
    return originalAdd.apply(this,arguments);
  };
  const originalConfirm=window.confirmTranslatorWord;
  if(originalConfirm)window.confirmTranslatorWord=function(){
    if(!signedIn()){
      window.engliwordsPendingAuthAction='dictionary';
      document.querySelector('#modal-root').innerHTML='';
      cloudLogin();
      return;
    }
    return originalConfirm.apply(this,arguments);
  };
  const originalProfile=profilePage;
  profilePage=function(){
    const root=document.createElement('div');
    root.innerHTML=originalProfile();
    root.querySelectorAll('section').forEach(section=>{
      const heading=section.querySelector('h2,h3,h4');
      if(heading&&/AI assistant/i.test(heading.textContent||''))section.remove();
    });
    return root.innerHTML;
  };
  window.engliwordsAfterAuth=function(){
    const action=window.engliwordsPendingAuthAction;
    if(!action||!signedIn())return;
    window.engliwordsPendingAuthAction=null;
    if(action==='translator')go('translator');
    else if(action==='dictionary'){
      go('translator');
      Promise.resolve().then(()=>window.addTranslatorWord());
    }
  };
  render();
})();
</script>
