<!doctype html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><title>English So'z</title>
<style>
:root{--bg:#0b1020;--cd:#1a2342;--c2:#232e55;--b:#2c3963;--t:#f1f5f9;--m:#94a3b8;--g:#22c55e;--r:#ef4444;--a:#f59e0b;--i:#6366f1;--p:#ec4899}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 20% -10%,#26307a 0,transparent 45%),radial-gradient(circle at 100% 110%,#5b1d57 0,transparent 40%),var(--bg);background-attachment:fixed;color:var(--t);font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:760px;margin:auto;padding:0 16px 28px}
.hd{display:flex;align-items:center;gap:12px;margin:14px 0;padding:16px 18px;border-radius:22px;background:linear-gradient(110deg,var(--c1,#6366f1),var(--c2,#ec4899));box-shadow:0 10px 30px #0006;position:relative;overflow:hidden}
.hd:after{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:#fff2}
.hd h1{margin:0;font-size:22px}.hd p{margin:2px 0 0;font-size:13px;opacity:.85}
.bk{border:0;background:#0004;color:#fff;font-size:20px;width:40px;height:40px;border-radius:12px}
.card{background:var(--cd);border:2px solid var(--b);border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 8px 24px #0004}
.tile{display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s;animation:up .4s both}
.tile:active{transform:scale(.97)}.tile.done{border-color:var(--g)}
.ic{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 0 4px #fff1}
.tile b{font-size:18px}.tile small{display:block;color:var(--m);margin:2px 0 6px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:#f59e0b22;color:var(--a);border:1px solid var(--a)}
.done .badge{background:#22c55e22;color:var(--g);border-color:var(--g)}
.bar{height:12px;border-radius:9px;background:var(--b);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#22c55e,#14b8a6);transition:.5s}
.stats{display:flex;justify-content:space-around;text-align:center}.stats b{font-size:20px;display:block}.stats small{color:var(--m);font-size:11px}
.btn{border:0;border-radius:16px;padding:14px 20px;font:700 16px inherit;color:#fff;background:linear-gradient(135deg,var(--i),#8b5cf6);box-shadow:0 5px 0 #0005,0 8px 18px #0004;margin:6px 4px;transition:.1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0005}.btn.g{background:linear-gradient(135deg,#22c55e,#14b8a6)}.btn.r{background:linear-gradient(135deg,#ef4444,#ec4899)}.btn.s{background:#475569}.btn.w{width:100%;margin:6px 0}
.row{display:flex;flex-wrap:wrap;justify-content:center}.row .btn{flex:1;min-width:130px}
.big{font-size:clamp(30px,9vw,46px);font-weight:800;text-align:center;margin:24px 0;word-break:break-word}
.lab{font-size:11px;letter-spacing:.12em;color:var(--m);font-weight:700;text-align:center}
.ex{color:var(--m);font-style:italic;text-align:center;font-size:14px}
input,textarea{width:100%;background:#121a33;color:var(--t);border:2px solid var(--b);border-radius:14px;padding:13px;font:17px inherit;margin:6px 0 12px;outline:0}
input:focus,textarea:focus{border-color:var(--i)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mg .btn{margin:0;padding:12px 6px;font-size:15px;min-height:52px}
.mg .btn.sel{background:linear-gradient(135deg,#f59e0b,#f97316)}.mg .btn.ok{background:linear-gradient(135deg,#22c55e,#14b8a6);pointer-events:none}.mg .btn.bad{background:var(--r);animation:sh .35s}
.ring{width:190px;height:190px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(var(--rc) calc(var(--v)*1%),var(--b) 0)}
.ring div{width:150px;height:150px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:42px;font-weight:800}
.wl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--b)}.wl small{color:var(--m);display:block}
.x{border:0;background:#ef444433;color:var(--r);border-radius:10px;width:38px;height:38px;font-size:16px}
#modal{position:fixed;inset:0;display:none;place-items:center;background:#000a;backdrop-filter:blur(6px);z-index:9;padding:20px}
#modal .card{max-width:400px;width:100%;text-align:center;animation:pop .25s}#modal .ic{margin:0 auto 10px;width:76px;height:76px;font-size:36px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:12px 22px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:10;white-space:nowrap}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:8;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes pop{from{transform:scale(.85);opacity:0}}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.spin{width:70px;height:70px;border-radius:50%;border:8px solid var(--b);border-top-color:#14b8a6;margin:40px auto;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
const SCH=[0,1,3,7,30],$=s=>document.querySelector(s),A=$('#app');
const S=Object.assign({words:[],progress:{},cache:{s:{},t:{}},set:{sound:true,vib:true}},JSON.parse(localStorage.getItem('eng')||'{}'));
const save=()=>localStorage.setItem('eng',JSON.stringify(S));
const MODES={flash:{i:'🎴',t:'Flashcard',s:'Kartani aylantirib eslang',c:['#3b82f6','#06b6d4']},match:{i:'🔗',t:'Moslashtirish',s:"So'z va tarjimani juftlang",c:['#f97316','#f59e0b']},write:{i:'✍️',t:'Yozish',s:'Tarjimadan inglizchasini yozing',c:['#a855f7','#ec4899']},sent:{i:'💬',t:'Gap rejimi',s:"O'zbekchadan inglizcha gap",c:['#14b8a6','#22c55e']}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const norm=s=>s.toLowerCase().replace(/[’ʻ‘`´]/g,"'").replace(/[^\p{L}\p{N}\s'-]/gu,' ').replace(/\s+/g,' ').trim();
const today=()=>new Date().toLocaleDateString('en-CA'),dsince=w=>Math.round((new Date(today())-new Date(w.added))/864e5);
const pend=w=>SCH.filter(s=>!w.done.includes(s)),due=w=>{const p=pend(w);return p.length&&p[0]<=dsince(w)};
function day(){const k=today();if(!S.progress[k]){S.progress[k]={words:S.words.filter(due).map(w=>w.id),modes:{},cel:false};save()}return S.progress[k]}
const items=()=>{const ids=day().words;return S.words.filter(w=>ids.includes(w.id))};
function streak(){let d=new Date(today()),n=0;const f=()=>d.toLocaleDateString('en-CA'),ok=()=>S.progress[f()]&&Object.keys(S.progress[f()].modes).length;if(!ok())d.setDate(d.getDate()-1);while(ok()){n++;d.setDate(d.getDate()-1)}return n}
let ac;function beep(f,d=.12,ty='sine',t0=0){if(!S.set.sound)return;try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type=ty;o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start(t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.stop(t+d)}catch(e){}}
const vib=p=>S.set.vib&&navigator.vibrate&&navigator.vibrate(p);
function fb(ok){if(ok){beep(660,.1);beep(880,.15,'sine',.09);vib(40)}else{beep(200,.3,'square');vib([90,50,90])}}
function toast(m,c='#22c55e'){const t=$('#toast');t.textContent=m;t.style.background=c;t.style.opacity=1;clearTimeout(t.h);t.h=setTimeout(()=>t.style.opacity=0,2200)}
function ask(ic,title,msg,btns,c=['#6366f1','#8b5cf6']){return new Promise(res=>{const m=$('#modal');m.style.display='grid';m.innerHTML=`<div class="card"><div class="ic" style="--c1:${c[0]};--c2:${c[1]}">${ic}</div><h2 style="margin:6px 0">${title}</h2><p style="color:var(--m);white-space:pre-line">${msg}</p>${btns.map((b,i)=>`<button class="btn w ${b[1]}" data-i="${i}">${b[0]}</button>`).join('')}</div>`;m.onclick=e=>{const b=e.target.closest('[data-i]');if(b||e.target===m){m.style.display='none';res(b?btns[b.dataset.i][2]:null)}}})}
const hd=(t,s,m,back=1)=>{const c=MODES[m]?MODES[m].c:['#6366f1','#ec4899'];return`<div class="hd" style="--c1:${c[0]};--c2:${c[1]}">${back?'<button class="bk" onclick="home()">←</button>':''}<div><h1>${t}</h1><p>${s||''}</p></div></div>`};
const bar=v=>`<div class="bar"><i style="width:${v*100}%"></i></div>`;
function home(){const d=day(),n=Object.keys(d.modes).length;let h=hd("🎓 English So'z",new Date().toLocaleDateString('uz-UZ',{day:'numeric',month:'long',year:'numeric'})+' · Kunlik reja','',0);
h+=`<div class="card"><b>Bugungi reja</b> <span style="color:var(--m)">${n} / 4 vazifa bajarildi${n==4?' 🏆':''}</span>${bar(n/4)}<div class="stats"><div><b>🔥 ${streak()}</b><small>kun ketma-ket</small></div><div><b>📚 ${S.words.length}</b><small>jami so'z</small></div><div><b>🔔 ${d.words.length}</b><small>bugun takror</small></div></div></div>`;
Object.entries(MODES).forEach(([k,m],i)=>{const s=d.modes[k];h+=`<div class="card tile ${s?'done':''}" style="--c1:${m.c[0]};--c2:${m.c[1]};animation-delay:${i*70}ms" onclick="begin('${k}')"><div class="ic">${m.i}</div><div><b>${m.t}</b><small>${m.s}</small><span class="badge">${s?'✅ Bajarildi · '+s.score+'%':'⏳ Bugun kutmoqda'}</span></div></div>`});
h+=`<div class="row"><button class="btn g" onclick="addScr()">➕ So'z qo'shish</button><button class="btn" onclick="listScr()">📋 Ro'yxat</button><button class="btn s" onclick="S.set.sound=!S.set.sound;save();home()">🔊 ${S.set.sound?'ON':'OFF'}</button><button class="btn s" onclick="S.set.vib=!S.set.vib;save();home()">📳 ${S.set.vib?'ON':'OFF'}</button><button class="btn s" onclick="backup()">💾 Zaxira</button></div>`;A.innerHTML=h;scrollTo(0,0)}
function backup(){ask('💾','Zaxira nusxa',"Ma'lumotlarni faylga saqlash yoki fayldan tiklash (telefon va laptop o'rtasida ko'chirish uchun).",[['⬇️ Faylga saqlash','g',1],['⬆️ Fayldan tiklash','',2],['Yopish','s',0]]).then(r=>{if(r==1){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='english-zaxira.json';a.click()}if(r==2){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>i.files[0].text().then(t=>{try{Object.assign(S,JSON.parse(t));save();toast('Tiklandi ✅');home()}catch(e){toast('Fayl xato',"#ef4444")}});i.click()}})}
let sched=true;
async function begin(m){const M=MODES[m];if(!S.words.length){if(await ask('📭',"Hali so'z yo'q","Birinchi so'zingizni qo'shib boshlang!",[["➕ So'z qo'shish",'g',1],['Orqaga','s',0]]))addScr();return}
const dn=day().modes[m];if(dn){if(!await ask('🏅','Bugun bajarilgan ✅',`«${M.t}» vazifasi bugun ${dn.score}% bilan bajarilgan.\nQo'shimcha mashq qilamizmi?\n(jadvalga ta'sir qilmaydi)`,[["Qo'shimcha mashq",'g',1],['Orqaga','s',0]]))return;sched=false;return run(m,[...S.words])}
let it=items();if(!it.length){if(!await ask('🌴','Bugun takror yo\'q 🎉',"Xohlasangiz barcha so'zlar bilan mashq qiling (jadvalga ta'sir qilmaydi).",[['Mashq qilish','g',1],['Keyinroq','s',0]]))return;sched=false;it=[...S.words]}else sched=true;run(m,it)}
function run(m,it){it=rnd(it);if(m=='match'&&it.length<2)return ask('🔗','Kam so\'z',"Kamida 2 ta so'z kerak.",[['OK','',0]]);({flash:fStart,match:mStart,write:wStart,sent:sStart})[m](it)}
function finish(m,ok,tot,its,miss){if(sched){its.forEach(w=>{if(miss.has(w.id))return;const d=dsince(w);SCH.forEach(s=>{if(s<=d&&!w.done.includes(s))w.done.push(s)})})}
const pct=tot?Math.round(ok/tot*100):0;let all=false;if(sched){const d=day(),p=d.modes[m];d.modes[m]={score:Math.max(pct,p?p.score:0)};if(Object.keys(d.modes).length==4&&!d.cel){d.cel=all=true}}save();
const n=Object.keys(day().modes).length,col=pct>=80?'#22c55e':pct>=50?'#f59e0b':'#ef4444';
A.innerHTML=hd('🎉 Mashq tugadi',MODES[m].t,m)+`<div class="card" style="text-align:center"><div class="ring" style="--v:${pct};--rc:${col}"><div>${pct}%</div></div><h2>${pct>=90?'Ajoyib natija! 🚀':pct>=70?'Yaxshi! 💪':'Takror — bilim onasi 📖'}</h2><p style="color:var(--m)">✅ ${ok} to'g'ri · ❌ ${tot-ok} xato · 📚 ${tot} so'z</p>${sched?`<p style="color:var(--g);font-weight:700">📅 Bugungi reja: ${n} / 4</p>${bar(n/4)}`:'<p class="ex">Qo\'shimcha mashq jadvalga ta\'sir qilmadi</p>'}<div class="row"><button class="btn g" onclick="begin('${m}')">🔄 Qayta</button><button class="btn s" onclick="home()">🏠 Menyu</button></div></div>`;
beep(523,.1);beep(659,.1,'sine',.1);beep(784,.1,'sine',.2);beep(1047,.3,'sine',.3);vib([60,40,60]);if(pct>=50)confetti();if(all)setTimeout(()=>ask('🏆','Barakalla!',`Bugungi 4 ta vazifa bajarildi!\n🔥 ${streak()} kun ketma-ket.`,[['Rahmat!','g',1]],['#22c55e','#14b8a6']),1500)}
function confetti(){for(let i=0;i<60;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}vw;background:${['#ec4899','#f59e0b','#22c55e','#06b6d4','#a855f7'][i%5]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.8}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}
// Flashcard
let F;function fStart(it){F={q:[...it],all:it,miss:new Set(),rev:0,tot:it.length};fDraw()}
function fDraw(){const c=F.q[0],left=new Set(F.q.map(w=>w.id)).size;A.innerHTML=hd('🎴 Flashcard',`Qolgan: ${left} / ${F.tot}`,'flash')+bar((F.tot-left)/F.tot)+`<div class="card">${F.rev?`<div class="lab">${esc(c.word)}</div><div class="lab" style="margin-top:14px;color:var(--g)">TARJIMASI</div><div class="big" style="color:var(--g)">${esc(c.translation)}</div>`:`<div class="lab">INGLIZCHA</div><div class="big">${esc(c.word)}</div>`}${c.example?`<p class="ex">💬 ${esc(c.example)}</p>`:''}</div>`+(F.rev?`<div class="row"><button class="btn g" onclick="fNext(1)">✅ Bildim</button><button class="btn r" onclick="fNext(0)">❌ Bilmadim</button></div>`:`<button class="btn w" onclick="F.rev=1;fDraw()">👁️ Tarjimani ko'rsatish</button>`)}
function fNext(k){const c=F.q.shift();fb(k);if(!k){F.miss.add(c.id);F.q.splice(Math.min(3,F.q.length),0,c)}F.rev=0;F.q.length?fDraw():finish('flash',F.tot-F.miss.size,F.tot,F.all,F.miss)}
// Matching
let M;function mStart(it){M={q:[...it],all:it,tot:it.length,miss:new Set(),done:0};mBatch()}
function mBatch(){if(!M.q.length)return finish('match',M.tot-M.miss.size,M.tot,M.all,M.miss);const rows=Math.max(3,Math.min(8,Math.floor((innerHeight-300)/64)));let n=Math.min(M.q.length,rows);if(M.q.length-n==1&&n>2)n--;M.b=M.q.splice(0,n);M.L=rnd(M.b);M.R=rnd(M.b);M.sl=M.sr=null;M.left=n;M.lock=0;mDraw()}
function mDraw(){A.innerHTML=hd('🔗 Moslashtirish',`Moslashtirildi: ${M.done} / ${M.tot}`,'match')+bar(M.done/M.tot)+`<div class="mg">${M.L.map((w,i)=>`<button class="btn" id="L${i}" onclick="mPick('L',${i})">${esc(w.word)}</button><button class="btn" style="background:linear-gradient(135deg,#ec4899,#a855f7)" id="R${i}" onclick="mPick('R',${i})">${esc(M.R[i].translation)}</button>`).join('')}</div>`}
function mPick(s,i){if(M.lock)return;const e=$('#'+s+i);if(e.classList.contains('ok'))return;const k='s'+s.toLowerCase();if(M[k]!=null)$('#'+s+M[k]).classList.remove('sel');if(M[k]===i){M[k]=null;return}M[k]=i;e.classList.add('sel');if(M.sl!=null&&M.sr!=null){const l=M.L[M.sl],r=M.R[M.sr],a=$('#L'+M.sl),b=$('#R'+M.sr);if(norm(l.translation)==norm(r.translation)){[a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('ok')});M.sl=M.sr=null;M.done++;M.left--;fb(1);if(!M.left){M.lock=1;setTimeout(mBatch,600)}else{A.querySelector('.hd p').textContent=`Moslashtirildi: ${M.done} / ${M.tot}`;A.querySelector('.bar i').style.width=M.done/M.tot*100+'%'}}else{M.miss.add(l.id);M.lock=1;fb(0);[a,b].forEach(x=>x.classList.add('bad'));setTimeout(()=>{[a,b].forEach(x=>x.classList.remove('bad','sel'));M.sl=M.sr=null;M.lock=0},450)}}}
// Writing
let W;function wStart(it){W={q:[...it],all:it,miss:new Set(),tot:it.length};wDraw()}
function wDraw(){const c=W.q[0],left=new Set(W.q.map(w=>w.id)).size,h=c.example?c.example.replace(new RegExp(c.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),'_____'):'';A.innerHTML=hd('✍️ Yozish',`Qolgan: ${left} / ${W.tot}`,'write')+bar((W.tot-left)/W.tot)+`<div class="card"><div class="lab">INGLIZCHASINI YOZING</div><div class="big">${esc(c.translation)}</div>${h?`<p class="ex">💬 ${esc(h)}</p>`:''}<input id="in" autocomplete="off" autocapitalize="none" spellcheck="false" style="text-align:center;font-size:22px"></div><div class="row"><button class="btn g" onclick="wCheck()">✅ Tekshirish</button><button class="btn s" onclick="wJudge('',1)">⏭️ O'tkazish</button></div>`;const i=$('#in');i.focus();i.onkeydown=e=>e.key=='Enter'&&wCheck()}
function wCheck(){const v=$('#in').value.trim();if(v)wJudge(v,0)}
function wJudge(v,skip){const c=W.q.shift(),acc=W.all.filter(w=>norm(w.translation)==norm(c.translation)).map(w=>norm(w.word)),ok=!skip&&acc.includes(norm(v));if(!ok){W.miss.add(c.id);W.q.splice(Math.min(3,W.q.length),0,c)}fb(ok);
A.innerHTML=hd(ok?"✅ To'g'ri!":"❌ Noto'g'ri",'','write',0).replace('--c1:#a855f7;--c2:#ec4899',ok?'--c1:#22c55e;--c2:#14b8a6':'--c1:#ef4444;--c2:#ec4899')+`<div class="card" style="border-color:${ok?'var(--g)':'var(--r)'}"><div class="lab">TO'G'RI JAVOB</div><div class="big" style="color:var(--g)">${esc(c.word)}</div><p style="text-align:center;color:var(--m)">${esc(c.translation)}</p>${ok?'':`<p style="text-align:center;color:var(--r)">Sizning javobingiz: ${esc(v||'(o\'tkazildi)')}</p>`}${c.example?`<p class="ex">💬 ${esc(c.example)}</p>`:''}</div><button class="btn w" id="nx">➡️ Keyingi</button>`;
const go=()=>W.q.length?wDraw():finish('write',W.tot-W.miss.size,W.tot,W.all,W.miss);$('#nx').onclick=go;setTimeout(()=>{document.onkeydown=e=>{if(e.key=='Enter'){document.onkeydown=null;go()}}},250)}
// Sentences
let T;const jget=u=>fetch(u).then(r=>r.json());
async function getEn(w){const k=w.word.toLowerCase();let c=S.cache.s[k]||[];if(c.length<2){try{const p=new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(s|es|d|ed|ing)?\\b','i'),d=await jget('https://tatoeba.org/en/api_v0/search?from=eng&orphans=no&unapproved=no&sort=random&query='+encodeURIComponent(k));const n=(d.results||[]).map(r=>(r.text||'').trim()).filter(t=>{const l=t.split(/\s+/).length;return l>=4&&l<=14&&p.test(t)&&!/\d/.test(t)}).slice(0,10);if(n.length){c=[...new Set([...c,...n])].slice(0,20);S.cache.s[k]=c}}catch(e){}}return c.length?c[Math.floor(Math.random()*c.length)]:null}
async function getUz(en){if(S.cache.t[en])return S.cache.t[en];const d=await jget('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=uz&dt=t&q='+encodeURIComponent(en)),t=d[0].map(x=>x[0]).join('').trim();if(t)S.cache.t[en]=t;return t}
async function sStart(it){const id=++sStart.n||(sStart.n=1);A.innerHTML=hd('💬 Gap rejimi','Gaplar tayyorlanmoqda','sent')+`<div class="card" style="text-align:center"><div class="spin"></div><h3>🌐 Internetdan gaplar qidirilmoqda...</h3><p id="pg" style="color:var(--m)"></p></div>`;const list=[];let n=0;for(const w of it.slice(0,8)){if(id!=sStart.n)return;n++;const p=$('#pg');p&&(p.textContent=`${n} / ${Math.min(8,it.length)} · ${w.word}`);try{const en=await getEn(w),uz=en&&await getUz(en);if(en&&uz)list.push({w,en,uz})}catch(e){}}save();if(id!=sStart.n)return;
if(!list.length){await ask('📡','Gap topilmadi',"Gaplarni olib bo'lmadi. Internetni tekshiring yoki ko'proq oddiy so'z qo'shing.",[['OK','',0]]);return home()}T={l:list,i:0,miss:new Set()};tDraw()}
function tDraw(){const c=T.l[T.i];A.innerHTML=hd('💬 Gap rejimi',`Gap ${T.i+1} / ${T.l.length}`,'sent')+bar(T.i/T.l.length)+`<div class="card"><div class="lab">INGLIZCHAGA O'GIRING</div><div class="big" style="font-size:clamp(22px,6vw,30px)">${esc(c.uz)}</div><p class="ex" style="color:var(--a)">💡 Kalit so'z: ${esc(c.w.word)} — ${esc(c.w.translation)}</p><input id="in" autocomplete="off" autocapitalize="none" spellcheck="false"></div><div class="row"><button class="btn g" onclick="tCheck()">✅ Tekshirish</button><button class="btn s" onclick="tRes('wrong','')">👁️ Javob</button></div>`;const i=$('#in');i.focus();i.onkeydown=e=>e.key=='Enter'&&tCheck()}
const sim=(a,b)=>{const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return 1-d[m][n]/Math.max(m,n,1)};
function tCheck(){const v=$('#in').value.trim();if(!v)return;const a=norm(v),b=norm(T.l[T.i].en);tRes(a==b?'correct':sim(a,b)>=.94?'typo':'wrong',v)}
function tRes(s,v){const c=T.l[T.i],ok=s!='wrong';if(!ok)T.miss.add(c.w.id);fb(ok);A.innerHTML=hd(ok?(s=='typo'?"✅ Deyarli to'g'ri":"✅ To'g'ri!"):"❌ Noto'g'ri",'','sent',0).replace('--c1:#14b8a6;--c2:#22c55e',ok?'--c1:#22c55e;--c2:#14b8a6':'--c1:#ef4444;--c2:#ec4899')+`<div class="card" style="border-color:${ok?'var(--g)':'var(--r)'}"><p class="ex">${esc(c.uz)}</p><div class="lab">TO'G'RI JAVOB</div><div class="big" style="color:var(--g);font-size:clamp(20px,5.5vw,28px)">${esc(c.en)}</div>${s!='correct'&&v?`<p style="text-align:center;color:var(--m)">Sizning javobingiz: ${esc(v)}</p>`:''}<p id="nt" style="text-align:center;color:var(--g);font-weight:700"></p></div><div class="row"><button class="btn" id="nx">➡️ Keyingi</button>${ok?'':'<button class="btn s" id="ov">✅ Mening javobim ham to\'g\'ri</button>'}</div>`;
$('#nx').onclick=()=>{T.i++;T.i>=T.l.length?finish('sent',T.l.length-[...T.miss].length,T.l.length,T.l.map(x=>x.w),T.miss):tDraw()};const o=$('#ov');if(o)o.onclick=()=>{T.miss.delete(c.w.id);o.remove();$('#nt').textContent="Javobingiz to'g'ri deb hisoblandi ✔";fb(1)}}
// Add / List
function addScr(){A.innerHTML=hd("➕ Yangi so'z","Bugun, 1, 3, 7 va 30-kunlarda takrorlanadi",'')+`<div class="card"><label class="lab">INGLIZ SO'ZI</label><input id="w" autocapitalize="none"><label class="lab">O'ZBEKCHA TARJIMASI</label><input id="t"><label class="lab">MISOL GAP (IXTIYORIY)</label><textarea id="e" rows="3"></textarea><button class="btn g w" onclick="addW()">✅ Qo'shish</button><p id="cn" style="text-align:center;color:var(--m)">📚 Jami: ${S.words.length}</p></div>`;$('#w').focus()}
function addW(){const w=$('#w').value.trim(),t=$('#t').value.trim(),e=$('#e').value.trim();if(!w||!t)return toast("So'z va tarjimani to'ldiring","#ef4444");if(S.words.some(x=>x.word.toLowerCase()==w.toLowerCase()))return toast(`«${w}» allaqachon mavjud`,"#ef4444");const it={id:crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random(),word:w,translation:t,example:e,added:today(),done:[]};S.words.push(it);day().words.push(it.id);save();['w','t','e'].forEach(i=>$('#'+i).value='');$('#w').focus();$('#cn').textContent='📚 Jami: '+S.words.length;toast(`«${w}» qo'shildi!`);fb(1)}
function listScr(){const nx=w=>{const p=pend(w);if(!p.length)return"✔ O'zlashtirilgan";const d=new Date(w.added);d.setDate(d.getDate()+p[0]);return d<=new Date(today())?'🔔 Bugun':d.toLocaleDateString('uz-UZ')};A.innerHTML=hd("📋 So'zlar",`Jami: ${S.words.length}`,'')+`<div class="card">${S.words.length?[...S.words].sort((a,b)=>a.word.localeCompare(b.word)).map(w=>`<div class="wl"><div><b>${esc(w.word)}</b> — ${esc(w.translation)}<small>${nx(w)}</small></div><button class="x" onclick="delW('${w.id}')">🗑️</button></div>`).join(''):'<p style="text-align:center">📭 Hali so\'z yo\'q</p>'}</div>`}
async function delW(id){const w=S.words.find(x=>x.id==id);if(await ask('🗑️',"So'zni o'chirish",`«${esc(w.word)}» o'chiriladi. Qaytarib bo'lmaydi.`,[["Ha, o'chirish",'r',1],['Bekor qilish','s',0]],['#ef4444','#ec4899'])){S.words=S.words.filter(x=>x.id!=id);Object.values(S.progress).forEach(d=>d.words=d.words.filter(x=>x!=id));save();listScr();toast("O'chirildi","#475569")}}
home();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script></body></html>
