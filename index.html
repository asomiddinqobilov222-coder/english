function modal(title,body,buttons=[{text:'Yopish',value:false}]){return new Promise(resolve=>{modalResolve=resolve;$('#modal-root').innerHTML=`<div class="modal-back" role="presentation"><section class="modal" role="dialog" aria-modal="true"><h3>${title}</h3>${body}<div class="modal-actions">${buttons.map((b,i)=>`<button class="btn ${b.primary?'primary':'ghost'}" data-modal="${i}">${esc(b.text)}</button>`).join('')}</div></section></div>`;$('#modal-root').querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>{const v=buttons[+b.dataset.modal].value;$('#modal-root').innerHTML='';resolve(v)});$('#modal-root').querySelector('.modal-back').addEventListener('click',e=>{if(e.target.classList.contains('modal-back')){ $('#modal-root').innerHTML='';resolve(false)}})})}

function applyTheme(theme){const next=theme==='day'?'day':'night';document.body.dataset.theme=next;try{localStorage.setItem('english-soz-theme',next)}catch{}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=next==='day'?'#70c5ff':'#0a1930';const b=$('.theme-toggle');if(b){b.innerHTML=next==='day'?'🌙 <span>Tungi</span>':'☀️ <span>Kunduzgi</span>';b.setAttribute('aria-label',next==='day'?'Tungi rejimga o‘tish':'Kunduzgi rejimga o‘tish');b.title=b.getAttribute('aria-label')}}
function toggleTheme(){const old=document.body.dataset.theme==='day'?'day':'night',next=old==='day'?'night':'day';document.querySelector('.celestial-transition')?.remove();const overlay=document.createElement('div');overlay.className='celestial-transition '+(next==='night'?'to-night':'to-day');overlay.setAttribute('aria-hidden','true');overlay.innerHTML='<span class="celestial-sun"></span><span class="celestial-moon"><i></i><i></i><i></i></span>';document.body.appendChild(overlay);document.body.classList.remove('theme-animating');void document.body.offsetWidth;document.body.classList.add('theme-animating');applyTheme(next);setTimeout(()=>{document.body.classList.remove('theme-animating');overlay.remove()},1050)}
function ensureThemeToggle(){const top=$('.top');if(page!=='home'){document.querySelectorAll('.theme-toggle').forEach(b=>b.remove());return}if(!top)return;document.querySelectorAll('.theme-toggle').forEach(b=>{if(!top.contains(b))b.remove()});let b=top.querySelector('.theme-toggle');if(!b){b=document.createElement('button');b.type='button';b.className='theme-toggle';b.onclick=toggleTheme;top.appendChild(b)}applyTheme(document.body.dataset.theme||(()=>{try{return localStorage.getItem('english-soz-theme')||'night'}catch{return'night'}})())}

function nav(){const items=[['home','⌂','Asosiy'],['tasks','✓','Vazifalar'],['translator','⇄','Tarjimon'],['profile','◉','Profil']];$('#nav').innerHTML=items.map(([id,ic,t])=>`<button class="${page===id?'active':''}" data-page="${id}"><span class="navicon">${ic}</span><span>${t}</span></button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){page=p;task=null;render();window.scrollTo({top:0,behavior:'smooth'});haptic(true)}
function header(title,sub=''){return `<div class="screen-title"><div><div class="eyebrow">ENGLISH SO‘Z / ${page==='home'?'OVERVIEW':page.toUpperCase()}</div><h2>${title}</h2><p class="subhead">${sub}</p></div></div>`}
function bar(pct){return `<div class="bar ${pct===0?'zero':''}"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`}
function percentToday(){const p=progressFor();return Math.round(MODES.reduce((sum,m)=>sum+(Number(p.modes[m.id]?.score)||0),0)/4)}
function streak(){let d=new Date(today()),n=0;const has=()=>{const p=S.progress[dateKey(d)];return p&&Object.keys(p.modes||{}).length>0};if(!has())d.setDate(d.getDate()-1);while(has()&&n<400){n++;d.setDate(d.getDate()-1)}return n}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function home(){const p=progressFor(),pct=percentToday(),done=Object.keys(p.modes).length,dues=dueWords();return `${header('Bugun o‘zingni rivojlantir','Kichik qadamlar — katta natijalar.')}
<div class="panel"><div class="progress-head"><span>Bugungi vazifalar:</span><span class="percent">${pct}%</span></div><div class="subhead" style="margin-top:4px">${done}/4 vazifa bajarildi${done===4?' · Ajoyib! 🏆':''}</div>${bar(pct)}<div class="row spread" style="margin-top:13px"><small>${new Date().toLocaleDateString('uz-UZ',{weekday:'long',day:'numeric',month:'long'})}</small><span class="badge">${done===4?'Kun yakunlandi':'Davom etamiz'}</span></div></div>
<div class="panel"><div class="quick"><button onclick="openCalendar()"><span class="qicon">🔥</span><span class="qnum">${streak()}</span><span class="qlabel">Kunlik zanjir</span></button><button onclick="openWordList()"><span class="qicon">📚</span><span class="qnum">${S.words.length}</span><span class="qlabel">So‘zlar ro‘yxati</span></button><button onclick="go('add')"><span class="qicon">✚</span><span class="qnum">Qo‘shish</span><span class="qlabel">Yangi so‘z</span></button><button onclick="openTodayWords()"><span class="qicon">🔔</span><span class="qnum">${dues.length}</span><span class="qlabel">Bugungi so‘zlar</span></button></div></div>
<div class="home-grid"><section class="panel"><div class="row spread"><div><div class="eyebrow">O‘SISH TARIXI</div><h3 class="section-title" style="margin-top:5px">Mashq grafigi</h3></div><span class="badge" id="chart-range">7 kun</span></div><div class="chart-controls"><button class="btn ghost small" onclick="shiftChart(-1)" aria-label="Bir kun oldin">←</button><span class="subhead" id="chart-caption">So‘nggi 7 kun</span><button class="btn ghost small" onclick="shiftChart(1)" aria-label="Bir kun keyin">→</button></div><div class="chart-wrap">${chart()}</div><p class="chart-tip" id="chart-tip">Nuqtani bosing yoki kursorni olib boring. Grafikni surishingiz ham mumkin.</p></section><section class="panel"><div class="eyebrow">BUGUNGI REJA</div><h3 class="section-title" style="margin-top:5px">Davom ettirish</h3><div class="task-list" style="grid-template-columns:1fr">${MODES.map(m=>`<div class="task-card" onclick="startTask('${m.id}')"><div class="task-icon">${m.icon}</div><div class="task-copy"><b>${m.title}</b><small>${m.desc}</small><span class="task-state ${p.modes[m.id]?'done':''}">${p.modes[m.id]?'✓ Bajarildi':'Boshlash'}</span></div><span class="task-right">›</span></div>`).join('')}</div></section></div>`}
let chartWindowOffset=0;
function shiftChart(delta){chartWindowOffset=Math.max(-520,Math.min(520,chartWindowOffset+delta));updateChartWindow(true)}
function updateChartWindow(animate){const wrap=$('.chart-wrap');if(!wrap)return;const old=wrap.querySelector('svg');if(animate&&old){old.style.transition='transform .18s ease,opacity .18s ease';old.style.transform='translateX(-12px)';old.style.opacity='.45'}const put=()=>{wrap.innerHTML=chart();const cap=$('#chart-caption'),range=$('#chart-range'),first=new Date(),last=new Date();first.setDate(first.getDate()+chartWindowOffset-6);last.setDate(last.getDate()+chartWindowOffset);if(cap)cap.textContent=first.toLocaleDateString('uz-UZ',{day:'numeric',month:'short'})+' – '+last.toLocaleDateString('uz-UZ',{day:'numeric',month:'short'});if(range)range.textContent=chartWindowOffset===0?'So‘nggi 7 kun':Math.abs(chartWindowOffset)+' kun '+(chartWindowOffset<0?'oldin':'keyin');bindChartGestures()};if(animate)setTimeout(put,70);else put()}
function showProgressDay(key,pct){const p=S.progress[key],m=p?.modes||{},labels={flash:'Flashcard',match:'Moslashtirish',write:'Yozish',sentence:'Gap tuzish'};const rows=Object.entries(m).map(([id,v])=>'<div class="list-item"><b>'+esc(labels[id]||id)+'</b><span class="badge">'+Math.round(Number(v.score)||0)+'%</span></div>').join('');const d=dayDate(key);modal(d.toLocaleDateString('uz-UZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),'<div class="calendar-detail"><div><span class="subhead">Kunlik progress</span><br><strong>'+pct+'%</strong></div><span class="badge">'+Object.keys(m).length+'/4 mashq</span></div><div style="margin-top:12px">'+(rows||'<p class="subhead">Bu kunda hali mashq natijasi yo‘q.</p>')+'</div>')}
function chart(){const now=new Date(),days=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()+chartWindowOffset-i);const k=dateKey(d),p=S.progress[k],m=p?.modes||{},vals=Object.values(m).map(x=>Number(x.score)||0),pct=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/4):0;days.push({k,label:d.toLocaleDateString('uz-UZ',{weekday:'short'}).replace('.',''),pct})}const W=520,H=220,L=34,R=10,T=12,B=30,iw=W-L-R,ih=H-T-B;const ys=[0,25,50,75,100].map(v=>'<g><line x1="'+L+'" y1="'+(T+ih*(1-v/100))+'" x2="'+(W-R)+'" y2="'+(T+ih*(1-v/100))+'" stroke="currentColor" opacity=".13"/><text x="'+(L-7)+'" y="'+(T+ih*(1-v/100)+4)+'" fill="currentColor" opacity=".65" font-size="10" text-anchor="end">'+v+'</text></g>').join('');const pts=days.map((d,i)=>(L+iw*i/6)+','+(T+ih*(1-d.pct/100))).join(' ');return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Kunlik progress grafigi">'+ys+'<polyline points="'+pts+'" fill="none" stroke="var(--cyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+days.map((d,i)=>{const x=L+iw*i/6,y=T+ih*(1-d.pct/100);return '<circle class="chart-point" tabindex="0" role="button" aria-label="'+d.k+': '+d.pct+'%" cx="'+x+'" cy="'+y+'" r="5" fill="var(--cyan)" stroke="var(--panel)" stroke-width="2" onmouseenter="chartHover(\''+d.k+'\','+d.pct+')" onfocus="chartHover(\''+d.k+'\','+d.pct+')" onclick="showProgressDay(\''+d.k+'\','+d.pct+')"><title>'+d.k+': '+d.pct+'%</title></circle><text x="'+x+'" y="'+(H-8)+'" fill="currentColor" opacity=".75" font-size="11" text-anchor="middle">'+esc(d.label)+'</text>'}).join('')+'</svg>'}
function chartHover(key,pct){const tip=$('#chart-tip');if(tip)tip.textContent=key+' — progress: '+pct+'% · Batafsil ko‘rish uchun nuqtani bosing.'}
function gestureShift(dx,elapsed,threshold=38,max=21){const distance=Math.abs(dx),speed=distance/Math.max(1,elapsed),steps=Math.max(1,Math.round(distance/threshold)+Math.min(14,Math.floor(speed*8)));return Math.min(max,steps)*(dx<0?1:-1)}
function bindChartGestures(){const el=$('.chart-wrap');if(!el||el.dataset.swipeBound)return;el.dataset.swipeBound='1';let startX=0,startY=0,startAt=0;const down=(x,y)=>{startX=x;startY=y;startAt=Date.now()};const up=(x,y)=>{const dx=x-startX,dy=y-startY;if(Math.abs(dx)>24&&Math.abs(dx)>Math.abs(dy)*1.25)shiftChart(gestureShift(dx,Date.now()-startAt))};el.addEventListener('touchstart',e=>{const t=e.changedTouches[0];down(t.clientX,t.clientY)},{passive:true});el.addEventListener('touchend',e=>{const t=e.changedTouches[0];up(t.clientX,t.clientY)},{passive:true});el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')down(e.clientX,e.clientY)},{passive:true});el.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')up(e.clientX,e.clientY)},{passive:true});const cap=$('#chart-caption'),range=$('#chart-range'),first=new Date(),last=new Date();first.setDate(first.getDate()+chartWindowOffset-6);last.setDate(last.getDate()+chartWindowOffset);if(cap)cap.textContent=first.toLocaleDateString('uz-UZ',{day:'numeric',month:'short'})+' – '+last.toLocaleDateString('uz-UZ',{day:'numeric',month:'short'});if(range)range.textContent=chartWindowOffset===0?'So‘nggi 7 kun':Math.abs(chartWindowOffset)+' kun '+(chartWindowOffset<0?'oldin':'keyin')}
function tasksPage(){const p=progressFor(),done=Object.keys(p.modes).length,pct=percentToday();return `${header('Vazifalar','Bugungi so‘zlarni 4 xil usulda mashq qil.') }<div class="panel"><div class="progress-head"><span>Bajarildi: ${done}/4</span><span class="percent">${pct}%</span></div>${bar(pct)}</div><div class="task-list">${MODES.map(m=>`<div class="task-card" onclick="startTask('${m.id}')"><div class="task-icon">${m.icon}</div><div class="task-copy"><b>${m.title}</b><small>${m.desc}</small><span class="task-state ${p.modes[m.id]?'done':''}">${p.modes[m.id]?`✓ ${p.modes[m.id].score}% natija`:'Kutmoqda'}</span></div><span class="task-right">›</span></div>`).join('')}</div><p class="footnote">So‘z qo‘shilmagan bo‘lsa, avval profil yoki asosiy oynadan so‘z qo‘shing.</p>`}
function render(){nav();const app=$('#app');if(page==='home')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">✦</div><div><h1>English So‘z</h1><p>Har kuni bir qadam oldinga.</p></div></div>${cloud?.user?.picture?`<img class="avatar" src="${esc(cloud.user.picture)}" alt="Profil rasmi">`:`<div class="avatar" style="display:grid;place-items:center">✦</div>`}</div>${home()}`;else if(page==='tasks')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">✓</div><div><h1>English So‘z</h1><p>Bugungi mashqlar</p></div></div></div>${tasksPage()}`;else if(page==='translator')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">⇄</div><div><h1>Tarjimon</h1><p>English ↔ O‘zbek</p></div></div></div>${translatorPage()}`;else if(page==='profile')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">◉</div><div><h1>Profil</h1><p>Sozlamalar va hisob</p></div></div></div>${profilePage()}`;else if(page==='add')app.innerHTML=`<div class="top"><button class="btn ghost small" onclick="go('home')">← Orqaga</button><div class="eyebrow">YANGI LUG‘AT</div></div>${addPage()}`;else app.innerHTML=`<div class="top task-top"></div>${taskView()}`;ensureThemeToggle();bindPage();if(page==='home')bindChartGestures();if(typeof cloudRender==='function')cloudRender()}
function bindPage(){if(page==='add'){const f=$('#add-form');if(f)f.onsubmit=async e=>{e.preventDefault();await addWord(new FormData(f))}}if(page==='translator'){if(window.translatorDebounce)clearTimeout(window.translatorDebounce);$('#swap')?.addEventListener('click',()=>{[translator.sl,translator.tl]=[translator.tl,translator.sl];translator.result='';render();const src=$('#src');if(src&&src.value.trim())scheduleTranslatorTranslation()});$('#read-src')?.addEventListener('click',()=>speak($('#src').value,translator.sl));$('#read-dst')?.addEventListener('click',()=>speak(translator.result,translator.tl));$('#src')?.addEventListener('input',()=>{translator.source=$('#src').value;translator.result='';$('#dst').textContent='Yozishni davom eting…';if(window.translatorDebounce)clearTimeout(window.translatorDebounce);if(translator.source.trim())window.translatorDebounce=setTimeout(()=>translateText(true),500);scheduleLiveSpellcheck();});$('#clear-translator')?.addEventListener('click',()=>{translator.source='';translator.result='';translator.examples=[];const src=$('#src');if(src)src.value='';const spell=$('#spell-live');if(spell){spell.className='spell-live';spell.textContent='';}if(window.liveSpellTimer)clearTimeout(window.liveSpellTimer);if(window.liveSpellController)window.liveSpellController.abort();const dst=$('#dst');if(dst)dst.textContent='Tarjima shu yerda ko‘rinadi';const ex=$('#translator-examples');if(ex)ex.innerHTML='<p class="subhead">Matn va misollar tozalandi.</p>';toast('Tarjimon oynasi tozalandi.');});}}
function addPage(){return `${header('So‘z qo‘shish','Inglizcha so‘zni yozing — o‘zbekcha tarjima avtomatik chiqadi.')}<form id="add-form" class="panel stack"><label class="fieldbox"><span class="field-label">Inglizcha so‘z</span><input class="field" name="word" required maxlength="100" placeholder="e.g. curious" autocomplete="off" onblur="autoTranslateWord(this.value)"></label><label class="fieldbox"><span class="field-label">Asosiy tarjima (avtomatik)</span><input class="field" id="auto-translation" name="translation" required maxlength="180" placeholder="Tarjima avtomatik chiqadi" readonly></label><label class="fieldbox"><span class="field-label">Qo‘shimcha tarjima (ixtiyoriy)</span><input class="field" name="customTranslation" maxlength="180" placeholder="O‘zingizning izoh yoki muqobil tarjimangiz"></label><label class="fieldbox"><span class="field-label">Ixtiyoriy o‘z misolingiz</span><textarea class="field" name="example" rows="2" placeholder="I am curious about space."></textarea></label><button class="btn primary full" type="submit">✦ So‘zni saqlash va AI gaplar tayyorlash</button><p class="subhead">AI misol gaplar uchun Profil bo‘limida Groq API kalitini kiriting.</p></form>`}
async function addWord(fd){const word=String(fd.get('word')||'').trim(),translation=String(fd.get('translation')||'').trim(),customTranslation=String(fd.get('customTranslation')||'').trim(),example=String(fd.get('example')||'').trim();if(!word)return toast('Inglizcha so‘zni kiriting.');let auto=translation;if(!auto){try{auto=await lookupTranslation(word)}catch{ return toast('Tarjima olinmadi. Internetni tekshiring.')}}if(!auto)return toast('Tarjima olinmadi.');const finalTranslation=customTranslation?`${auto} (${customTranslation})`:auto;if(S.words.some(w=>w.word.toLocaleLowerCase()===word.toLocaleLowerCase()))return toast('Bu so‘z ro‘yxatda bor.');const w={id:uid(),word,translation:finalTranslation,added:today(),done:[],examples:{easy:example?{en:example,uz:''}:null,normal:null,hard:null}};S.words.push(w);const p=progressFor();if(!p.words.includes(w.id))p.words.push(w.id);save();render();toast('So‘z saqlandi. AI misollar tayyorlanmoqda…');if(example)w.examples.easy={en:example,uz:''};try{const ex=await aiExamples(word,finalTranslation);if(ex){w.examples={...w.examples,...ex};save();toast('Uch darajadagi misol gaplar tayyor!')}}catch(e){aiLastError=e?.message||'Noma’lum AI xatosi';console.warn('Word example generation failed:',aiLastError);toast('So‘z saqlandi, ammo AI gaplari yaratilmadi: '+aiLastError.slice(0,100))}render()}

eholder="xai-… yoki gsk_…"></label><div class="row" style="margin-top:10px"><button id="groq-save-btn" class="btn primary" onclick="saveAiKey()">Ulash va tekshirish</button></div>'}<p class="subhead" style="margin-top:10px">Eslatma: kalit GitHub yoki Google Drive fayliga yozilmaydi, faqat ushbu brauzer xotirasida saqlanadi. Bu server darajasidagi maxfiy saqlash emas; qurilma umumiy bo‘lsa kalitni saqlamang.</p></section><section class="panel"><h3 class="section-title">Sozlamalar</h3><div class="settings-row"><div><b>Ovoz</b><div class="subhead">Tugma bosilganda yumshoq signal</div></div><input class="switch" type="checkbox" ${S.set.sound?'checked':''} onchange="S.set.sound=this.checked;save();haptic(this.checked);render()"></div><div class="settings-row"><div><b>Vibratsiya</b><div class="subhead">Telefon qo‘llab-quvvatlasa</div></div><input class="switch" type="checkbox" ${S.set.vib?'checked':''} onchange="S.set.vib=this.checked;save();render()"></div><div class="settings-row"><div><b>Zaxira nusxasi</b><div class="subhead">Lug‘atni JSON faylga saqlash</div></div><button class="btn ghost small" onclick="exportData()">Eksport</button></div><div class="settings-row"><div><b>Ma’lumotni tiklash</b><div class="subhead">Avvalgi zaxira faylidan</div></div><button class="btn ghost small" onclick="$('#import-file').click()">Import</button><input id="import-file" class="hide" type="file" accept="application/json" onchange="importData(this.files[0])"></div><div class="settings-row"><div><b>Chiqish</b><div class="subhead">Google profilini uzish</div></div><button class="btn danger small" onclick="confirmLogout()">Chiqish →</button></div></section>`}

function translatorCanAddWord(){const source=String(translator.source||'').trim();return translator.sl==='en'&&translator.tl==='uz'&&/^[A-Za-z][A-Za-z'’-]*$/.test(source)&&String(translator.result||'').trim().length>0&&!/[.!?\n]/.test(translator.result)}
function wordEditDistance(a,b){a=String(a).toLowerCase();b=String(b).toLowerCase();if(Math.abs(a.length-b.length)>2)return 99;const dp=Array.from({length:a.length+1},(_,i)=>Array.from({length:b.length+1},(_,j)=>i===0?j:j===0?i:0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return dp[a.length][b.length]}
async function addTranslatorWord(){

}
let liveSpellRequestId=0;
function scheduleLiveSpellcheck(){
 if(window.liveSpellTimer)clearTimeout(window.liveSpellTimer);
 if(window.liveSpellController)window.liveSpellController.abort();
 liveSpellRequestId++;
 const box=$('#spell-live');
 if(box){box.className='spell-live';box.textContent=''}
 const fullText=String($('#src')?.value||'');
 if(translator.sl!=='en'||translator.tl!=='uz'||!fullText.trim())return;
 const match=fullText.match(/(?:^|\s)([A-Za-z][A-Za-z'’-]*)\s*$/);
 if(!match||match[1].length<3)return;
 const value=match[1];
 window.liveSpellTimer=setTimeout(()=>checkLiveSpelling(value,fullText),120);
}
async function checkLiveSpelling(value,fullText){
 const box=$('#spell-live');if(!box||String($('#src')?.value||'')!==fullText)return;
 const requestId=++liveSpellRequestId,controller=new AbortController();window.liveSpellController=controller;
 const current=()=>requestId===liveSpellRequestId&&String($('#src')?.value||'')===fullText;
 const hideNotice=()=>{if(box){box.className='spell-live';box.textContent=''}};
 try{
  const response=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(value),{signal:controller.signal});
  if(!current())return;
  if(response.ok){hideNotice();return}
  if(response.status!==404){hideNotice();return}
  const url=new URL('https://api.datamuse.com/words');url.searchParams.set('sp',value);url.searchParams.set('max','8');url.searchParams.set('md','f');
  const suggestionsResponse=await fetch(url,{signal:controller.signal});if(!suggestionsResponse.ok||!current())return;
  const list=await suggestionsResponse.json();
  const candidate=list.map(x=>({word:String(x.word||''),d:wordEditDistance(value,x.word),score:Number(x.score)||0}))
   .filter(x=>x.word&&x.word.toLowerCase()!==value.toLowerCase()&&x.d>0&&x.d<=Math.min(2,value.length>=7?2:1)&&/^[a-z]+(?:['-][a-z]+)*$/i.test(x.word))
   .sort((x,y)=>x.d-y.d||y.score-x.score||y.word.length-x.word.length)[0];
  if(!candidate){hideNotice();return}
  box.className='spell-live show';box.innerHTML='<strong>⚠️ So‘z lug‘atda topilmadi:</strong> <span>'+esc(value)+'</span> → <strong>'+esc(candidate.word)+'</strong> <button type="button" id="spell-live-fix">Tuzatish</button>';
  $('#spell-live-fix')?.addEventListener('click',()=>{const input=$('#src');if(!input)return;const currentText=input.value,pos=currentText.lastIndexOf(value);if(pos<0)return;input.value=currentText.slice(0,pos)+candidate.word+currentText.slice(pos+value.length);translator.source=input.value;translator.result='';hideNotice();if(window.translatorDebounce)clearTimeout(window.translatorDebounce);translateText(true);scheduleLiveSpellcheck()});
 }catch(error){if(error?.name!=='AbortError'&&current())hideNotice()}
}
function scheduleTranslatorTranslation(){if(window.translatorDebounce)clearTimeout(window.translatorDebounce);if(translator.source.trim())window.translatorDebounce=setTimeout(()=>translateText(true),500)}
async function translateText(silent=false){const textIn=$('#src')?.value.trim();if(!textIn){translator.result='';const dst=$('#dst');if(dst)dst.textContent='Tarjima shu yerda ko‘rinadi';return}translator.source=textIn;const dst=$('#dst');if(dst)dst.textContent='Tarjima qilinmoqda…';try{const u=new URL('https://translate.googleapis.com/translate_a/single');u.searchParams.set('client','gtx');u.searchParams.set('sl',translator.sl);u.searchParams.set('tl',translator.tl);u.searchParams.set('q',textIn);u.searchParams.append('dt','t');u.searchParams.append('dt','bd');u.searchParams.append('dt','ex');const res=await fetch(u);if(!res.ok)throw Error('Tarjima xizmati javob bermadi');const data=await res.json();translator.result=(data[0]||[]).map(x=>x[0]||'').join('');translator.examples=[];for(const group of (data[12]||[])){for(const ex of (group[2]||[])){if(ex[0])translator.examples.push({en:ex[0],uz:ex[1]||''})}}if(!translator.examples.length&&data[1])for(const x of data[1].slice(0,4))if(x[0])translator.examples.push({en:x[0],uz:x[1]||''});save();const current=$('#src')?.value.trim();if(current===textIn){const output=$('#dst');if(output)output.textContent=translator.result;const add=$('#translator-add-word');if(add)add.classList.toggle('hide',!translatorCanAddWord())}}catch(e){const output=$('#dst');if(output)output.textContent='Tarjima olinmadi. Internetni tekshiring.';if(!silent)toast('Tarjima olinmadi. Internetni tekshiring.')}}
function speak(text,lang){if(!('speechSynthesis'in window))return toast('Bu brauzer ovozli o‘qishni qo‘llamaydi.');const t=String(text||'').trim();if(!t)return toast('O‘qish uchun matn yo‘q.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang==='en'?(S.set.accent||'en-US'):'uz-UZ';const voices=speechSynthesis.getVoices();if(lang==='en'){const v=voices.find(v=>v.lang===u.lang)||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v}speechSynthesis.speak(u)}
async function lookupTranslation(word){const u=new URL('https://translate.googleapis.com/translate_a/single');u.searchParams.set('client','gtx');u.searchParams.set('sl','en');u.searchParams.set('tl','uz');u.searchParams.set('dt','t');u.searchParams.set('q',word);const r=await fetch(u);if(!r.ok)throw Error('translate');const d=await r.json();return (d[0]||[]).map(x=>x[0]||'').join('').trim()}
let translationTimer=null;function autoTranslateWord(word){clearTimeout(translationTimer);const el=$('#auto-translation');if(!el)return;const value=String(word||'').trim();if(!value){el.value='';return}translationTimer=setTimeout(async()=>{try{el.value=await lookupTranslation(value)}catch{el.value=''}},250)}
function aiBase(provider){return provider==='xai'?'https://api.x.ai/v1':'https://api.groq.com/openai/v1'}
async function aiFetch(url,options={},timeoutMs=20000){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);
 try{
  const response=await fetch(url,{...options,signal:controller.signal}),raw=await response.text();
  let data=null;try{data=raw?JSON.parse(raw):{}}catch{}
  if(!response.ok){const detail=String(data?.error?.message||data?.message||raw||('HTTP '+response.status)).replace(/\s+/g,' ').slice(0,260);throw new Error('HTTP '+response.status+' — '+detail)}
  if(!data)throw new Error('AI serveri JSON formatida javob bermadi.');
  return data;
 }catch(e){
  if(e?.name==='AbortError')throw new Error('AI so‘rovi 20 soniyada javob bermadi. Qayta urinib ko‘ring.');
  if(e instanceof TypeError)throw new Error('AI serveriga ulanish bo‘lmadi. Internetni tekshiring; brauzer CORS cheklovi ham sabab bo‘lishi mumkin.');
  throw e;
 }finally{clearTimeout(timer)}
}
function aiModelFromList(provider,data){
 const ids=(Array.isArray(data?.data)?data.data:Array.isArray(data?.models)?data.models:[]).map(x=>String(x?.id||x?.name||'')).filter(Boolean);
 if(provider==='xai'){
  for(const preferred of ['grok-4.7','grok-4.1','grok-4.1-fast','grok-3-mini','latest'])if(ids.includes(preferred))return preferred;
  return ids.find(id=>/grok|latest/i.test(id)&&!/image|voice|embed|video|realtime/i.test(id))||'';
 }
 const preferred=['qwen/qwen3.8-27b','openai/gpt-oss-20b','llama-3.3-70b-versatile','llama-3.1-8b-instant','groq/compound','groq/compound-mini'];
 for(const id of preferred)if(ids.includes(id))return id;
 // Audio generation and prompt-guard models cannot create the app's text answers.
 return ids.find(id=>id!=='openai/gpt-oss-120b'&&!/(whisper|guard|embed|speech|tts|vision|image|audio|orpheus|arabic|realtime|video|transcri|diariz)/i.test(id))||'';
}
async function testAiProvider(key,provider){
 const data=await aiFetch(aiBase(provider)+'/models',{headers:{Authorization:'Bearer '+key}},15000),model=aiModelFromList(provider,data);
 if(!model)throw new Error(provider==='groq'?'Groq loyihangizda matn yaratadigan model yoqilmagan. Groq Console → Project → Model Permissions bo‘limida qwen/qwen3.8-27b yoki openai/gpt-oss-20b kabi chat modelini yoqing. Orpheus audio modeli va Prompt Guard matn yaratish o‘rnini bosa olmaydi.':'Ushbu provayderda matn modeli topilmadi.');
 return model;
}

  else{try{provider='xai';model=await testAiProvider(key,provider)}catch(first){provider='groq';try{model=await testAiProvider(key,provider)}catch(second){throw new Error('Kalit Grok (xAI) yoki Groq API kaliti sifatida tekshirilmadi. '+(second.message||first.message))}}}

function clearAiKey(){try{localStorage.removeItem(aiStorageKey())}catch{}groqApiKey='';aiProvider='';aiModel='';aiLastError='';toast('AI API kaliti ushbu Google profiliga tegishli qurilma xotirasidan o‘chirildi.');render()}
function parseExamples(raw){
 let text=String(raw||'').trim();
 if(text.startsWith('```')){text=text.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim()}
 const first=text.indexOf('{'),last=text.lastIndexOf('}');if(first>=0&&last>first)text=text.slice(first,last+1);
 const parsed=JSON.parse(text),obj=parsed.examples||parsed,out={};
 for(const level of ['easy','normal','hard']){
  const item=obj[level]||obj.examples?.[level]||{};
  out[level]={en:String(item.en||item.english||'').trim(),uz:String(item.uz||item.uzbek||item.translation||'').trim()};
  if(!out[level].en||!out[level].uz)throw new Error('AI javobida '+level+' darajadagi gap yoki o‘zbekcha tarjima yo‘q.');
 }
 return out;
}
async function aiExamples(word,translation){
 if(!groqApiKey||!aiProvider)throw new Error('AI API kaliti ulanmagan. Profil bo‘limida Grok/Groq kalitini kiriting.');
 const safeWord=String(word||'').trim(),safeTranslation=String(translation||'').trim();
 if(!safeWord||!safeTranslation)throw new Error('So‘z yoki o‘zbekcha tarjima bo‘sh.');
 const prompt='Create exactly three short, natural English example sentences for the English vocabulary word '+JSON.stringify(safeWord)+' meaning '+JSON.stringify(safeTranslation)+'. Every English sentence must use the target word or a natural inflected form. Make easy, normal, and hard levels progressively more challenging. For each sentence give a natural Uzbek translation of the whole sentence. Return ONLY one valid JSON object with this exact shape: {"examples":{"easy":{"en":"English sentence","uz":"Uzbek translation"},"normal":{"en":"English sentence","uz":"Uzbek translation"},"hard":{"en":"English sentence","uz":"Uzbek translation"}}}. No markdown, no extra text.';
 const payload={model:aiModel||(aiProvider==='xai'?'grok-4.7':'qwen/qwen3.8-27b'),messages:[
  {role:'system',content:'You are a precise English teacher for Uzbek-speaking learners. Create short, grammatically correct example sentences and accurate natural Uzbek translations. Output valid JSON only. Translate each complete sentence, not just the vocabulary word.'},
  {role:'user',content:prompt}
 ],temperature:0.7,reasoning_effort:'none',max_completion_tokens:1400,response_format:{type:'json_object'}};
 const opts={method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+groqApiKey}};
 async function requestWithFormatFallback(model){
  const body={...payload,model};
  if(!/^qwen\/qwen3\./i.test(model))delete body.reasoning_effort;
  try{return await aiFetch(aiBase(aiProvider)+'/chat/completions',{...opts,body:JSON.stringify(body)},25000)}
  catch(e){
   if(!/400|response.?format|json.?object|unsupported/i.test(e.message||''))throw e;
   delete body.response_format;
   return await aiFetch(aiBase(aiProvider)+'/chat/completions',{...opts,body:JSON.stringify(body)},25000);
  }
 }
 let data,selectedModel=payload.model;
 try{data=await requestWithFormatFallback(selectedModel)}
 catch(e){
  const message=String(e?.message||'');
  const modelAccessError=(msg)=>{const s=String(msg||'').toLowerCase();const is403=s.includes('403')||s.includes('forbidden');const permission=is403&&/(blocked|organization|org level|project level|not allowed|permission|access denied|not authorized)/i.test(s);const is400=s.includes('400')&&/(model not found|unknown model|model unavailable|deprecated|model_not_found|invalid parameter|invalid value|unsupported|not supported|temperature|token|response_format)/i.test(s);return permission||is400;};
  if(aiProvider!=='groq'||!modelAccessError(message))throw e;
  // Model ro‘yxatida ko‘rinishi undan foydalanishga ruxsat borligini kafolatlamaydi.
  // Barcha mos chat modellarini ketma-ket sinab ko‘ramiz; audio/guard/embed modellarini chetga chiqaramiz.
  let listing;
  try{listing=await aiFetch(aiBase(aiProvider)+'/models',{headers:{Authorization:'Bearer '+groqApiKey}},15000)}
  catch(listError){throw new Error('Tanlangan Groq modeli ishlamadi va mavjud modellar ro‘yxatini olish ham muvaffaqiyatsiz bo‘ldi. Groq API kaliti va internetni tekshiring.');}
  const ids=[...new Set((Array.isArray(listing?.data)?listing.data:[]).map(x=>String(x?.id||'')).filter(id=>id&&id!==selectedModel&&id!=='openai/gpt-oss-120b'&&!/(whisper|guard|embed|speech|tts|vision|image|audio|orpheus|arabic|realtime|video|transcri|diariz)/i.test(id)))];
  const preferred=['openai/gpt-oss-20b','llama-3.3-70b-versatile','llama-3.1-8b-instant','qwen/qwen3.8-27b','groq/compound','groq/compound-mini'];
  const candidates=[...preferred.filter(id=>ids.includes(id)),...ids.filter(id=>!preferred.includes(id))].slice(0,10);
  let lastError=e,success=false;
  for(const candidate of candidates){
   try{data=await requestWithFormatFallback(candidate);selectedModel=candidate;success=true;break}
   catch(nextError){
    lastError=nextError;
    if(!modelAccessError(String(nextError?.message||'')))throw nextError;
   }
  }
  if(!success){
   const detail=String(lastError?.message||'noma’lum').slice(0,160);
   throw new Error(candidates.length
    ? 'Groq API kalitingiz uchun topilgan matn modellari ishlashga ruxsat etilmagan yoki mos kelmadi. Groq Console → Project → Model Permissions bo‘limida chat/text modelini yoqing. Audio/Prompt Guard modellari gap yaratmaydi. Tafsilot: '+detail
    : 'Groq API kalitingizda foydalanish mumkin bo‘lgan matn/chat modeli topilmadi. Groq Console → Project → Model Permissions bo‘limida chat/text modelini yoqing. Orpheus va Prompt Guard matn yaratish uchun mos emas.');
 }
 }
 if(selectedModel!==aiModel){aiModel=selectedModel;try{persistAiKey(groqApiKey,aiProvider,selectedModel)}catch{}console.info('AI model avtomatik almashtirildi:',selectedModel)}
 const raw=data?.choices?.[0]?.message?.content;if(!raw)throw new Error('AI bo‘sh javob qaytardi. Model yoki limitni tekshiring.');
 return parseExamples(raw);
}

let taskWeights={};
function initTaskWeights(id,list){taskWeights[id]={weight:Object.fromEntries(list.map(w=>[w.id,100/list.length])),earned:{},wrong:{}}}
function answerVisualFeedback(correct){const cls=correct?'answer-correct':'answer-wrong';document.body.classList.remove('answer-correct','answer-wrong');void document.body.offsetWidth;document.body.classList.add(cls);window.setTimeout(()=>document.body.classList.remove(cls),460)}
function weightedWrong(id,wordId){answerVisualFeedback(false);const t=taskWeights[id];if(!t)return;t.wrong[wordId]=(t.wrong[wordId]||0)+1;t.weight[wordId]=Math.ceil(Number(t.weight[wordId]||0)/2)}
function weightedCorrect(id,wordId){answerVisualFeedback(true);const t=taskWeights[id];if(!t||Object.prototype.hasOwnProperty.call(t.earned,wordId))return;t.earned[wordId]=Number(t.weight[wordId]||0)}
function startTask(id){if(!S.words.length){go('add');toast('Avval so‘z qo‘shing.');return}const p=progressFor();let list=dueWords();if(!list.length){const savedIds=new Set(p.words||[]);list=S.words.filter(w=>savedIds.has(w.id));if(!list.length){toast('Bugun takrorlash muddati kelgan so‘z yo‘q.');return}toast('Bugungi muddatli so‘zlar tugagan. Bugungi so‘zlarni qayta mashq qilasiz.')}task=id;initTaskWeights(id,list);if(id==='flash')flash={items:[...list],all:[...list],index:0,miss:new Set(),revealed:false,correct:0};if(id==='match')match={pool:[...list],all:[...list],miss:new Set(),correct:0,round:0,selectedL:null,selectedR:null,usedL:new Set(),usedR:new Set(),pairs:[],statusL:{},statusR:{},solved:new Set()};if(id==='write')write={items:[...list],all:[...list],index:0,miss:new Set(),correct:0,feedback:''};if(id==='sentence'){sentence={items:[...list],all:[...list],index:0,miss:new Set(),correct:0,level:sentenceLevel(list[0]),feedback:''};}page='task';render();window.scrollTo({top:0,behavior:'smooth'})}
function sentenceLevel(w){const weeks=Math.floor((Date.now()-new Date(w?.added||today()).getTime())/(7*86400000));return weeks===0?'easy':weeks===1?'normal':weeks===2?'hard':'mixed'}
function levelFor(w){const n=Math.floor((Date.now()-new Date(w.added||today()).getTime())/(7*86400000));return n===0?'easy':n===1?'normal':n===2?'hard':['easy','normal','hard'][Math.floor(Math.random()*3)]}
function taskHeader(id,idx,total){const p=progressFor(),done=Object.keys(p.modes).length,pct=percentToday();return `<div class="row spread" style="margin:8px 0 15px"><span class="task-count">${Math.min(idx+1,total)} / ${total}</span></div><div class="panel flat"><div class="progress-head"><span>Bajarildi: ${done}/4</span><span class="percent">${pct}%</span></div>${bar(pct)}</div>`}
function flashView(){const f=flash;if(!f||!f.items.length)return taskHeader('flash',0,0)+'<div class="panel">Mashq uchun so‘z topilmadi.</div>';const w=f.items[0];return taskHeader('flash',f.index,f.all.length)+'<section class="panel task-area flash-panel"><div class="row spread" style="margin-bottom:14px"><div><div class="eyebrow">ESLAB QOLISH KARTASI</div><h3 class="section-title" style="margin-top:5px">Tarjimani eslang</h3></div><span class="badge">Bosib o‘giring</span></div><button type="button" class="flashcard-scene" onclick="flipFlashCard()" aria-label="Kartani o‘girish"><span class="flashcard-inner '+(f.revealed?'is-flipped':'')+'"><span class="flashcard-face flashcard-front"><span class="flashcard-label">O‘ZBEKCHA MA’NO</span><span class="flashcard-word">'+esc(w.translation)+'</span><span class="flashcard-tap"><span>↻</span> Inglizcha so‘zni ko‘rish uchun bosing</span><span class="flashcard-sub">'+(f.index+1)+' / '+f.all.length+' karta</span></span><span class="flashcard-face flashcard-back"><span class="flashcard-label">ENGLISH WORD</span><span class="flashcard-word">'+esc(w.word)+'</span><span class="flashcard-tap"><span>↻</span> Qaytarish uchun yana bosing</span><span class="flashcard-sub">Ovoz chiqarib aytib ko‘ring</span></span></span></button><div class="flashcard-tools"><button class="btn ghost small" onclick="speak(\''+esc(w.word).replace(/'/g,"\\'")+'\',\'en\')">🔊 Talaffuzni tinglash</button></div><p class="subhead flash-hint" style="text-align:center;margin-top:14px">'+(f.revealed?'Javobni bilarmidingiz? O‘zingizni baholang.':'Avval javobni xotiradan topishga harakat qiling.')+'</p><div class="flash-answer-actions" '+(f.revealed?'':'hidden')+'><button class="btn danger full" onclick="flashAnswer(false)">✕ Bilmadim</button><button class="btn primary full" onclick="flashAnswer(true)">✓ Bildim</button></div></section>'}
function flipFlashCard(){if(!flash)return;flash.revealed=!flash.revealed;const inner=$('.flashcard-inner');if(inner)inner.classList.toggle('is-flipped',flash.revealed);const actions=$('.flash-answer-actions');if(actions)actions.hidden=!flash.revealed;const hint=$('.flash-hint');if(hint)hint.textContent=flash.revealed?'Javobni bilarmidingiz? O‘zingizni baholang.':'Avval javobni xotiradan topishga harakat qiling.';haptic(true)}
function flashAnswer(ok){const f=flash,w=f.items.shift();if(ok){weightedCorrect('flash',w.id);f.correct++;f.miss.delete(w.id)}else{weightedWrong('flash',w.id);f.miss.add(w.id);f.items.push(w)}f.revealed=false;f.index++;haptic(ok);if(f.items.length===0){finishTask('flash',f.correct,f.all.length,f.miss);return}render()}
function nextMatchBatch(){const m=match;if(m.pool.length===0){finishTask('match',m.correct,m.all.length,m.miss);return}m.pairs=m.pool.splice(0,Math.min(10,m.pool.length));m.left=[...m.pairs].sort(()=>Math.random()-.5);m.right=[...m.pairs].sort(()=>Math.random()-.5);m.selectedL=null;m.selectedR=null;m.usedL=new Set();m.usedR=new Set();m.statusL={};m.statusR={};m.solved=m.solved||new Set();m.failedL=new Set();m.wrongCount=0}
function matchView(){const m=match;if(!m.pairs.length)nextMatchBatch();if(!m.pairs.length)return `<div class="panel">Tayyor!</div>`;return `${taskHeader('match',m.correct,m.all.length)}<section class="panel"><div class="eyebrow">MOSLASHTIRISH</div><h3 class="section-title" style="margin-top:5px">Tarjima juftini toping</h3><p class="subhead" style="margin-bottom:15px">${m.pairs.length-m.usedR.size} ta tarjima qoldi · xato qilingan inglizcha so‘z qayta tanlanmaydi.</p><div class="match-columns"><div class="match-column" aria-label="English words">${m.left.map(w=>`<button class="choice ${m.selectedL===w.id?'selected':''} ${m.statusL[w.id]==='ok'?'correct':''} ${m.statusL[w.id]==='bad'?'wrong':''}" data-match-side="L" data-match-id="${esc(w.id)}" ${m.usedL.has(w.id)?'disabled':''} onclick="matchPick('L','${w.id}')">${esc(w.word)}</button>`).join('')}</div><div class="match-column" aria-label="O‘zbekcha tarjimalar">${m.right.map(w=>`<button class="choice ${m.selectedR===w.id?'selected':''} ${m.statusR[w.id]==='ok'?'correct':''}" data-match-side="R" data-match-id="${esc(w.id)}" ${m.usedR.has(w.id)?'disabled':''} onclick="matchPick('R','${w.id}')">${esc(w.translation)}</button>`).join('')}</div></div></section>`}
function refreshMatchBoard(){const m=match;if(!m)return;const fresh=document.createElement('div');fresh.innerHTML=matchView();const next=fresh.querySelector('.match-columns'),current=$('.match-columns');if(next&&current){current.style.opacity='.35';current.style.transform='translateX(8px)';setTimeout(()=>{if(!current.isConnected)return;current.innerHTML=next.innerHTML;current.style.opacity='1';current.style.transform='translateX(0)';},75)}const p=$('.match-columns')?.previousElementSibling;if(p&&p.classList.contains('subhead'))p.textContent=(m.pairs.length-m.usedR.size)+' ta tarjima qoldi · xato qilingan inglizcha so‘z qayta tanlanmaydi.';const count=$('.task-count');if(count)count.textContent=Math.min(m.correct+1,m.all.length)+' / '+m.all.length}
function matchPick(side,id){const m=match;if(!m||!m.pairs.length)return;if((side==='L'&&m.usedL.has(id))||(side==='R'&&m.usedR.has(id)))return;if(side==='L')m.selectedL=id;else m.selectedR=id;if(m.selectedL&&m.selectedR){const l=m.selectedL,r=m.selectedR;m.selectedL=null;m.selectedR=null;const leftBtn=document.querySelector('[data-match-side="L"][data-match-id="'+CSS.escape(l)+'"]');const rightBtn=document.querySelector('[data-match-side="R"][data-match-id="'+CSS.escape(r)+'"]');if(l===r){m.usedL.add(l);m.usedR.add(r);m.statusL[l]='ok';m.statusR[r]='ok';m.miss.delete(l);weightedCorrect('match',l);if(!m.solved.has(l)){m.solved.add(l);m.correct++}if(leftBtn){leftBtn.classList.remove('selected');leftBtn.classList.add('correct');leftBtn.disabled=true}if(rightBtn){rightBtn.classList.remove('selected');rightBtn.classList.add('correct');rightBtn.disabled=true}haptic(true)}else{m.usedL.add(l);m.failedL.add(l);m.statusL[l]='bad';m.statusR[r]='';m.miss.add(l);weightedWrong('match',l);m.pool.push(m.all.find(w=>w.id===l));m.wrongCount++;if(leftBtn){leftBtn.classList.remove('selected');leftBtn.classList.add('wrong');leftBtn.disabled=true}if(rightBtn){rightBtn.classList.remove('selected','wrong');rightBtn.disabled=false}haptic(false)}const done=m.usedR.size===m.pairs.length;if(done){setTimeout(()=>{nextMatchBatch();if(page==='task'&&task==='match'&&match.pairs.length)refreshMatchBoard();else render()},450)}else{const remainingL=m.left.some(w=>!m.usedL.has(w.id));if(!remainingL){setTimeout(()=>{nextMatchBatch();if(page==='task'&&task==='match'&&match.pairs.length)refreshMatchBoard();else render()},450)}}return}const picked=document.querySelector('[data-match-side="'+side+'"][data-match-id="'+CSS.escape(id)+'"]');if(picked){document.querySelectorAll('[data-match-side="'+side+'"].selected').forEach(el=>el.classList.remove('selected'));picked.classList.add('selected')}haptic(true)}
function writeView(){const w=write.items[0];if(!w)return `<div class="panel">Mashq yakunlandi.</div>`;return `${taskHeader('write',write.index,write.all.length)}<section class="panel"><div class="eyebrow">YOZISH</div><div class="flash-word" style="font-size:30px">${esc(w.translation)}</div><form onsubmit="event.preventDefault();checkWrite()"><label class="field-label" for="answer">Inglizchasini yozing</label><div class="answerline"><input id="answer" class="field" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the English word" value=""/><button class="btn primary" type="submit">Tekshirish</button></div></form><div id="feedback" style="margin-top:14px">${write.feedback?`<p>${esc(write.feedback)}</p>`:''}</div></section>`}
function checkWrite(){const input=$('#answer'),val=input?.value.trim();if(!val)return toast('Javobni yozing.');const w=write.items.shift(),ok=norm(val)===norm(w.word);if(ok){weightedCorrect('write',w.id);write.correct++;write.miss.delete(w.id);write.feedback=`✓ To‘g‘ri: ${w.word}`}else{weightedWrong('write',w.id);write.miss.add(w.id);write.items.push(w);write.feedback=`Xato. To‘g‘ri javob: ${w.word} — bu so‘z yana chiqadi.`}write.index++;haptic(ok);if(!write.items.length){finishTask('write',write.correct,write.all.length,write.miss);return}render()}
function norm(s){return String(s||'').toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘`]/g,"'").replace(/[^\p{L}\p{N}' ]/gu,' ').replace(/\s+/g,' ').trim()}
function sentenceView(){const w=sentence.items[0];if(!w)return `<div class="panel">Mashq yakunlandi.</div>`;if(sentence.currentIndex!==sentence.index){sentence.currentIndex=sentence.index;sentence.currentLevel=levelFor(w)}const level=sentence.currentLevel||levelFor(w),ex=w.examples?.[level]||w.examples?.easy||w.examples?.normal||w.examples?.hard;if(!ex?.en||!ex?.uz){if(!sentenceAiPending.has(w.id)&&!sentenceAiError.has(w.id))loadSentenceExamples(w.id);const loading=sentenceAiPending.has(w.id);const failed=sentenceAiError.has(w.id);return `${taskHeader('sentence',sentence.index,sentence.all.length)}<section class="panel"><div class="eyebrow">GAP TUZISH · AI AGENT</div><h3 class="section-title">${loading?'Gap tayyorlanmoqda…':failed?'Gapni tayyorlab bo‘lmadi':'AI agent gap tayyorlaydi'}</h3><p class="subhead">${loading?'Groq AI so‘z uchun o‘zbekcha gap va uning inglizcha tarjimasini tayyorlamoqda.':failed?('AI xatosi: '+esc(aiLastError||'Kalit, internet yoki API limitini tekshiring.')):'Gap rejimi uchun tayyor misol topilmadi. Agent avtomatik ravishda yangisini yaratadi.'}</p><div class="flash-word" style="font-size:24px">${esc(w.translation)}</div>${failed?`<button class="btn primary full" onclick="retrySentenceAI('${w.id}')">Qayta urinish</button><button class="btn ghost full" style="margin-top:8px" onclick="go('profile')">Profil va API kaliti</button>`: `<div class="subhead" style="margin-top:12px">${loading?'Iltimos, bir oz kuting.':'So‘z uchun yangi gap tuzilmoqda.'}</div>`}</section>`}return `${taskHeader('sentence',sentence.index,sentence.all.length)}<section class="panel"><div class="eyebrow">GAP TUZISH · ${level==='easy'?'EASY':level==='normal'?'NORMAL':level==='hard'?'HARD':'MIXED'}</div><p class="subhead">Quyidagi gapning inglizchasini yozing.</p><div class="flash-word" style="font-size:25px">${esc(ex.uz)}</div><p class="subhead">Asosiy so‘z: ${esc(w.translation)}</p><form onsubmit="event.preventDefault();checkSentence()"><textarea id="sentence-answer" class="field" rows="3" placeholder="Write the English sentence…" style="margin:12px 0"></textarea><button class="btn primary full" type="submit">Tekshirish</button></form><div id="sentence-feedback" class="subhead" style="margin-top:12px"></div></section>`}
async function loadSentenceExamples(id){const w=S.words.find(x=>x.id===id);if(!w||sentenceAiPending.has(id))return;if(!groqApiKey){sentenceAiError.add(id);render();return}sentenceAiPending.add(id);render();try{const ex=await aiExamples(w.word,w.translation);w.examples={...(w.examples||{}),...ex};sentenceAiError.delete(id);save();toast('AI gaplar tayyor!')}catch(e){aiLastError=e?.message||'Noma’lum AI xatosi';console.error('Sentence AI error:',aiLastError);sentenceAiError.add(id)}finally{sentenceAiPending.delete(id);render()}}
function retrySentenceAI(id){sentenceAiError.delete(id);loadSentenceExamples(id)}
async function aiGradeSentence(answer,target,word){
 if(!groqApiKey||!aiProvider)throw new Error('Profil bo‘limida Groq API kalitini ulang.');
 const messages=[
  {role:'system',content:'Grade an Uzbek learner\'s English translation fairly. Accept natural synonyms and equivalent grammar. Judge meaning, grammar, and word choice; do not demand exact wording. Return JSON only: {"score":0,"corrected":"correct natural English","errors":["short error"],"feedback":"brief Uzbek note"}. score is integer 0-100. If correct, errors=[] and corrected may repeat the learner answer. Keep every text field very short. No detailed explanation.'},
  {role:'user',content:'Target: '+JSON.stringify(target)+'\nVocabulary word: '+JSON.stringify(word||'')+'\nLearner answer: '+JSON.stringify(answer)+'\nReturn the score, corrected sentence, and only the main errors.'}
 ];
 const initialModel=aiModel||(aiProvider==='xai'?'grok-4.7':'qwen/qwen3.8-27b');
 const makeGradePayload=(model,maxTokens=420)=>{const p={model,messages,max_completion_tokens:maxTokens};if(/^qwen\/qwen3\./i.test(model)){p.reasoning_effort='none';p.temperature=0.1}else if(!/gpt-oss/i.test(model))p.temperature=0.1;return p};
 const requestGrade=async(model,maxTokens=420)=>aiFetch(aiBase(aiProvider)+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+groqApiKey},body:JSON.stringify(makeGradePayload(model,maxTokens))},25000);
 let model=initialModel,data;
 try{data=await requestGrade(model)}
 catch(firstError){
  const msg=String(firstError?.message||''),lower=msg.toLowerCase();
  const canFallback=aiProvider==='groq'&&((lower.includes('403')||lower.includes('forbidden'))&&/(blocked|organization|org level|project level|not allowed|permission|access denied|not authorized)/i.test(lower)||lower.includes('400')&&/(model not found|unknown model|model unavailable|deprecated|model_not_found|invalid parameter|unsupported|not supported|temperature|token)/i.test(lower));
  if(!canFallback)throw firstError;
  const listing=await aiFetch(aiBase(aiProvider)+'/models',{headers:{Authorization:'Bearer '+groqApiKey}},15000);
  const ids=[...new Set((Array.isArray(listing?.data)?listing.data:[]).map(x=>String(x?.id||'')).filter(id=>id&&id!==model&&id!=='openai/gpt-oss-120b'&&!/(whisper|guard|embed|speech|tts|vision|image|audio|orpheus|arabic|realtime|video|transcri|diariz)/i.test(id)))];
  const preferred=['openai/gpt-oss-20b','llama-3.3-70b-versatile','llama-3.1-8b-instant','groq/compound','groq/compound-mini','qwen/qwen3.8-27b'];
  const candidates=[...preferred.filter(id=>ids.includes(id)),...ids.filter(id=>!preferred.includes(id))].slice(0,10);
  let lastError=firstError,success=false;
  for(const candidate of candidates){
   try{data=await requestGrade(candidate);model=candidate;success=true;break}
   catch(nextError){
    lastError=nextError;const s=String(nextError?.message||'').toLowerCase();
    const stillAccessError=((s.includes('403')||s.includes('forbidden'))&&/(blocked|organization|org level|project level|not allowed|permission|access denied|not authorized)/i.test(s))||(s.includes('400')&&/(model not found|unknown model|model unavailable|deprecated|model_not_found|invalid parameter|unsupported|not supported|temperature|token)/i.test(s));
    if(!stillAccessError)throw nextError;
   }
  }
  if(!success)throw new Error('Groq matn modellaridan hech biri ishlamadi. Groq Console → Project → Model Permissions bo‘limida chat modeliga ruxsat bering. Tafsilot: '+String(lastError?.message||'noma’lum').slice(0,140));
  aiModel=model;persistAiKey(groqApiKey,aiProvider,model);
 }
 let choice=data?.choices?.[0],raw=String(choice?.message?.content||'').trim();
 // Some reasoning models can consume a small output budget before emitting the JSON.
 if(!raw){
  console.warn('AI grade returned empty content:',{model,finish_reason:choice?.finish_reason,usage:data?.usage});
  data=await requestGrade(model,650);
  choice=data?.choices?.[0];
  raw=String(choice?.message?.content||'').trim();
 }
 if(!raw){
  const reason=String(choice?.finish_reason||'unknown');
  throw new Error('AI matnli baho qaytarmadi (finish_reason: '+reason+'). Bir marta avtomatik qayta urinildi; keyinroq qayta urinib ko‘ring.');
 }
 const first=raw.indexOf('{'),last=raw.lastIndexOf('}');
 if(first<0||last<=first)throw new Error('AI bahosining formati noto‘g‘ri. Qayta urinib ko‘ring.');
 const parsed=JSON.parse(raw.slice(first,last+1));
 let score=Number(parsed.score);
 if(!Number.isFinite(score))throw new Error('AI bahosi raqamli emas.');
 if(score>0&&score<=1)score*=100;
 const errors=Array.isArray(parsed.errors)?parsed.errors.filter(Boolean).slice(0,3).join('; '):'';
 const corrected=String(parsed.corrected||answer).trim();
 const note=String(parsed.feedback||'').trim();
 const feedback=[errors?'Xato: '+errors:'',corrected&&corrected.toLowerCase()!==String(answer).trim().toLowerCase()?'To‘g‘risi: '+corrected:'',note].filter(Boolean).join(' · ')||'Javob tekshirildi.';
 return {score:Math.max(0,Math.min(100,Math.round(score))),feedback};
}
async function checkSentence(){
 const input=$('#sentence-answer'),val=input?.value.trim();
 if(!val)return toast('Javobni yozing.');
 const w=sentence.items[0],level=sentence.currentLevel||levelFor(w),ex=w.examples?.[level]||w.examples?.easy||w.examples?.normal||w.examples?.hard;
 if(!ex?.en){toast('Bu so‘z uchun namuna gap yo‘q. AI misollarni qayta yarating.');return}
 const button=$('.panel form button');
 if(button?.disabled)return;
 if(button){button.disabled=true;button.textContent='AI javobni tekshirmoqda…'}
 let result;
 try{result=await aiGradeSentence(val,ex.en,w.word)}
 catch(e){aiLastError=e?.message||'Noma’lum AI xatosi';console.warn('AI sentence grading failed:',aiLastError);if(button){button.disabled=false;button.textContent='Tekshirish'}toast('AI tekshira olmadi: '+aiLastError.slice(0,140));return}
 const score=result.score/100,correct=score>=0.70;
 if(correct){weightedCorrect('sentence',w.id);sentence.correct++;sentence.miss.delete(w.id)}else{weightedWrong('sentence',w.id);sentence.miss.add(w.id);sentence.retryCurrent=true}
 sentence.feedback=`${correct?'✓ Yaxshi!':'To‘g‘ri javob:'} ${ex.en} · AI: ${result.score}% — ${result.feedback}`;
 const feedback=$('#sentence-feedback');if(feedback)feedback.textContent=sentence.feedback;
 if(button){button.disabled=false;button.textContent='Keyingi gap →';button.onclick=e=>{e.preventDefault();const current=sentence.items.shift();if(sentence.retryCurrent){sentence.items.push(current);sentence.retryCurrent=false}sentence.index++;if(!sentence.items.length)finishTask('sentence',sentence.correct,sentence.all.length,sentence.miss);else render()}}
 haptic(correct)
}
function wordOverlap(a,b){const aa=new Set(a.split(' ')),bb=b.split(' ');if(!bb.length)return 0;return bb.filter(x=>aa.has(x)).length/bb.length}
function finishTask(id,correct,total,miss=new Set()){
 const p=progressFor(),pools={flash:flash?.all,match:match?.all,write:write?.all,sentence:sentence?.all},missed=miss instanceof Set?miss:new Set(miss||[]);
 const earned=taskWeights?.[id]?.earned,score=earned?Math.max(0,Math.min(100,Math.round(Object.values(earned).reduce((a,b)=>a+(Number(b)||0),0)))):(total?Math.round(correct/total*100):0);
 const previous=p.modes[id],best=id==='write'&&previous&&Number(previous.score)>score?previous:{score,correct,total,at:Date.now()};
 if(score>=70){markReviewed(pools[id]||[],missed);p.modes[id]=best;p.tasks[id]=best}else if(!p.modes[id]||Number(p.modes[id].score)<70){delete p.modes[id];delete p.tasks[id]}
 p.score=Math.round(MODES.reduce((sum,m)=>sum+(Number(p.modes[m.id]?.score)||0),0)/4);
 const history=S.history[today()]||{},oldHistory=history[id];history[id]=id==='write'&&oldHistory&&Number(oldHistory.score)>score?oldHistory:{score:id==='write'?best.score:score,correct:id==='write'?best.correct:correct,total:id==='write'?best.total:total,passed:score>=70||(id==='write'&&Number(best.score)>=70)};S.history[today()]=history;save();task=null;page='result';
 matchState={id,correct:id==='write'?best.correct:correct,total:id==='write'?best.total:total,score:id==='write'?best.score:score,miss:[...missed],passed:score>=70||(id==='write'&&Number(best.score)>=70)};render()
}
function resultView(){const r=matchState||{score:0,correct:0,total:0,id:'flash'};const passed=r.score>=70;return `${header(passed?'Mashq yakunlandi':'70% ga yetmadi',passed?'Vazifa bajarilgan deb hisoblandi.':'Vazifa bajarilgan hisoblanmadi — qayta urinib ko‘r.')}<section class="panel task-area"><div class="ring" style="--pct:${r.score}"><b>${r.score}%</b></div><h2 style="margin:8px 0">${passed?(r.score>=90?'Ajoyib natija! 🚀':'Yaxshi ish! 💪'):'Yana bir bor urinib ko‘r 💪'}</h2><p class="subhead">${r.correct} ta to‘g‘ri · ${Math.max(0,r.total-r.correct)} ta xato · ${r.total} ta savol</p><p class="subhead">${passed?'✓ Bugungi vazifa bajarildi.':'Kamida 70% natija kerak. Bu urinish kunlik vazifa sifatida saqlanmadi.'}</p><div style="margin-top:20px" class="stack"><button class="btn primary full" onclick="startTask('${r.id}')">${passed?'Bugungi mashqni yana bajarish':'Qayta bajarish'}</button><button class="btn secondary full" onclick="go('tasks')">Boshqa vazifa</button><button class="btn ghost full" onclick="go('home')">Asosiy oynaga qaytish</button></div></section>`}
const oldRender=render;render=function(){if(page==='result'){nav();$('#app').innerHTML=`<div class="top"><div class="brand"><div class="logo">✦</div><div><h1>English So‘z</h1><p>Natijangiz</p></div></div></div>${resultView()}`;return}oldRender()};
function openWordList(){const list=[...S.words].sort((a,b)=>a.translation.localeCompare(b.translation,'uz'));const body=list.length?'<p class="subhead">Jami '+list.length+' ta so‘z. Keraksiz so‘zni 🗑 tugmasi orqali o‘chirishingiz mumkin.</p><div style="max-height:55vh;overflow:auto">'+list.map((w,i)=>'<div class="list-item"><div style="min-width:0;flex:1"><b>'+(i+1)+'. '+esc(w.translation)+'</b><small>'+esc(w.added||'')+'</small></div><span class="badge">'+((w.done||[]).length?'Takrorlangan':'Yangi')+'</span><button class="btn danger small" style="margin-left:8px" onclick="deleteWord(&quot;'+esc(w.id)+'&quot;)" aria-label="So‘zni o‘chirish">🗑</button></div>').join('')+'</div>':'<p class="subhead">Hali so‘z qo‘shilmagan.</p>';modal('So‘zlar ro‘yxati',body)}
async function deleteWord(id){const w=S.words.find(x=>x.id===id);if(!w)return;const ok=await modal('So‘zni o‘chirish','<p class="subhead">“'+esc(w.word)+' — '+esc(w.translation)+'” lug‘atdan butunlay o‘chirilsinmi?</p>',[{text:'Bekor qilish',value:false},{text:'O‘chirish',value:true,primary:true}]);if(!ok)return;S.words=S.words.filter(x=>x.id!==id);for(const p of Object.values(S.progress||{})){if(Array.isArray(p.words))p.words=p.words.filter(x=>x!==id)}save();render();toast('So‘z o‘chirildi.');openWordList()}
function openTodayWords(){const list=dueWords();modal('Bugungi so‘zlar',list.length?`<p class="subhead">${list.length} ta so‘z mashq uchun tayyor. Inglizcha tarjimalar yashirilgan.</p><div style="max-height:55vh;overflow:auto">${list.map((w,i)=>`<div class="list-item"><b>${i+1}. ${esc(w.translation)}</b><span class="badge">Bugun</span></div>`).join('')}</div>`:'<p class="subhead">Bugun uchun so‘z yo‘q. Lug‘atga yangi so‘z qo‘shishingiz mumkin.</p>')}
let calendarMonthOffset=0;
function calendarBodyHTML(){
 const monthDate=new Date(new Date().getFullYear(),new Date().getMonth()+calendarMonthOffset,1),year=monthDate.getFullYear(),month=monthDate.getMonth(),first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7,monthKey=year+'-'+String(month+1).padStart(2,'0');let cells='';
 for(let i=0;i<offset;i++)cells+='<span></span>';
 for(let n=1;n<=days;n++){const d=new Date(year,month,n),k=dateKey(d),p=S.progress[k],m=p?.modes||{},count=Object.keys(m).length,vals=Object.values(m).map(v=>Number(v.score)||0),pct=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/4):0,cls=count===4?'full':count?'partial':'',tod=k===today()?'today':'';cells+='<button type="button" class="cal-day '+cls+' '+tod+'" title="'+pct+'% progress" aria-label="'+k+': '+pct+'% progress" onclick="showCalendarDay(\''+k+'\')">'+n+'</button>'}
 const completeDays=Object.keys(S.progress||{}).filter(k=>k.startsWith(monthKey+'-')&&Object.keys(S.progress[k]?.modes||{}).length===4).length;
 return '<div class="row spread" style="align-items:center;gap:8px"><button class="btn ghost small" onclick="changeCalendarMonth(-1)" aria-label="Oldingi oy">‹</button><b>'+monthDate.toLocaleDateString('uz-UZ',{month:'long',year:'numeric'})+'</b><button class="btn ghost small" onclick="changeCalendarMonth(1)" aria-label="Keyingi oy">›</button></div><p class="subhead" style="margin-top:10px">Kunni tanlab natijani ko‘ring. 🟢 To‘liq · 🟡 Qisman</p><div class="calendar" style="margin-top:15px">'+['Du','Se','Ch','Pa','Ju','Sh','Ya'].map(x=>'<div class="cal-head">'+x+'</div>').join('')+cells+'</div><div class="row spread" style="margin-top:15px"><span class="badge">Zanjir: '+streak()+' kun</span><span class="badge">Bu oy: '+completeDays+' to‘liq kun</span></div>';
}
function changeCalendarMonth(delta){calendarMonthOffset=Math.max(-240,Math.min(240,calendarMonthOffset+delta));const wrap=$('#modal-root .calendar-month-content');if(!wrap){openCalendar();return}wrap.style.setProperty('--calendar-slide',delta<0?'-22px':'22px');wrap.classList.remove('is-sliding');wrap.innerHTML=calendarBodyHTML();void wrap.offsetWidth;wrap.classList.add('is-sliding')}
function showCalendarDay(key){const p=S.progress[key],m=p?.modes||{},count=Object.keys(m).length,vals=Object.values(m).map(v=>Number(v.score)||0),pct=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/4):0,labels={flash:'Flashcard',match:'Moslashtirish',write:'Yozish',sentence:'Gap tuzish'},rows=Object.entries(m).map(([id,v])=>'<div class="list-item"><b>'+esc(labels[id]||id)+'</b><span class="badge">'+Math.round(Number(v.score)||0)+'%</span></div>').join(''),d=dayDate(key),dateLabel=d.toLocaleDateString('uz-UZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'});modal(dateLabel,'<div class="calendar-detail"><div><span class="subhead">Kunlik progress</span><br><strong>'+pct+'%</strong></div><span class="badge">'+count+'/4 mashq</span></div><div style="margin-top:12px">'+(rows||'<p class="subhead">Bu kunda hali mashq natijasi yo‘q.</p>')+'</div>')}
function openCalendar(){
 modal('Mashqlar kalendari','<div class="calendar-month-content">'+calendarBodyHTML()+'</div>');
 const el=$('#modal-root .modal');if(el&&!el.dataset.swipeBound){el.dataset.swipeBound='1';let x=0,y=0,t=0;const down=(px,py)=>{x=px;y=py;t=Date.now()};const up=(px,py)=>{const dx=px-x,dy=py-y,elapsed=Date.now()-t;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)*1.25){const distance=Math.abs(dx),speed=distance/Math.max(1,elapsed),steps=Math.min(3,Math.max(1,Math.round(distance/95)+Math.min(2,Math.floor(speed*5))));changeCalendarMonth((dx<0?1:-1)*steps)}};el.addEventListener('touchstart',e=>{const q=e.changedTouches[0];down(q.clientX,q.clientY)},{passive:true});el.addEventListener('touchend',e=>{const q=e.changedTouches[0];up(q.clientX,q.clientY)},{passive:true});el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')down(e.clientX,e.clientY)},{passive:true});el.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')up(e.clientX,e.clientY)},{passive:true})}
}
async function confirmLogout(){const ok=await modal('Google profilidan chiqilsinmi?','<p class="subhead">Chiqishdan oldin saqlash tugaydi. Lug‘at Google Drive va shu hisobga bog‘langan zaxirada saqlanadi.</p>',[{text:'Bekor qilish',value:false},{text:'Ha, chiqish',value:true,primary:true}]);if(ok&&typeof cloudLogout==='function'){await cloudLogout();toast('Google profili uzildi.');render()}}
function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`english-soz-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast('Zaxira fayli tayyor.')}
async function importData(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.words))throw Error('format');const ok=await modal('Ma’lumotni tiklash','<p class="subhead">Joriy lug‘at o‘rniga zaxiradagi ma’lumotlar yuklanadi. Avval eksport qilib qo‘yish tavsiya etiladi.</p>',[{text:'Bekor qilish',value:false},{text:'Tiklash',value:true,primary:true}]);if(!ok)return;S={...defaults(),...data,set:{...defaults().set,...data.set}};S.words=S.words.map(w=>({...w,id:String(w.id||uid()),done:Array.isArray(w.done)?w.done:[],examples:normalizeExamples(w.examples,w.example)}));save();render();toast('Ma’lumot tiklandi.')}catch{toast('JSON faylni o‘qib bo‘lmadi.')}}
async function aiRegenerate(id){const w=S.words.find(x=>x.id===id);if(!w)return;toast('AI misollar tayyorlanmoqda…');try{w.examples={...w.examples,...await aiExamples(w.word,w.translation)};save();render();toast('Misollar yangilandi.')}catch(e){console.warn(e);toast('Groq API kalitini tekshiring yoki qayta kiriting.')}}
function init(){progressFor();try{document.body.dataset.theme=localStorage.getItem('english-soz-theme')||'night'}catch{document.body.dataset.theme='night'}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn)}init();
</script></body></html>
