<script src="https://accounts.google.com/gsi/client" async defer></script><script src="config.js"></script><script src="cloud.js"></script><script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const defaults=()=>({words:[],progress:{},cache:{s:{},t:{}},set:{sound:true,vib:true,accent:'en-US'},history:{}});
let S=defaults();
let aiApiKey='';
S.words=(Array.isArray(S.words)?S.words:[]).map(w=>({...w,id:String(w.id||uid()),word:String(w.word||''),translation:String(w.translation||''),added:w.added||today(),done:Array.isArray(w.done)?w.done:[],examples:normalizeExamples(w.examples,w.example)}));
function normalizeExamples(ex,old){if(ex&&typeof ex==='object')return ex;return {easy:old?{en:String(old),uz:''}:null,normal:null,hard:null}}
const MODES=[{id:'flash',icon:'🪄',title:'Flashcard',desc:'So‘zni eslab qolish'},{id:'match',icon:'🧩',title:'Moslashtirish',desc:'So‘z va tarjimani topish'},{id:'write',icon:'⌨️',title:'Yozish',desc:'Inglizchasini yozish'},{id:'sentence',icon:'✍️',title:'Gap tuzish',desc:'Gapni tarjima qilib yozish'}];
let page='home',task=null,modalResolve=null,flash=null,match=null,write=null,sentence=null,translator={sl:'en',tl:'uz',result:'',examples:[]},matchState=null;
function progressFor(k=today()){if(!S.progress[k])S.progress[k]={words:S.words.filter(w=>due(w)).map(w=>w.id),modes:{},tasks:{},score:0};const p=S.progress[k];p.modes=p.modes||{};p.tasks=p.tasks||{};if(!Array.isArray(p.words))p.words=[];return p}
function due(w){const done=w.done||[];const intervals=[0,1,3,7,14,30,60];const next=intervals.find(n=>!done.includes(n));if(next===undefined)return false;const added=new Date(w.added||today()+'T00:00:00');added.setHours(0,0,0,0);const dueDate=new Date(added);dueDate.setDate(dueDate.getDate()+next);return dueDate<=new Date(today()+'T23:59:59')}
function dueWords(){const p=progressFor();const ids=new Set(p.words);let arr=S.words.filter(w=>ids.has(w.id));if(!arr.length)arr=S.words.filter(due);return arr}
function saveLocal(){try{localStorage.removeItem('eng')}catch{}}function save(){saveLocal();if(typeof cloudSaveDebounced==='function')cloudSaveDebounced()}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2400)}
function sound(ok=true){if(!S.set.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=ok?740:230;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.055,c.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.12);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.13);o.onended=()=>c.close()}catch{}}
function vibrate(pattern=25){if(S.set.vib&&navigator.vibrate)navigator.vibrate(pattern)}
function haptic(ok=true){sound(ok);vibrate(ok?22:[35,30,35])}
function modal(title,body,buttons=[{text:'Yopish',value:false}]){return new Promise(resolve=>{modalResolve=resolve;$('#modal-root').innerHTML=`<div class="modal-back" role="presentation"><section class="modal" role="dialog" aria-modal="true"><h3>${title}</h3>${body}<div class="modal-actions">${buttons.map((b,i)=>`<button class="btn ${b.primary?'primary':'ghost'}" data-modal="${i}">${esc(b.text)}</button>`).join('')}</div></section></div>`;$('#modal-root').querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>{const v=buttons[+b.dataset.modal].value;$('#modal-root').innerHTML='';resolve(v)});$('#modal-root').querySelector('.modal-back').addEventListener('click',e=>{if(e.target.classList.contains('modal-back')){ $('#modal-root').innerHTML='';resolve(false)}})})}
function nav(){const items=[['home','⌂','Asosiy'],['tasks','✓','Vazifalar'],['translator','⇄','Tarjimon'],['profile','◉','Profil']];$('#nav').innerHTML=items.map(([id,ic,t])=>`<button class="${page===id?'active':''}" data-page="${id}"><span class="navicon">${ic}</span><span>${t}</span></button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){page=p;task=null;render();window.scrollTo({top:0,behavior:'smooth'});haptic(true)}
function header(title,sub=''){return `<div class="screen-title"><div><div class="eyebrow">ENGLISH SO‘Z / ${page==='home'?'OVERVIEW':page.toUpperCase()}</div><h2>${title}</h2><p class="subhead">${sub}</p></div></div>`}
function bar(pct){return `<div class="bar ${pct===0?'zero':''}"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`}
function percentToday(){const p=progressFor();return Math.round(Object.keys(p.modes).filter(k=>p.modes[k]).length/4*100)}
function streak(){let d=new Date(today()),n=0;const has=()=>{const p=S.progress[dateKey(d)];return p&&Object.keys(p.modes||{}).length>0};if(!has())d.setDate(d.getDate()-1);while(has()&&n<400){n++;d.setDate(d.getDate()-1)}return n}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function home(){const p=progressFor(),pct=percentToday(),done=Object.keys(p.modes).length,dues=dueWords();return `${header('Bugun o‘zingni rivojlantir','Kichik qadamlar — katta natijalar.')}
<div class="panel"><div class="progress-head"><span>Bugungi vazifalar:</span><span class="percent">${pct}%</span></div><div class="subhead" style="margin-top:4px">${done}/4 vazifa bajarildi${done===4?' · Ajoyib! 🏆':''}</div>${bar(pct)}<div class="row spread" style="margin-top:13px"><small>${new Date().toLocaleDateString('uz-UZ',{weekday:'long',day:'numeric',month:'long'})}</small><span class="badge">${done===4?'Kun yakunlandi':'Davom etamiz'}</span></div></div>
<div class="panel"><div class="quick"><button onclick="openCalendar()"><span class="qicon">🔥</span><span class="qnum">${streak()}</span><span class="qlabel">Kunlik zanjir</span></button><button onclick="openWordList()"><span class="qicon">📚</span><span class="qnum">${S.words.length}</span><span class="qlabel">So‘zlar ro‘yxati</span></button><button onclick="go('add')"><span class="qicon">✚</span><span class="qnum">Qo‘shish</span><span class="qlabel">Yangi so‘z</span></button><button onclick="openTodayWords()"><span class="qicon">🔔</span><span class="qnum">${dues.length}</span><span class="qlabel">Bugungi so‘zlar</span></button></div></div>
<div class="home-grid"><section class="panel"><div class="row spread"><div><div class="eyebrow">HAFTALIK NATIJA</div><h3 class="section-title" style="margin-top:5px">Mashq grafigi</h3></div><span class="badge">7 kun</span></div><div class="chart-wrap">${chart()}</div><p class="subhead">Har bir vazifadagi natijalar o‘rtachasi. Bajarilmagan kun 0% bo‘lib ko‘rinadi.</p></section><section class="panel"><div class="eyebrow">BUGUNGI REJA</div><h3 class="section-title" style="margin-top:5px">Davom ettirish</h3><div class="task-list" style="grid-template-columns:1fr">${MODES.map(m=>`<div class="task-card" onclick="startTask('${m.id}')"><div class="task-icon">${m.icon}</div><div class="task-copy"><b>${m.title}</b><small>${m.desc}</small><span class="task-state ${p.modes[m.id]?'done':''}">${p.modes[m.id]?'✓ Bajarildi':'Boshlash'}</span></div><span class="task-right">›</span></div>`).join('')}</div></section></div>`}
function chart(){const now=new Date(),days=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);const k=dateKey(d),p=S.progress[k],m=p?.modes||{},vals=Object.values(m).map(x=>Number(x.score)||0);const pct=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/4):0;days.push({k,label:d.toLocaleDateString('uz-UZ',{weekday:'short'}).replace('.',''),pct})}const W=520,H=220,L=34,R=10,T=12,B=30,iw=W-L-R,ih=H-T-B;const ys=[0,25,50,75,100].map(v=>`<g><line x1="${L}" y1="${T+ih*(1-v/100)}" x2="${W-R}" y2="${T+ih*(1-v/100)}" stroke="#ffffff12"/><text x="${L-7}" y="${T+ih*(1-v/100)+4}" fill="#9cabc4" font-size="10" text-anchor="end">${v}</text></g>`).join('');const pts=days.map((d,i)=>`${L+iw*i/6},${T+ih*(1-d.pct/100)}`).join(' ');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="So‘nggi yetti kun natijalari foizda">${ys}<polyline points="${pts}" fill="none" stroke="#55e6d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${days.map((d,i)=>{const x=L+iw*i/6,y=T+ih*(1-d.pct/100);return `<circle cx="${x}" cy="${y}" r="4.5" fill="#55e6d0" stroke="#112033" stroke-width="2"><title>${d.k}: ${d.pct}%</title></circle><text x="${x}" y="${H-8}" fill="#9cabc4" font-size="11" text-anchor="middle">${esc(d.label)}</text>`}).join('')}</svg>`}
function tasksPage(){const p=progressFor(),done=Object.keys(p.modes).length,pct=Math.round(done/4*100);return `${header('Vazifalar','Bugungi so‘zlarni 4 xil usulda mashq qil.') }<div class="panel"><div class="progress-head"><span>Bajarildi: ${done}/4</span><span class="percent">${pct}%</span></div>${bar(pct)}</div><div class="task-list">${MODES.map(m=>`<div class="task-card" onclick="startTask('${m.id}')"><div class="task-icon">${m.icon}</div><div class="task-copy"><b>${m.title}</b><small>${m.desc}</small><span class="task-state ${p.modes[m.id]?'done':''}">${p.modes[m.id]?`✓ ${p.modes[m.id].score}% natija`:'Kutmoqda'}</span></div><span class="task-right">›</span></div>`).join('')}</div><p class="footnote">So‘z qo‘shilmagan bo‘lsa, avval profil yoki asosiy oynadan so‘z qo‘shing.</p>`}
function render(){nav();const app=$('#app');if(page==='home')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">✦</div><div><h1>English So‘z</h1><p>Learn a little. Grow every day.</p></div></div>${cloud?.user?.picture?`<img class="avatar" src="${esc(cloud.user.picture)}" alt="Profil rasmi">`:`<div class="avatar" style="display:grid;place-items:center">✦</div>`}</div>${home()}`;else if(page==='tasks')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">✓</div><div><h1>English So‘z</h1><p>Bugungi mashqlar</p></div></div></div>${tasksPage()}`;else if(page==='translator')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">⇄</div><div><h1>Tarjimon</h1><p>English ↔ O‘zbek</p></div></div></div>${translatorPage()}`;else if(page==='profile')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">◉</div><div><h1>Profil</h1><p>Sozlamalar va hisob</p></div></div></div>${profilePage()}`;else if(page==='add')app.innerHTML=`<div class="top"><button class="btn ghost small" onclick="go('home')">← Orqaga</button><div class="eyebrow">YANGI LUG‘AT</div></div>${addPage()}`;else app.innerHTML=`<div class="top"><button class="btn ghost small" onclick="go('home')">← Menyu</button></div>${taskView()}`;bindPage();if(typeof cloudRender==='function')cloudRender()}
function bindPage(){if(page==='add'){const f=$('#add-form');if(f)f.onsubmit=async e=>{e.preventDefault();await addWord(new FormData(f))}}if(page==='translator'){const b=$('#translate-btn');if(b)b.onclick=translateText;$('#swap')?.addEventListener('click',()=>{[translator.sl,translator.tl]=[translator.tl,translator.sl];render()});$('#read-src')?.addEventListener('click',()=>speak($('#src').value,translator.sl));$('#read-dst')?.addEventListener('click',()=>speak(translator.result,translator.tl));$('#src')?.addEventListener('input',()=>{translator.result='';$('#dst').textContent='Tarjima shu yerda ko‘rinadi';});}}
function addPage(){return `${header('So‘z qo‘shish','Inglizcha so‘zni yozing — o‘zbekcha tarjima avtomatik chiqadi.')}<form id="add-form" class="panel stack"><label class="fieldbox"><span class="field-label">Inglizcha so‘z</span><input class="field" name="word" required maxlength="100" placeholder="e.g. curious" autocomplete="off" onblur="autoTranslateWord(this.value)"></label><label class="fieldbox"><span class="field-label">Asosiy tarjima (avtomatik)</span><input class="field" id="auto-translation" name="translation" required maxlength="180" placeholder="Tarjima avtomatik chiqadi" readonly></label><label class="fieldbox"><span class="field-label">Qo‘shimcha tarjima (ixtiyoriy)</span><input class="field" name="customTranslation" maxlength="180" placeholder="O‘zingizning izoh yoki muqobil tarjimangiz"></label><label class="fieldbox"><span class="field-label">Ixtiyoriy o‘z misolingiz</span><textarea class="field" name="example" rows="2" placeholder="I am curious about space."></textarea></label><button class="btn primary full" type="submit">✦ So‘zni saqlash va AI gaplar tayyorlash</button><p class="subhead">AI misol gaplar uchun Profil bo‘limida Gemini API kalitini kiriting.</p></form>`}
async function addWord(fd){const word=String(fd.get('word')||'').trim(),translation=String(fd.get('translation')||'').trim(),customTranslation=String(fd.get('customTranslation')||'').trim(),example=String(fd.get('example')||'').trim();if(!word)return toast('Inglizcha so‘zni kiriting.');let auto=translation;if(!auto){try{auto=await lookupTranslation(word)}catch{ return toast('Tarjima olinmadi. Internetni tekshiring.')}}if(!auto)return toast('Tarjima olinmadi.');const finalTranslation=customTranslation?`${auto} (${customTranslation})`:auto;if(S.words.some(w=>w.word.toLocaleLowerCase()===word.toLocaleLowerCase()))return toast('Bu so‘z ro‘yxatda bor.');const w={id:uid(),word,translation:finalTranslation,added:today(),done:[],examples:{easy:example?{en:example,uz:''}:null,normal:null,hard:null}};S.words.push(w);const p=progressFor();if(!p.words.includes(w.id))p.words.push(w.id);save();render();toast('So‘z saqlandi. AI misollar tayyorlanmoqda…');if(example)w.examples.easy={en:example,uz:''};try{const ex=await aiExamples(word,translation);if(ex){w.examples={...w.examples,...ex};save();toast('Uch darajadagi misol gaplar tayyor!')}}catch(e){console.warn(e);toast('So‘z saqlandi, AI misollarini keyin sozlash mumkin.')}render()}
function profilePage(){const user=cloud?.user||null;return `${header('Shaxsiy profil','O‘rganish jarayoningizni boshqaring.')}<section class="panel"><div class="row" style="gap:14px">${user?.picture?`<img class="avatar" style="width:62px;height:62px" src="${esc(user.picture)}" alt="Profil rasmi">`:`<div class="logo" style="width:62px;height:62px;border-radius:50%">${user?'◉':'🔐'}</div>`}<div style="flex:1"><h3 style="margin:0 0 4px">${esc(user?.name||'Google profiliga ulaning')}</h3><p class="subhead">${esc(user?.email||(cloud?.ready?'Google Drive ulangan':'Ma’lumotlar qurilmada saqlanadi'))}</p></div></div><div id="cloud-status" class="subhead" style="margin-top:14px">${cloud?.ready?'☁️ Google Drive bilan sinxronlash faol':user?'Profil eslab qolingan. Sinxronlash uchun Google ruxsati kerak bo‘lishi mumkin.':'Google akkaunt ulanmagan.'}</div><div id="cloud-actions" style="margin-top:12px">${user?`<button class="btn secondary full" onclick="cloudLogin()">☁️ Google Drive’ni ulash / yangilash</button>`:`<button class="btn primary full" onclick="cloudLogin()">Google orqali kirish</button>`}</div></section><section class="panel"><h3 class="section-title">Gemini AI agenti</h3><p class="subhead">Shaxsiy Gemini API kalitingiz shu sahifa ochiq turgan vaqt ichida xotirada saqlanadi; qayta yuklaganda qayta kiritasiz. Kalit Drive yoki localStorage’ga yozilmaydi. Brauzer ichidagi kalitni mutlaq himoyalashning iloji yo‘q.</p><label class="fieldbox" style="display:block;margin-top:12px"><span class="field-label">Gemini API key</span><input id="gemini-key" class="field" type="password" autocomplete="off" placeholder="AIza…"></label><div class="row" style="margin-top:10px"><button class="btn primary" onclick="saveAiKey()">Kalitni ishlatish</button><button class="btn ghost" onclick="clearAiKey()">Tozalash</button></div><p class="subhead" style="margin-top:8px">Holat: <b>${aiApiKey?'Kalit joriy sessiyada kiritilgan':'Kalit kiritilmagan'}</b></p></section><section class="panel"><h3 class="section-title">Sozlamalar</h3><div class="settings-row"><div><b>Ovoz</b><div class="subhead">Tugma bosilganda yumshoq signal</div></div><input class="switch" type="checkbox" ${S.set.sound?'checked':''} onchange="S.set.sound=this.checked;save();haptic(this.checked);render()"></div><div class="settings-row"><div><b>Vibratsiya</b><div class="subhead">Telefon qo‘llab-quvvatlasa</div></div><input class="switch" type="checkbox" ${S.set.vib?'checked':''} onchange="S.set.vib=this.checked;save();render()"></div><div class="settings-row"><div><b>So‘z qo‘shish</b><div class="subhead">Yangi lug‘at va misol gaplar</div></div><button class="btn ghost small" onclick="go('add')">Ochish →</button></div><div class="settings-row"><div><b>Tarjimon</b><div class="subhead">Matn tarjimasi va talaffuz</div></div><button class="btn ghost small" onclick="go('translator')">Ochish →</button></div><div class="settings-row"><div><b>Zaxira nusxasi</b><div class="subhead">Lug‘atni JSON faylga saqlash</div></div><button class="btn ghost small" onclick="exportData()">Eksport</button></div><div class="settings-row"><div><b>Ma’lumotni tiklash</b><div class="subhead">Avvalgi zaxira faylidan</div></div><button class="btn ghost small" onclick="$('#import-file').click()">Import</button><input id="import-file" class="hide" type="file" accept="application/json" onchange="importData(this.files[0])"></div><div class="settings-row"><div><b>Chiqish</b><div class="subhead">Google profilini uzish</div></div><button class="btn danger small" onclick="confirmLogout()">Chiqish →</button></div></section>`}
function translatorPage(){return `${header('Tarjimon','Matnni tarjima qiling, talaffuzini tinglang va misol gaplarni ko‘ring.')}<section class="panel"><div class="row spread" style="margin-bottom:12px"><span class="badge">${translator.sl==='en'?'🇺🇸 English':'🇺🇿 O‘zbekcha'}</span><button id="swap" class="btn ghost small">⇄ Almashtirish</button><span class="badge">${translator.tl==='uz'?'🇺🇿 O‘zbekcha':'🇺🇸 English'}</span></div><div class="translator"><div class="board"><label class="field-label">Matn</label><textarea id="src" class="field" placeholder="Matnni kiriting…">${esc(translator.source||'')}</textarea><button id="read-src" class="btn ghost small">🔊 O‘qish</button></div><div class="board"><label class="field-label">Tarjima</label><div id="dst" class="field output">${esc(translator.result||'Tarjima shu yerda ko‘rinadi')}</div><button id="read-dst" class="btn ghost small">🔊 O‘qish</button></div></div><button id="translate-btn" class="btn primary full" style="margin-top:12px">Tarjima qilish ✦</button>${translatorCanAddWord()?'<button id="translator-add-word" class="btn secondary full" style="margin-top:8px" onclick="addTranslatorWord()">📚 Lug‘atga qo‘shish</button>':''}<p class="subhead" style="margin-top:9px">Ovozli o‘qish brauzer imkoniyatiga bog‘liq. Aksent: <select class="field" style="display:inline-block;width:auto;padding:6px 9px" onchange="S.set.accent=this.value;save()"><option value="en-US" ${S.set.accent==='en-US'?'selected':''}>American English</option><option value="en-GB" ${S.set.accent==='en-GB'?'selected':''}>British English</option></select></p></section><section class="panel"><div class="eyebrow">EXAMPLE SENTENCES</div><h3 class="section-title" style="margin-top:5px">Misol gaplar</h3><div id="translator-examples">${translator.examples.length?translator.examples.map(x=>`<div class="example"><p>${esc(x.en||'')}</p><p class="subhead">${esc(x.uz||'')}</p></div>`).join(''):'<p class="subhead">Misol gaplar hozircha yo‘q. Matn tarjima qilinganda, mavjud bo‘lsa, misollar shu yerda ko‘rinadi.</p>'}</div></section>`}
function translatorCanAddWord(){const source=String(translator.source||'').trim();return translator.sl==='en'&&translator.tl==='uz'&&/^[A-Za-z][A-Za-z'’-]*$/.test(source)&&String(translator.result||'').trim().length>0&&!/[.!?\n]/.test(translator.result)}
function addTranslatorWord(){if(!translatorCanAddWord())return toast('Faqat bitta inglizcha so‘zni tarjima qiling.');const word=translator.source.trim(),translation=translator.result.trim();if(S.words.some(w=>w.word.toLowerCase()===word.toLowerCase()))return toast('Bu so‘z lug‘atda bor.');const w={id:uid(),word,translation,added:today(),done:[],examples:{easy:null,normal:null,hard:null}};S.words.push(w);const p=progressFor();if(!p.words.includes(w.id))p.words.push(w.id);save();toast('So‘z lug‘atga qo‘shildi.');render()}
async function translateText(){const textIn=$('#src')?.value.trim();if(!textIn)return toast('Avval matn kiriting.');translator.source=textIn;const btn=$('#translate-btn');btn.disabled=true;btn.textContent='Tarjima qilinmoqda…';try{const u=new URL('https://translate.googleapis.com/translate_a/single');u.searchParams.set('client','gtx');u.searchParams.set('sl',translator.sl);u.searchParams.set('tl',translator.tl);u.searchParams.set('q',textIn);u.searchParams.append('dt','t');u.searchParams.append('dt','bd');u.searchParams.append('dt','ex');const res=await fetch(u);if(!res.ok)throw Error('Tarjima xizmati javob bermadi');const data=await res.json();translator.result=(data[0]||[]).map(x=>x[0]||'').join('');translator.examples=[];for(const group of (data[12]||[])){for(const ex of (group[2]||[])){if(ex[0])translator.examples.push({en:ex[0],uz:ex[1]||''})}}if(!translator.examples.length&&data[1])for(const x of data[1].slice(0,4))if(x[0])translator.examples.push({en:x[0],uz:x[1]||''});save();render();}catch(e){toast('Tarjima olinmadi. Internetni tekshiring.')}finally{const b=$('#translate-btn');if(b){b.disabled=false;b.textContent='Tarjima qilish ✦'}}}
function speak(text,lang){if(!('speechSynthesis'in window))return toast('Bu brauzer ovozli o‘qishni qo‘llamaydi.');const t=String(text||'').trim();if(!t)return toast('O‘qish uchun matn yo‘q.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang==='en'?(S.set.accent||'en-US'):'uz-UZ';const voices=speechSynthesis.getVoices();if(lang==='en'){const v=voices.find(v=>v.lang===u.lang)||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v}speechSynthesis.speak(u)}
async function lookupTranslation(word){const u=new URL('https://translate.googleapis.com/translate_a/single');u.searchParams.set('client','gtx');u.searchParams.set('sl','en');u.searchParams.set('tl','uz');u.searchParams.set('dt','t');u.searchParams.set('q',word);const r=await fetch(u);if(!r.ok)throw Error('translate');const d=await r.json();return (d[0]||[]).map(x=>x[0]||'').join('').trim()}
let translationTimer=null;function autoTranslateWord(word){clearTimeout(translationTimer);const el=$('#auto-translation');if(!el)return;const value=String(word||'').trim();if(!value){el.value='';return}translationTimer=setTimeout(async()=>{try{el.value=await lookupTranslation(value)}catch{el.value=''}},250)}
function saveAiKey(){const key=$('#gemini-key')?.value.trim();if(!key)return toast('Gemini API kalitini kiriting.');aiApiKey=key;toast('Gemini kaliti joriy sessiyada faol.');render()}
function clearAiKey(){aiApiKey='';const input=$('#gemini-key');if(input)input.value='';toast('AI kaliti xotiradan tozalandi.');render()}
async function aiExamples(word,translation){if(!aiApiKey)throw Error('Gemini API kaliti kiritilmagan');const prompt=`Create exactly three short English example sentences for the word "${word}" meaning "${translation}". Return ONLY valid JSON with this shape: {"examples":{"easy":{"en":"...","uz":"..."},"normal":{"en":"...","uz":"..."},"hard":{"en":"...","uz":"..."}}}. Uzbek translations should be natural.`;const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':aiApiKey},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0.5}})});if(!res.ok)throw Error('Gemini API xatosi '+res.status);const data=await res.json();let raw=data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';raw=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');const parsed=JSON.parse(raw);const examples=parsed.examples||parsed;if(!examples.easy||!examples.normal||!examples.hard)throw Error('Gemini javobi noto‘g‘ri');return examples}
function taskView(){if(!task)return tasksPage();if(task==='flash')return flashView();if(task==='match')return matchView();if(task==='write')return writeView();return sentenceView()}
function startTask(id){if(!S.words.length){go('add');toast('Avval so‘z qo‘shing.');return}task=id;const p=progressFor();let list=dueWords();if(!list.length)list=S.words.slice();if(id==='flash')flash={items:[...list],all:[...list],index:0,miss:new Set(),revealed:false,correct:0};if(id==='match')match={pool:[...list],all:[...list],miss:new Set(),correct:0,round:0,selectedL:null,selectedR:null,usedL:new Set(),usedR:new Set(),pairs:[],statusL:{},statusR:{},solved:new Set()};if(id==='write')write={items:[...list],all:[...list],index:0,miss:new Set(),correct:0,feedback:''};if(id==='sentence'){sentence={items:[...list],all:[...list],index:0,miss:new Set(),correct:0,level:sentenceLevel(list[0]),feedback:''};}page='task';render();window.scrollTo({top:0,behavior:'smooth'})}
function sentenceLevel(w){const weeks=Math.floor((Date.now()-new Date(w?.added||today()).getTime())/(7*86400000));return weeks===0?'easy':weeks===1?'normal':weeks===2?'hard':'mixed'}
function levelFor(w){const n=Math.floor((Date.now()-new Date(w.added||today()).getTime())/(7*86400000));return n===0?'easy':n===1?'normal':n===2?'hard':['easy','normal','hard'][Math.floor(Math.random()*3)]}
function taskHeader(id,idx,total){const p=progressFor(),done=Object.keys(p.modes).length;return `<div class="row spread" style="margin:8px 0 15px"><button class="btn ghost small" onclick="go('tasks')">← Vazifalar</button><span class="task-count">${Math.min(idx+1,total)} / ${total}</span></div><div class="panel flat"><div class="progress-head"><span>Bajarildi: ${done}/4</span><span class="percent">${Math.round(done/4*100)}%</span></div>${bar(done/4*100)}</div>`}
function flashView(){const f=flash;if(!f||!f.items.length)return `${taskHeader('flash',0,0)}<div class="panel">Mashq uchun so‘z topilmadi.</div>`;const w=f.items[0];return `${taskHeader('flash',f.index,f.all.length)}<section class="panel task-area"><div class="eyebrow">FLASHCARD</div><div class="flash-word">${esc(w.translation)}</div><div class="flip-space">${f.revealed?`<div><div class="translation">${esc(w.word)}</div><button class="btn ghost small" style="margin-top:8px" onclick="speak('${esc(w.word).replace(/'/g,"\\'")}','en')">🔊 Tinglash</button></div>`:`<button class="btn primary" onclick="flash.revealed=true;render()">O‘girish ↻</button>`}</div><p class="subhead">Avval tarjimani eslashga harakat qiling.</p>${f.revealed?`<div class="row" style="margin-top:20px"><button class="btn danger full" onclick="flashAnswer(false)">✕ Bilmadim</button><button class="btn primary full" onclick="flashAnswer(true)">✓ Bildim</button></div>`:''}</section>`}
function flashAnswer(ok){const f=flash,w=f.items.shift();if(ok)f.correct++;else{f.miss.add(w.id);f.items.push(w)}f.revealed=false;f.index++;haptic(ok);if(f.items.length===0||f.index>=f.all.length*3+3){finishTask('flash',f.correct,f.all.length,f.miss);return}if(f.miss.size&&f.items.length===0)f.items=[...f.all.filter(x=>f.miss.has(x.id))];render()}
function nextMatchBatch(){const m=match;if(m.pool.length===0){if(m.miss.size){m.pool=m.all.filter(w=>m.miss.has(w.id));m.miss.clear();m.round++;if(m.round>2){finishTask('match',m.correct,m.all.length,new Set());return}}else{finishTask('match',m.correct,m.all.length,new Set());return}}m.pairs=m.pool.splice(0,Math.min(10,m.pool.length));m.left=[...m.pairs].sort(()=>Math.random()-.5);m.right=[...m.pairs].sort(()=>Math.random()-.5);m.selectedL=null;m.selectedR=null;m.usedL=new Set();m.usedR=new Set();m.statusL={};m.statusR={};m.solved=m.solved||new Set();}
function matchView(){const m=match;if(!m.pairs.length)nextMatchBatch();if(!m.pairs.length)return `<div class="panel">Tayyor!</div>`;return `${taskHeader('match',m.correct,m.all.length)}<section class="panel"><div class="eyebrow">MOSLASHTIRISH</div><h3 class="section-title" style="margin-top:5px">Tarjima juftini toping</h3><p class="subhead" style="margin-bottom:15px">${m.pairs.length-m.usedL.size} ta juftlik qoldi · xatolar keyingi guruhda qaytadi.</p><div class="choices">${m.left.map(w=>`<button class="choice ${m.selectedL===w.id?'selected':''} ${m.statusL[w.id]==='ok'?'correct':''} ${m.statusL[w.id]==='bad'?'wrong':''}" ${m.usedL.has(w.id)?'disabled':''} onclick="matchPick('L','${w.id}')">${esc(w.translation)}</button>`).join('')}${m.right.map(w=>`<button class="choice ${m.selectedR===w.id?'selected':''} ${m.statusR[w.id]==='ok'?'correct':''} ${m.statusR[w.id]==='bad'?'wrong':''}" ${m.usedR.has(w.id)?'disabled':''} onclick="matchPick('R','${w.id}')">${esc(w.word)}</button>`).join('')}</div></section>`}
function matchPick(side,id){const m=match;if((side==='L'&&m.usedL.has(id))||(side==='R'&&m.usedR.has(id)))return;if(side==='L')m.selectedL=id;else m.selectedR=id;if(m.selectedL&&m.selectedR){const l=m.selectedL,r=m.selectedR;m.selectedL=null;m.selectedR=null;if(l===r){m.usedL.add(l);m.usedR.add(r);m.statusL[l]='ok';m.statusR[r]='ok';m.miss.delete(l);m.miss.delete(r);if(!m.solved.has(l)){m.solved.add(l);m.correct++}haptic(true)}else{m.statusL[l]='bad';m.statusR[r]='bad';m.miss.add(l);m.miss.add(r);haptic(false)}const done=m.usedL.size===m.pairs.length;render();if(done)setTimeout(()=>{nextMatchBatch();render()},450);else if(l!==r)setTimeout(()=>{if(m.statusL[l]==='bad')m.statusL[l]='';if(m.statusR[r]==='bad')m.statusR[r]='';render()},650)}else render()}
function writeView(){const w=write.items[0];if(!w)return `<div class="panel">Mashq yakunlandi.</div>`;return `${taskHeader('write',write.index,write.all.length)}<section class="panel"><div class="eyebrow">YOZISH</div><div class="flash-word" style="font-size:30px">${esc(w.translation)}</div><form onsubmit="event.preventDefault();checkWrite()"><label class="field-label" for="answer">Inglizchasini yozing</label><div class="answerline"><input id="answer" class="field" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the English word" value=""/><button class="btn primary" type="submit">Tekshirish</button></div></form><div id="feedback" style="margin-top:14px">${write.feedback?`<p>${esc(write.feedback)}</p>`:''}</div></section>`}
function checkWrite(){const input=$('#answer'),val=input?.value.trim();if(!val)return toast('Javobni yozing.');const w=write.items[0];if(norm(val)===norm(w.word)){write.correct++;write.feedback=`✓ To‘g‘ri: ${w.word}`;haptic(true)}else{write.miss.add(w.id);write.feedback=`To‘g‘ri javob: ${w.word}`;haptic(false)}write.items.shift();write.index++;if(!write.items.length){finishTask('write',write.correct,write.all.length,write.miss);return}render()}
function norm(s){return String(s||'').toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘`]/g,"'").replace(/[^\p{L}\p{N}' ]/gu,' ').replace(/\s+/g,' ').trim()}
function sentenceView(){const w=sentence.items[0];if(!w)return `<div class="panel">Mashq yakunlandi.</div>`;if(sentence.currentIndex!==sentence.index){sentence.currentIndex=sentence.index;sentence.currentLevel=levelFor(w)}const level=sentence.currentLevel||levelFor(w),ex=w.examples?.[level]||w.examples?.easy||w.examples?.normal||w.examples?.hard;return `${taskHeader('sentence',sentence.index,sentence.all.length)}<section class="panel"><div class="eyebrow">GAP TUZISH · ${level==='easy'?'EASY':level==='normal'?'NORMAL':level==='hard'?'HARD':'MIXED'}</div><p class="subhead">Quyidagi gapning inglizchasini yozing.</p><div class="flash-word" style="font-size:25px">${esc(ex?.uz||`“${w.translation}” so‘zi qatnashgan gapni tarjima qiling`)}</div>${ex?.uz?`<p class="subhead">Asosiy so‘z: ${esc(w.translation)}</p>`:`<p class="subhead">Bu so‘z uchun AI misol gaplar hali yo‘q. Profilingizdagi AI endpointni sozlang yoki so‘zni keyin qayta yarating.</p>`}<form onsubmit="event.preventDefault();checkSentence()"><textarea id="sentence-answer" class="field" rows="3" placeholder="Write the English sentence…" style="margin:12px 0"></textarea><button class="btn primary full" type="submit">Tekshirish</button></form><div id="sentence-feedback" class="subhead" style="margin-top:12px"></div></section>`}
function checkSentence(){const input=$('#sentence-answer'),val=input?.value.trim();if(!val)return toast('Javobni yozing.');const w=sentence.items[0],level=sentence.currentLevel||levelFor(w),ex=w.examples?.[level]||w.examples?.easy||w.examples?.normal||w.examples?.hard;if(!ex?.en){sentence.miss.add(w.id);sentence.items.shift();sentence.index++;if(!sentence.items.length)finishTask('sentence',sentence.correct,sentence.all.length,sentence.miss);else render();return}const a=norm(val),b=norm(ex.en);const score=a===b?100:wordOverlap(a,b);if(score>=.72)sentence.correct++;else sentence.miss.add(w.id);sentence.feedback=`${score>=.72?'✓ Yaxshi!':'To‘g‘ri javob:'} ${ex.en}`;$('#sentence-feedback').textContent=sentence.feedback;const next=$('.panel form button');if(next){next.textContent='Keyingi gap →';next.onclick=e=>{e.preventDefault();sentence.items.shift();sentence.index++;if(!sentence.items.length)finishTask('sentence',sentence.correct,sentence.all.length,sentence.miss);else render()}}haptic(score>=.72)}
function wordOverlap(a,b){const aa=new Set(a.split(' ')),bb=b.split(' ');if(!bb.length)return 0;return bb.filter(x=>aa.has(x)).length/bb.length}
function finishTask(id,correct,total,miss=new Set()){const p=progressFor();const score=total?Math.round(correct/total*100):0;p.modes[id]={score,correct,total,at:Date.now()};p.tasks[id]=p.modes[id];p.score=Math.round(Object.values(p.modes).reduce((a,x)=>a+(x.score||0),0)/4);S.history[today()]={...(S.history[today()]||{}),[id]:{score,correct,total}};save();task=null;page='result';matchState={id,correct,total,score,miss:[...miss]};render()}
function resultView(){const r=matchState||{score:0,correct:0,total:0,id:'flash'};return `${header('Mashq yakunlandi','Natijangiz saqlandi.')}<section class="panel task-area"><div class="ring" style="--pct:${r.score}"><b>${r.score}%</b></div><h2 style="margin:8px 0">${r.score>=90?'Ajoyib natija! 🚀':r.score>=70?'Yaxshi ish! 💪':'Mashqni davom ettiring 🌱'}</h2><p class="subhead">${r.correct} ta to‘g‘ri · ${Math.max(0,r.total-r.correct)} ta xato · ${r.total} ta savol</p><div style="margin-top:20px" class="stack"><button class="btn primary full" onclick="startTask('${r.id}')">Qayta mashq qilish</button><button class="btn secondary full" onclick="go('tasks')">Boshqa vazifa</button><button class="btn ghost full" onclick="go('home')">Asosiy oynaga qaytish</button></div></section>`}
const oldRender=render;render=function(){if(page==='result'){nav();$('#app').innerHTML=`<div class="top"><div class="brand"><div class="logo">✦</div><div><h1>English So‘z</h1><p>Natijangiz</p></div></div></div>${resultView()}`;return}oldRender()};
function openWordList(){const list=[...S.words].sort((a,b)=>a.translation.localeCompare(b.translation,'uz'));modal('So‘zlar ro‘yxati',list.length?`<p class="subhead">Jami ${list.length} ta so‘z. Inglizcha tomoni yashirilgan.</p><div style="max-height:55vh;overflow:auto">${list.map((w,i)=>`<div class="list-item"><div><b>${i+1}. ${esc(w.translation)}</b><small>${esc(w.added||'')}</small></div><span class="badge">${(w.done||[]).length?'Takrorlangan':'Yangi'}</span></div>`).join('')}</div>`:'<p class="subhead">Hali so‘z qo‘shilmagan.</p>')}
function openTodayWords(){const list=dueWords();modal('Bugungi so‘zlar',list.length?`<p class="subhead">${list.length} ta so‘z mashq uchun tayyor. Inglizcha tarjimalar yashirilgan.</p><div style="max-height:55vh;overflow:auto">${list.map((w,i)=>`<div class="list-item"><b>${i+1}. ${esc(w.translation)}</b><span class="badge">Bugun</span></div>`).join('')}</div>`:'<p class="subhead">Bugun uchun so‘z yo‘q. Lug‘atga yangi so‘z qo‘shishingiz mumkin.</p>')}
function openCalendar(){const now=new Date(),year=now.getFullYear(),month=now.getMonth(),first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7;let cells='';for(let i=0;i<offset;i++)cells+='<span></span>';for(let n=1;n<=days;n++){const d=new Date(year,month,n),k=dateKey(d),p=S.progress[k],count=Object.keys(p?.modes||{}).length,cls=count===4?'full':count?'partial':'',tod=k===today()?'today':'';cells+=`<div class="cal-day ${cls} ${tod}" title="${count}/4 vazifa" aria-label="${k}: ${count}/4">${n}</div>`}modal('Mashqlar kalendari',`<p class="subhead">${now.toLocaleDateString('uz-UZ',{month:'long',year:'numeric'})} · 🟢 4/4 bajarilgan · 🟡 qisman · oddiy rang — bajarilmagan</p><div class="calendar" style="margin-top:15px">${['Du','Se','Ch','Pa','Ju','Sh','Ya'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells}</div><div class="row spread" style="margin-top:15px"><span class="badge">Joriy zanjir: ${streak()} kun</span><span class="badge">Bugun: ${Object.keys(progressFor().modes).length}/4</span></div>`)}
async function confirmLogout(){const ok=await modal('Google profilidan chiqilsinmi?','<p class="subhead">Lug‘at qurilmada qoladi. Profilni uzsangiz, Drive sinxronlash to‘xtaydi.</p>',[{text:'Bekor qilish',value:false},{text:'Ha, chiqish',value:true,primary:true}]);if(ok&&typeof cloudLogout==='function'){cloudLogout();toast('Google profili uzildi.');render()}}
function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`english-soz-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast('Zaxira fayli tayyor.')}
async function importData(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.words))throw Error('format');const ok=await modal('Ma’lumotni tiklash','<p class="subhead">Joriy lug‘at o‘rniga zaxiradagi ma’lumotlar yuklanadi. Avval eksport qilib qo‘yish tavsiya etiladi.</p>',[{text:'Bekor qilish',value:false},{text:'Tiklash',value:true,primary:true}]);if(!ok)return;S={...defaults(),...data,set:{...defaults().set,...data.set}};S.words=S.words.map(w=>({...w,id:String(w.id||uid()),done:Array.isArray(w.done)?w.done:[],examples:normalizeExamples(w.examples,w.example)}));save();render();toast('Ma’lumot tiklandi.')}catch{toast('JSON faylni o‘qib bo‘lmadi.')}}
async async function aiRegenerate(id){const w=S.words.find(x=>x.id===id);if(!w)return;toast('AI misollar tayyorlanmoqda…');try{w.examples={...w.examples,...await aiExamples(w.word,w.translation)};save();render();toast('Misollar yangilandi.')}catch(e){console.warn(e);toast('Gemini kalitini tekshiring yoki qayta kiriting.')}}
function init(){progressFor();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn)}init();
</script></body></html>
