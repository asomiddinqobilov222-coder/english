<script src="https://accounts.google.com/gsi/client" async defer></script><script src="config.js"></script><script src="cloud.js"></script><script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const defaults=()=>({words:[],progress:{},cache:{s:{},t:{}},set:{sound:true,vib:true,accent:'en-US'},history:{}});
function loadLocalState(){
  try {
    const key = typeof cloudDataStorageKey === 'function' ? cloudDataStorageKey() : 'eng-data:local';
    let raw = localStorage.getItem(key);
    if (!raw && !cloud?.user) raw = localStorage.getItem('eng');
    const data = JSON.parse(raw || 'null');
    if (!data || typeof data !== 'object' || Array.isArray(data)) return defaults();
    return {...defaults(), ...data,
      words: Array.isArray(data.words) ? data.words : [],
      progress: data.progress && typeof data.progress === 'object' ? data.progress : {},
      cache: data.cache && typeof data.cache === 'object' ? data.cache : {s:{},t:{}},
      set: {...defaults().set, ...(data.set || {})},
      history: data.history && typeof data.history === 'object' ? data.history : {}
    };
  } catch (error) { console.warn('Local backup could not be loaded:', error); return defaults(); }
}
let S=loadLocalState();
let groqApiKey='';
let aiProvider='';
let aiModel='';
let aiLastError='';
const AI_KEY_PREFIX='eng-ai-key:';
function aiStorageKey(){
 const identity=cloud?.user?.sub||cloud?.user?.email;
 return AI_KEY_PREFIX+encodeURIComponent(String(identity||'local').trim().toLowerCase());
}
function restoreAiKeyForCurrentProfile(){
 groqApiKey='';aiProvider='';aiModel='';aiLastError='';
 try{
  const saved=JSON.parse(localStorage.getItem(aiStorageKey())||'null');
  if(saved&&typeof saved.key==='string'&&saved.key){
   groqApiKey=saved.key;aiProvider=String(saved.provider||'');aiModel=String(saved.model||'');
  }
 }catch{}
}
function persistAiKey(key,provider,model){
 groqApiKey=String(key||'');aiProvider=provider||'';aiModel=model||'';aiLastError='';
 try{localStorage.setItem(aiStorageKey(),JSON.stringify({key:groqApiKey,provider:aiProvider,model:aiModel,updatedAt:Date.now()}))}
 catch(e){console.warn('AI kalitini saqlab bo‘lmadi:',e);toast('AI kaliti ushbu qurilmada saqlanmadi. Brauzer xotirasini tekshiring.')}
}
restoreAiKeyForCurrentProfile();
S.words=(Array.isArray(S.words)?S.words:[]).map(w=>({...w,id:String(w.id||uid()),word:String(w.word||''),translation:String(w.translation||''),added:w.added||today(),done:Array.isArray(w.done)?w.done.filter(n=>[0,1,3,7,14,30,60].includes(n)):[],reviewedOn:String(w.reviewedOn||''),lastReviewedOn:String(w.lastReviewedOn||w.reviewedOn||''),examples:normalizeExamples(w.examples,w.example)}));
saveLocal();
function normalizeExamples(ex,old){if(ex&&typeof ex==='object')return ex;return {easy:old?{en:String(old),uz:''}:null,normal:null,hard:null}}
const MODES=[{id:'flash',icon:'🪄',title:'Flashcard',desc:'So‘zni eslab qolish'},{id:'match',icon:'🧩',title:'Moslashtirish',desc:'So‘z va tarjimani topish'},{id:'write',icon:'⌨️',title:'Yozish',desc:'Inglizchasini yozish'},{id:'sentence',icon:'✍️',title:'Gap tuzish',desc:'Gapni tarjima qilib yozish'}];
let page='home',task=null,modalResolve=null,flash=null,match=null,write=null,sentence=null,translator={sl:'en',tl:'uz',result:'',examples:[]},matchState=null;
const sentenceAiPending=new Set(),sentenceAiError=new Set();
function progressFor(k=today()){if(!S.progress[k])S.progress[k]={words:S.words.filter(w=>due(w)).map(w=>w.id),modes:{},tasks:{},score:0};const p=S.progress[k];p.modes=p.modes||{};p.tasks=p.tasks||{};if(!Array.isArray(p.words))p.words=[];return p}
const REVIEW_INTERVALS=[0,1,3,7,14,30,60];
function dayDate(key){const [y,m,d]=String(key||today()).split('-').map(Number);return new Date(y,m-1,d)}
function due(w){if(w.reviewedOn===today())return false;const done=Array.isArray(w.done)?w.done:[];const next=REVIEW_INTERVALS.find(n=>!done.includes(n));if(next===undefined)return false;const base=next===0?(w.added||today()):(w.lastReviewedOn||w.reviewedOn||w.added||today());const dueDate=dayDate(base);dueDate.setDate(dueDate.getDate()+next);return dueDate<=dayDate(today())}
function dueWords(){return S.words.filter(due)}
function markReviewed(words,missed=new Set()){const todayKey=today();const missedIds=missed instanceof Set?missed:new Set(missed||[]);for(const w of words||[]){if(!w||missedIds.has(w.id)||w.reviewedOn===todayKey)continue;const done=Array.isArray(w.done)?w.done:(w.done=[]);const next=REVIEW_INTERVALS.find(n=>!done.includes(n));if(next===undefined)continue;if(!due(w))continue;done.push(next);w.reviewedOn=todayKey;w.lastReviewedOn=todayKey}}
function saveLocal(){
  try {
    const key = typeof cloudDataStorageKey === 'function' ? cloudDataStorageKey() : 'eng-data:local';
    localStorage.setItem(key, JSON.stringify(S));
  } catch (error) {
    console.warn('Local backup could not be saved:', error);
    toast('Qurilmadagi zaxira saqlanmadi. Xotira joyini tekshiring.');
  }
}
function save(){saveLocal();if(typeof cloudSaveDebounced==='function')cloudSaveDebounced()}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2400)}
function sound(ok=true){if(!S.set.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=ok?740:230;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.055,c.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.12);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.13);o.onended=()=>c.close()}catch{}}
function vibrate(pattern=25){if(S.set.vib&&navigator.vibrate)navigator.vibrate(pattern)}
function haptic(ok=true){sound(ok);vibrate(ok?22:[35,30,35])}
function modal(title,body,buttons=[{text:'Yopish',value:false}]){return new Promise(resolve=>{modalResolve=resolve;$('#modal-root').innerHTML=`<div class="modal-back" role="presentation"><section class="modal" role="dialog" aria-modal="true"><h3>${title}</h3>${body}<div class="modal-actions">${buttons.map((b,i)=>`<button class="btn ${b.primary?'primary':'ghost'}" data-modal="${i}">${esc(b.text)}</button>`).join('')}</div></section></div>`;$('#modal-root').querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>{const v=buttons[+b.dataset.modal].value;$('#modal-root').innerHTML='';resolve(v)});$('#modal-root').querySelector('.modal-back').addEventListener('click',e=>{if(e.target.classList.contains('modal-back')){ $('#modal-root').innerHTML='';resolve(false)}})})}
function nav(){const items=[['home','⌂','Asosiy'],['tasks','✓','Vazifalar'],['translator','⇄','Tarjimon'],['profile','◉','Profil']];$('#nav').innerHTML=items.map(([id,ic,t])=>`<button class="${page===id?'active':''}" data-page="${id}"><span class="navicon">${ic}</span><span>${t}</span></button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){page=p;task=null;render();window.scrollTo({top:0,behavior:'smooth'});haptic(true)}
function header(title,sub=''){return `<div class="screen-title"><div><div class="eyebrow">ENGLISH SO‘Z / ${page==='home'?'OVERVIEW':page.toUpperCase()}</div><h2>${title}</h2><p class="subhead">${sub}</p></div></div>`}
function bar(pct){return `<div class="bar ${pct===0?'zero':''}"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`}
function percentToday(){const p=progressFor();return Math.round(Object.keys(p.modes).filter(k=>p.modes[k]).length/4*100)}
function streak(){let d=new Date(today()),n=0;const has=()=>{const p=S.progress[dateKey(d)];return p&&Object.keys(p.modes||{}).length>0};if(!has())d.setDate(d.getDate()-1);while(has()&&n<400){n++;d.setDate(d.getDate()-1)}return n}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function home(){const p=progressFor(),pct=percentToday(),done=Object.keys(p.modes).length,dues=dueWords();return `${header('Bugun o‘zingni rivojlantir','Kichik qadamlar — katta natijalar.')}
<div class="panel"><div class="progress-head"><span>Bugungi vazifalar:</span><span class="percent">${pct}%</span></div><div class="subhead" style="margin-top:4px">${done}/4 vazifa bajarildi${done===4?' · Ajoyib! 🏆':''}</div>${bar(pct)}<div class="row spread" style="margin-top:13px"><small>${new Date().toLocaleDateString('uz-UZ',{weekday:'long',day:'numeric',month:'long'})}</small><span class="badge">${done===4?'Kun yakunlandi':'Davom etamiz'}</span></div></div>

<div class="home-grid"><section class="panel"><div class="row spread"><div><div class="eyebrow">HAFTALIK NATIJA</div><h3 class="section-title" style="margin-top:5px">Mashq grafigi</h3></div><span class="badge">7 kun</span></div><div class="chart-wrap">${chart()}</div><p class="subhead">Har bir vazifadagi natijalar o‘rtachasi. Bajarilmagan kun 0% bo‘lib ko‘rinadi.</p></section><section class="panel"><div class="eyebrow">BUGUNGI REJA</div><h3 class="section-title" style="margin-top:5px">Davom ettirish</h3><div class="task-list" style="grid-template-columns:1fr">${MODES.map(m=>`<div class="task-card" onclick="startTask('${m.id}')"><div class="task-icon">${m.icon}</div><div class="task-copy"><b>${m.title}</b><small>${m.desc}</small><span class="task-state ${p.modes[m.id]?'done':''}">${p.modes[m.id]?'✓ Bajarildi':'Boshlash'}</span></div><span class="task-right">›</span></div>`).join('')}</div></section></div>`}
function chart(){const now=new Date(),days=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);const k=dateKey(d),p=S.progress[k],m=p?.modes||{},vals=Object.values(m).map(x=>Number(x.score)||0);const pct=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/4):0;days.push({k,label:d.toLocaleDateString('uz-UZ',{weekday:'short'}).replace('.',''),pct})}const W=520,H=220,L=34,R=10,T=12,B=30,iw=W-L-R,ih=H-T-B;const ys=[0,25,50,75,100].map(v=>`<g><line x1="${L}" y1="${T+ih*(1-v/100)}" x2="${W-R}" y2="${T+ih*(1-v/100)}" stroke="#ffffff12"/><text x="${L-7}" y="${T+ih*(1-v/100)+4}" fill="#9cabc4" font-size="10" text-anchor="end">${v}</text></g>`).join('');const pts=days.map((d,i)=>`${L+iw*i/6},${T+ih*(1-d.pct/100)}`).join(' ');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="So‘nggi yetti kun natijalari foizda">${ys}<polyline points="${pts}" fill="none" stroke="#55e6d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${days.map((d,i)=>{const x=L+iw*i/6,y=T+ih*(1-d.pct/100);return `<circle cx="${x}" cy="${y}" r="4.5" fill="#55e6d0" stroke="#112033" stroke-width="2"><title>${d.k}: ${d.pct}%</title></circle><text x="${x}" y="${H-8}" fill="#9cabc4" font-size="11" text-anchor="middle">${esc(d.label)}</text>`}).join('')}</svg>`}
function tasksPage(){const p=progressFor(),done=Object.keys(p.modes).length,pct=Math.round(done/4*100);return `${header('Vazifalar','Bugungi so‘zlarni 4 xil usulda mashq qil.') }<div class="panel"><div class="progress-head"><span>Bajarildi: ${done}/4</span><span class="percent">${pct}%</span></div>${bar(pct)}</div><div class="task-list">${MODES.map(m=>`<div class="task-card" onclick="startTask('${m.id}')"><div class="task-icon">${m.icon}</div><div class="task-copy"><b>${m.title}</b><small>${m.desc}</small><span class="task-state ${p.modes[m.id]?'done':''}">${p.modes[m.id]?`✓ ${p.modes[m.id].score}% natija`:'Kutmoqda'}</span></div><span class="task-right">›</span></div>`).join('')}</div><p class="footnote">So‘z qo‘shilmagan bo‘lsa, avval profil yoki asosiy oynadan so‘z qo‘shing.</p>`}
function render(){nav();const app=$('#app');if(page==='home')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">✦</div><div><h1>English So‘z</h1><p>Learn a little. Grow every day.</p></div></div>${cloud?.user?.picture?`<img class="avatar" src="${esc(cloud.user.picture)}" alt="Profil rasmi">`:`<div class="avatar" style="display:grid;place-items:center">✦</div>`}</div>${home()}`;else if(page==='tasks')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">✓</div><div><h1>English So‘z</h1><p>Bugungi mashqlar</p></div></div></div>${tasksPage()}`;else if(page==='translator')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">⇄</div><div><h1>Tarjimon</h1><p>English ↔ O‘zbek</p></div></div></div>${translatorPage()}`;else if(page==='profile')app.innerHTML=`<div class="top"><div class="brand"><div class="logo">◉</div><div><h1>Profil</h1><p>Sozlamalar va hisob</p></div></div></div>${profilePage()}`;else if(page==='add')app.innerHTML=`<div class="top"><button class="btn ghost small" onclick="go('home')">← Orqaga</button><div class="eyebrow">YANGI LUG‘AT</div></div>${addPage()}`;else app.innerHTML=`<div class="top"><button class="btn ghost small" onclick="go('home')">← Menyu</button></div>${taskView()}`;bindPage();if(typeof cloudRender==='function')cloudRender()}
function bindPage(){if(page==='add'){const f=$('#add-form');if(f)f.onsubmit=async e=>{e.preventDefault();await addWord(new FormData(f))}}if(page==='translator'){if(window.translatorDebounce)clearTimeout(window.translatorDebounce);$('#swap')?.addEventListener('click',()=>{[translator.sl,translator.tl]=[translator.tl,translator.sl];translator.result='';render();const src=$('#src');if(src&&src.value.trim())scheduleTranslatorTranslation()});$('#read-src')?.addEventListener('click',()=>speak($('#src').value,translator.sl));$('#read-dst')?.addEventListener('click',()=>speak(translator.result,translator.tl));$('#src')?.addEventListener('input',()=>{translator.source=$('#src').value;translator.result='';$('#dst').textContent='Yozishni davom eting…';if(window.translatorDebounce)clearTimeout(window.translatorDebounce);if(translator.source.trim())window.translatorDebounce=setTimeout(()=>translateText(true),500);scheduleLiveSpellcheck();});$('#clear-translator')?.addEventListener('click',()=>{translator.source='';translator.result='';translator.examples=[];const src=$('#src');if(src)src.value='';const spell=$('#spell-live');if(spell){spell.className='spell-live';spell.textContent='';}if(window.liveSpellTimer)clearTimeout(window.liveSpellTimer);if(window.liveSpellController)window.liveSpellController.abort();const dst=$('#dst');if(dst)dst.textContent='Tarjima shu yerda ko‘rinadi';const ex=$('#translator-examples');if(ex)ex.innerHTML='<p class="subhead">Matn va misollar tozalandi.</p>';toast('Tarjimon oynasi tozalandi.');});}}
function addPage(){return `${header('So‘z qo‘shish','Inglizcha so‘zni yozing — o‘zbekcha tarjima avtomatik chiqadi.')}<form id="add-form" class="panel stack"><label class="fieldbox"><span class="field-label">Inglizcha so‘z</span><input class="field" name="word" required maxlength="100" placeholder="e.g. curious" autocomplete="off" onblur="autoTranslateWord(this.value)"></label><label class="fieldbox"><span class="field-label">Asosiy tarjima (avtomatik)</span><input class="field" id="auto-translation" name="translation" required maxlength="180" placeholder="Tarjima avtomatik chiqadi" readonly></label><label class="fieldbox"><span class="field-label">Qo‘shimcha tarjima (ixtiyoriy)</span><input class="field" name="customTranslation" maxlength="180" placeholder="O‘zingizning izoh yoki muqobil tarjimangiz"></label><label class="fieldbox"><span class="field-label">Ixtiyoriy o‘z misolingiz</span><textarea class="field" name="example" rows="2" placeholder="I am curious about space."></textarea></label><button class="btn primary full" type="submit">✦ So‘zni saqlash va AI gaplar tayyorlash</button><p class="subhead">AI misol gaplar uchun Profil bo‘limida Groq API kalitini kiriting.</p></form>`}
async function addWord(fd){const word=String(fd.get('word')||'').trim(),translation=String(fd.get('translation')||'').trim(),customTranslation=String(fd.get('customTranslation')||'').trim(),example=String(fd.get('example')||'').trim();if(!word)return toast('Inglizcha so‘zni kiriting.');let auto=translation;if(!auto){try{auto=await lookupTranslation(word)}catch{ return toast('Tarjima olinmadi. Internetni tekshiring.')}}if(!auto)return toast('Tarjima olinmadi.');const finalTranslation=customTranslation?`${auto} (${customTranslation})`:auto;if(S.words.some(w=>w.word.toLocaleLowerCase()===word.toLocaleLowerCase()))return toast('Bu so‘z ro‘yxatda bor.');const w={id:uid(),word,translation:finalTranslation,added:today(),done:[],examples:{easy:example?{en:example,uz:''}:null,normal:null,hard:null}};S.words.push(w);const p=progressFor();if(!p.words.includes(w.id))p.words.push(w.id);save();render();toast('So‘z saqlandi. AI misollar tayyorlanmoqda…');if(example)w.examples.easy={en:example,uz:''};try{const ex=await aiExamples(word,finalTranslation);if(ex){w.examples={...w.examples,...ex};save();toast('Uch darajadagi misol gaplar tayyor!')}}catch(e){aiLastError=e?.message||'Noma’lum AI xatosi';console.warn('Word example generation failed:',aiLastError);toast('So‘z saqlandi, ammo AI gaplari yaratilmadi: '+aiLastError.slice(0,100))}render()}
function profilePage(){const user=cloud?.user||null;return `${header('Shaxsiy profil','O‘rganish jarayoningizni boshqaring.')}<section class="panel"><div class="row" style="gap:14px">${user?.picture?`<img class="avatar" style="width:62px;height:62px" src="${esc(user.picture)}" alt="Profil rasmi">`:`<div class="logo" style="width:62px;height:62px;border-radius:50%">${user?'◉':'🔐'}</div>`}<div style="flex:1"><h3 style="margin:0 0 4px">${esc(user?.name||'Google profiliga ulaning')}</h3><p class="subhead">${esc(user?.email||(cloud?.ready?'Google Drive ulangan':'Ma’lumotlar qurilmada saqlanadi'))}</p></div></div><div id="cloud-status" class="subhead" style="margin-top:14px">${cloud?.ready?'☁️ Google Drive bilan sinxronlash faol':user?'Profil eslab qolingan. Sinxronlash uchun Google ruxsati kerak bo‘lishi mumkin.':'Google akkaunt ulanmagan.'}</div><div id="cloud-actions" style="margin-top:12px">${user?`<button class="btn secondary full" onclick="cloudLogin()">☁️ Google Drive’ni ulash / yangilash</button>`:`<button class="btn primary full" onclick="cloudLogin()">Google orqali kirish</button>`}</div></section><section class="panel"><h3 class="section-title">Grok / Groq AI agenti</h3>${groqApiKey ? '<div style="border:1px solid #287f68;background:#12362f;border-radius:14px;padding:13px;margin:10px 0"><b style="color:var(--green)">✓ AI agent ulangan va faol</b><p class="subhead" style="margin:6px 0 0">AI API kaliti tekshirildi. Gap tuzish uchun tayyor.</p></div><button class="btn ghost" onclick="clearAiKey()">Kalitni almashtirish yoki uzish</button>' : '<p class="subhead">Gmail faqat Google/Drive kirishi uchun. Groq API kaliti (gsk_ bilan) sahifa yangilangandan keyin ham ushbu qurilmada va shu Google profiliga alohida saqlanadi. Umumiy yoki begona qurilmada kalitni saqlamang.</p><label class="fieldbox" style="display:block;margin-top:12px"><span class="field-label">Grok (xAI) yoki Groq API kaliti</span><input id="groq-key" class="field" type="password" autocomplete="off" placeholder="xai-… yoki gsk_…"></label><div class="row" style="margin-top:10px"><button id="groq-save-btn" class="btn primary" onclick="saveAiKey()">Ulash va tekshirish</button></div>'}<p class="subhead" style="margin-top:10px">Eslatma: kalit GitHub yoki Google Drive fayliga yozilmaydi, faqat ushbu brauzer xotirasida saqlanadi. Bu server darajasidagi maxfiy saqlash emas; qurilma umumiy bo‘lsa kalitni saqlamang.</p></section><section class="panel"><h3 class="section-title">Sozlamalar</h3><div class="settings-row"><div><b>Ovoz</b><div class="subhead">Tugma bosilganda yumshoq signal</div></div><input class="switch" type="checkbox" ${S.set.sound?'checked':''} onchange="S.set.sound=this.checked;save();haptic(this.checked);render()"></div><div class="settings-row"><div><b>Vibratsiya</b><div class="subhead">Telefon qo‘llab-quvvatlasa</div></div><input class="switch" type="checkbox" ${S.set.vib?'checked':''} onchange="S.set.vib=this.checked;save();render()"></div><div class="settings-row"><div><b>So‘z qo‘shish</b><div class="subhead">Yangi lug‘at va misol gaplar</div></div><button class="btn ghost small" onclick="go('add')">Ochish →</button></div><div class="settings-row"><div><b>Tarjimon</b><div class="subhead">Matn tarjimasi va talaffuz</div></div><button class="btn ghost small" onclick="go('translator')">Ochish →</button></div><div class="settings-row"><div><b>Zaxira nusxasi</b><div class="subhead">Lug‘atni JSON faylga saqlash</div></div><button class="btn ghost small" onclick="exportData()">Eksport</button></div><div class="settings-row"><div><b>Ma’lumotni tiklash</b><div class="subhead">Avvalgi zaxira faylidan</div></div><button class="btn ghost small" onclick="$('#import-file').click()">Import</button><input id="import-file" class="hide" type="file" accept="application/json" onchange="importData(this.files[0])"></div><div class="settings-row"><div><b>Chiqish</b><div class="subhead">Google profilini uzish</div></div><button class="btn danger small" onclick="confirmLogout()">Chiqish →</button></div></section>`}
function translatorPage(){return `${header('Tarjimon','Matnni tarjima qiling, talaffuzini tinglang va misol gaplarni ko‘ring.')}<section class="panel"><div class="row spread" style="margin-bottom:12px"><span class="badge">${translator.sl==='en'?'🇺🇸 English':'🇺🇿 O‘zbekcha'}</span><button id="swap" class="btn ghost small">⇄ Almashtirish</button><span class="badge">${translator.tl==='uz'?'🇺🇿 O‘zbekcha':'🇺🇸 English'}</span></div><div class="translator"><div class="board"><label class="field-label">Matn</label><textarea id="src" class="field" placeholder="Matnni kiriting…">${esc(translator.source||'')}</textarea><div id="spell-live" class="spell-live" role="status" aria-live="polite"></div><button id="clear-translator" class="btn danger small" type="button">🗑 Hammasini tozalash</button><button id="read-src" class="btn ghost small">🔊 O‘qish</button></div><div class="board"><label class="field-label">Tarjima</label><div id="dst" class="field output">${esc(translator.result||'Tarjima shu yerda ko‘rinadi')}</div><button id="read-dst" class="btn ghost small">🔊 O‘qish</button></div></div><button id="translator-add-word" class="btn secondary full ${translatorCanAddWord()?'':'hide'}" style="margin-top:8px" onclick="addTranslatorWord()">📚 Lug‘atga qo‘shish</button><p class="subhead" style="margin-top:9px">Ovozli o‘qish brauzer imkoniyatiga bog‘liq. Aksent: <select class="field" style="display:inline-block;width:auto;padding:6px 9px" onchange="S.set.accent=this.value;save()"><option value="en-US" ${S.set.accent==='en-US'?'selected':''}>American English</option><option value="en-GB" ${S.set.accent==='en-GB'?'selected':''}>British English</option></select></p></section><section class="panel"><div class="eyebrow">EXAMPLE SENTENCES</div><h3 class="section-title" style="margin-top:5px">Misol gaplar</h3><div id="translator-examples">${translator.examples.length?translator.examples.map(x=>`<div class="example"><p>${esc(x.en||'')}</p><p class="subhead">${esc(x.uz||'')}</p></div>`).join(''):'<p class="subhead">Misol gaplar hozircha yo‘q. Matn tarjima qilinganda, mavjud bo‘lsa, misollar shu yerda ko‘rinadi.</p>'}</div></section>`}
function translatorCanAddWord(){const source=String(translator.source||'').trim();return translator.sl==='en'&&translator.tl==='uz'&&/^[A-Za-z][A-Za-z'’-]*$/.test(source)&&String(translator.result||'').trim().length>0&&!/[.!?\n]/.test(translator.result)}
function wordEditDistance(a,b){a=String(a).toLowerCase();b=String(b).toLowerCase();if(Math.abs(a.length-b.length)>2)return 99;const dp=Array.from({length:a.length+1},(_,i)=>Array.from({length:b.length+1},(_,j)=>i===0?j:j===0?i:0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return dp[a.length][b.length]}
async function addTranslatorWord(){if(!translatorCanAddWord())return toast('Faqat bitta inglizcha so‘zni tarjima qiling.');let word=translator.source.trim(),translation=translator.result.trim();const exact=S.words.find(w=>w.word.toLowerCase()===word.toLowerCase());if(exact)return toast('“'+exact.word+'” — bu so‘z lug‘atga allaqachon qo‘shilgan.');const close=S.words.map(w=>({w,d:wordEditDistance(word,w.word)})).filter(x=>x.d>0&&x.d<=Math.min(2,word.length>=8?2:1)).sort((a,b)=>a.d-b.d)[0];if(close){translator.source=close.w.word;translator.result=close.w.translation;save();render();return toast('To‘g‘ri shakli “'+close.w.word+'”. Bu so‘z lug‘atga allaqachon qo‘shilgan.');}
try{const checkUrl=new URL('https://api.datamuse.com/words');checkUrl.searchParams.set('sp',word);checkUrl.searchParams.set('max','8');checkUrl.searchParams.set('md','f');const checkRes=await fetch(checkUrl);if(!checkRes.ok)throw Error('spell check unavailable');const suggestions=await checkRes.json();const suggestion=suggestions.map(x=>({word:x.word,d:wordEditDistance(word,x.word)})).filter(x=>x.word.toLowerCase()!==word.toLowerCase()&&x.d>0&&x.d<=Math.min(2,word.length>=7?2:1)&&/^[a-z]+(?:['-][a-z]+)*$/i.test(x.word)).sort((a,b)=>a.d-b.d)[0];if(suggestion){const useSuggestion=await modal('✍️ Imlo xatosi aniqlandimi?',`<div style="text-align:center;padding:8px 0 4px"><div style="font-size:42px;margin-bottom:10px">🔎</div><p class="subhead">Siz kiritgan so‘z</p><div style="font-size:21px;font-weight:800;color:var(--red);text-decoration:line-through;margin:5px 0 14px">${esc(word)}</div><p class="subhead">Tavsiya etilgan to‘g‘ri shakl</p><div style="font-size:27px;font-weight:850;color:var(--green);margin:6px 0 12px">${esc(suggestion.word)}</div><p class="subhead">Tuzatishni qabul qilsangiz, yangi shakl tarjima qilinadi. So‘zni o‘zingiz tekshirib olishingiz mumkin.</p></div>`,[{text:'Bekor qilish',value:false},{text:'Tuzatish',value:true,primary:true}]);if(!useSuggestion)return toast('So‘z qo‘shilmadi.');translator.source=suggestion.word;const src=$('#src');if(src)src.value=suggestion.word;translator.result='';const dst=$('#dst');if(dst)dst.textContent='To‘g‘ri so‘z tarjima qilinmoqda…';await translateText(true);return toast('So‘z “'+suggestion.word+'” shaklida tuzatildi. Tarjimani tekshirib, “Lug‘atga qo‘shish”ni yana bosing.');}}catch(e){const addUnchecked=await modal('⚠️ Imlo tekshiruvi ishlamadi',`<div style="text-align:center;padding:8px 0 4px"><div style="font-size:42px;margin-bottom:10px">🌐</div><p class="subhead">Bepul imlo tekshirish xizmatiga ulanib bo‘lmadi.</p><div style="padding:12px;border:1px solid var(--line);border-radius:14px;background:#0b1425;margin:12px 0;font-size:18px;font-weight:800">${esc(word)}</div><p class="subhead">Bu so‘zning imlosi tekshirilmagan. Davom etishdan oldin uni o‘zingiz tekshiring.</p></div>`,[{text:'Bekor qilish',value:false},{text:'Tekshirilmagan holda qo‘shish',value:true,primary:true}]);if(!addUnchecked)return toast('So‘z qo‘shilmadi.');}
const correctedExact=S.words.find(w=>w.word.toLowerCase()===word.toLowerCase());if(correctedExact)return toast('“'+correctedExact.word+'” — bu so‘z lug‘atga allaqachon qo‘shilgan.');const w={id:uid(),word,translation,added:today(),done:[],examples:{easy:null,normal:null,hard:null}};S.words.push(w);const p=progressFor();if(!p.words.includes(w.id))p.words.push(w.id);save();toast('So‘z lug‘atga qo‘shildi.');render()}
let liveSpellRequestId=0;
function scheduleLiveSpellcheck(){
 if(window.liveSpellTimer)clearTimeout(window.liveSpellTimer);
 if(window.liveSpellController)window.liveSpellController.abort();
 liveSpellRequestId++;
 const box=$('#spell-live');
 if(box){box.className='spell-live';box.textContent=''}
 const fullText=String($('#src')?.value||'');
 if(translator.sl!=='en'||translator.tl!=='uz'||!fullText.trim())return;
 const match=fullText.match(/(?:^|\s)([A-Za-z][A-Za-z'’-]*)\s*$/);
 if(!match||match[1].length<3)return;
 const value=match[1];
 window.liveSpellTimer=setTimeout(()=>checkLiveSpelling(value,fullText),120);
}
async function checkLiveSpelling(value,fullText){
 const box=$('#spell-live');
 if(!box||String($('#src')?.value||'')!==fullText)return;
 const requestId=++liveSpellRequestId;
 const controller=new AbortController();
 window.liveSpellController=controller;
 const current=()=>requestId===liveSpellRequestId&&String($('#src')?.value||'')===fullText;
 const hideNotice=()=>{if(box){box.className='spell-live';box.textContent=''}};
 try{
  const url=new URL('https://api.datamuse.com/words');
  url.searchParams.set('sp',value);
  url.searchParams.set('max','8');
  url.searchParams.set('md','f');
  const response=await fetch(url,{signal:controller.signal});
  if(!response.ok||!current())return;
  const list=await response.json();
  if(!current())return;
  if(list.some(x=>String(x.word||'').toLowerCase()===value.toLowerCase())){hideNotice();return}
  const candidate=list.map(x=>({word:String(x.word||''),d:wordEditDistance(value,x.word),score:Number(x.score)||0}))
   .filter(x=>x.word&&x.word.toLowerCase()!==value.toLowerCase()&&x.d>0&&x.d<=Math.min(2,value.length>=7?2:1)&&/^[a-z]+(?:['-][a-z]+)*$/i.test(x.word))
   // Bir xil tahrir masofasida kam ishlatiladigan yoki qisqaroq tasodifiy so‘zdan ko‘ra,
   // Datamuse bergan ko‘proq uchraydigan so‘zni tanlaymiz.
   .sort((a,b)=>a.d-b.d||b.score-a.score||b.word.length-a.word.length)[0];
  if(!candidate){hideNotice();return}
  box.className='spell-live show';
  box.innerHTML='<strong>⚠️ Imlo xatosi bo‘lishi mumkin:</strong> <span>'+esc(value)+'</span> → <strong>'+esc(candidate.word)+'</strong> <button type="button" id="spell-live-fix">Tuzatish</button>';
  $('#spell-live-fix')?.addEventListener('click',()=>{
   const input=$('#src');if(!input)return;
   const currentText=input.value;const pos=currentText.lastIndexOf(value);if(pos<0)return;
   input.value=currentText.slice(0,pos)+candidate.word+currentText.slice(pos+value.length);
   translator.source=input.value;translator.result='';hideNotice();
   if(window.translatorDebounce)clearTimeout(window.translatorDebounce);
   translateText(true);scheduleLiveSpellcheck();
  });

async function loadSentenceExamples(id){const w=S.words.find(x=>x.id===id);if(!w||sentenceAiPending.has(id))return;if(!groqApiKey){sentenceAiError.add(id);render();return}sentenceAiPending.add(id);render();try{const ex=await aiExamples(w.word,w.translation);w.examples={...(w.examples||{}),...ex};sentenceAiError.delete(id);save();toast('AI gaplar tayyor!')}catch(e){aiLastError=e?.message||'Noma’lum AI xatosi';console.error('Sentence AI error:',aiLastError);sentenceAiError.add(id)}finally{sentenceAiPending.delete(id);render()}}

async function aiGradeSentence(answer,target,word){
 if(!groqApiKey||!aiProvider)throw new Error('Profil bo‘limida Groq API kalitini ulang.');
 const model=aiModel||(aiProvider==='xai'?'grok-4.7':'qwen/qwen3.8-27b');
 const messages=[
  {role:'system',content:'You are a fair English teacher grading an English translation written by an Uzbek learner. Accept natural synonyms and equivalent grammatical structures. Penalize meaning-changing errors, but do not require exact wording. Return JSON only: {"score":0,"feedback":"short Uzbek feedback"}. Score is an integer from 0 to 100. Be consistent: 70 means the core meaning is communicated correctly with only minor errors.'},
  {role:'user',content:'Target English sentence: '+JSON.stringify(target)+'\nVocabulary target: '+JSON.stringify(word||'')+'\nLearner answer: '+JSON.stringify(answer)+'\nGrade meaning, grammar, and word choice. Return JSON only.'}
 ];
 const payload={model,messages,max_completion_tokens:500};
 if(/^qwen\/qwen3\./i.test(model)){payload.reasoning_effort='none';payload.temperature=0.1}
 else if(!/gpt-oss/i.test(model))payload.temperature=0.1;
 const data=await aiFetch(aiBase(aiProvider)+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+groqApiKey},body:JSON.stringify(payload)},25000);
 const raw=String(data?.choices?.[0]?.message?.content||'').trim();
 if(!raw)throw new Error('AI bo‘sh baho qaytardi.');
 const first=raw.indexOf('{'),last=raw.lastIndexOf('}');
 if(first<0||last<=first)throw new Error('AI bahosining formati noto‘g‘ri. Qayta urinib ko‘ring.');
 const parsed=JSON.parse(raw.slice(first,last+1));
 let score=Number(parsed.score);
 if(!Number.isFinite(score))throw new Error('AI bahosi raqamli emas.');
 if(score>0&&score<=1)score*=100;
 return {score:Math.max(0,Math.min(100,Math.round(score))),feedback:String(parsed.feedback||parsed.comment||'Javob tekshirildi.').trim()};
}
async function checkSentence(){
 const input=$('#sentence-answer'),val=input?.value.trim();
 if(!val)return toast('Javobni yozing.');
 const w=sentence.items[0],level=sentence.currentLevel||levelFor(w),ex=w.examples?.[level]||w.examples?.easy||w.examples?.normal||w.examples?.hard;
 if(!ex?.en){toast('Bu so‘z uchun namuna gap yo‘q. AI misollarni qayta yarating.');return}
 const button=$('.panel form button');
 if(button?.disabled)return;
 if(button){button.disabled=true;button.textContent='AI javobni tekshirmoqda…'}
 let result;
 try{result=await aiGradeSentence(val,ex.en,w.word)}
 catch(e){aiLastError=e?.message||'Noma’lum AI xatosi';console.warn('AI sentence grading failed:',aiLastError);if(button){button.disabled=false;button.textContent='Tekshirish'}toast('AI tekshira olmadi: '+aiLastError.slice(0,140));return}
 const score=result.score/100,correct=score>=0.70;
 if(correct)sentence.correct++;else sentence.miss.add(w.id);
 sentence.feedback=`${correct?'✓ Yaxshi!':'To‘g‘ri javob:'} ${ex.en} · AI: ${result.score}% — ${result.feedback}`;
 const feedback=$('#sentence-feedback');if(feedback)feedback.textContent=sentence.feedback;
 if(button){button.disabled=false;button.textContent='Keyingi gap →';button.onclick=e=>{e.preventDefault();sentence.items.shift();sentence.index++;if(!sentence.items.length)finishTask('sentence',sentence.correct,sentence.all.length,sentence.miss);else render()}}
 haptic(correct)
}
function wordOverlap(a,b){const aa=new Set(a.split(' ')),bb=b.split(' ');if(!bb.length)return 0;return bb.filter(x=>aa.has(x)).length/bb.length}
function finishTask(id,correct,total,miss=new Set()){const p=progressFor();const score=total?Math.round(correct/total*100):0;const pools={flash:flash?.all,match:match?.all,write:write?.all,sentence:sentence?.all};const missed=miss instanceof Set?miss:new Set(miss||[]);if(score>=70){markReviewed(pools[id]||[],missed);p.modes[id]={score,correct,total,at:Date.now()};p.tasks[id]=p.modes[id]}else if(!p.modes[id]||p.modes[id].score<70){delete p.modes[id];delete p.tasks[id]}p.score=Math.round(Object.values(p.modes).reduce((a,x)=>a+(x.score||0),0)/4);S.history[today()]={...(S.history[today()]||{}),[id]:{score,correct,total,passed:score>=70}};save();task=null;page='result';matchState={id,correct,total,score,miss:[...missed],passed:score>=70};render()}
function resultView(){const r=matchState||{score:0,correct:0,total:0,id:'flash'};const passed=r.score>=70;return `${header(passed?'Mashq yakunlandi':'70% ga yetmadi',passed?'Vazifa bajarilgan deb hisoblandi.':'Vazifa bajarilgan hisoblanmadi — qayta urinib ko‘r.')}<section class="panel task-area"><div class="ring" style="--pct:${r.score}"><b>${r.score}%</b></div><h2 style="margin:8px 0">${passed?(r.score>=90?'Ajoyib natija! 🚀':'Yaxshi ish! 💪'):'Yana bir bor urinib ko‘r 💪'}</h2><p class="subhead">${r.correct} ta to‘g‘ri · ${Math.max(0,r.total-r.correct)} ta xato · ${r.total} ta savol</p><p class="subhead">${passed?'✓ Bugungi vazifa bajarildi.':'Kamida 70% natija kerak. Bu urinish kunlik vazifa sifatida saqlanmadi.'}</p><div style="margin-top:20px" class="stack"><button class="btn primary full" onclick="startTask('${r.id}')">${passed?'Bugungi mashqni yana bajarish':'Qayta bajarish'}</button><button class="btn secondary full" onclick="go('tasks')">Boshqa vazifa</button><button class="btn ghost full" onclick="go('home')">Asosiy oynaga qaytish</button></div></section>`}
const oldRender=render;render=function(){if(page==='result'){nav();$('#app').innerHTML=`<div class="top"><div class="brand"><div class="logo">✦</div><div><h1>English So‘z</h1><p>Natijangiz</p></div></div></div>${resultView()}`;return}oldRender()};
function openWordList(){const list=[...S.words].sort((a,b)=>a.translation.localeCompare(b.translation,'uz'));const body=list.length?'<p class="subhead">Jami '+list.length+' ta so‘z. Keraksiz so‘zni 🗑 tugmasi orqali o‘chirishingiz mumkin.</p><div style="max-height:55vh;overflow:auto">'+list.map((w,i)=>'<div class="list-item"><div style="min-width:0;flex:1"><b>'+(i+1)+'. '+esc(w.translation)+'</b><small>'+esc(w.added||'')+'</small></div><span class="badge">'+((w.done||[]).length?'Takrorlangan':'Yangi')+'</span><button class="btn danger small" style="margin-left:8px" onclick="deleteWord(&quot;'+esc(w.id)+'&quot;)" aria-label="So‘zni o‘chirish">🗑</button></div>').join('')+'</div>':'<p class="subhead">Hali so‘z qo‘shilmagan.</p>';modal('So‘zlar ro‘yxati',body)}
async function deleteWord(id){const w=S.words.find(x=>x.id===id);if(!w)return;const ok=await modal('So‘zni o‘chirish','<p class="subhead">“'+esc(w.word)+' — '+esc(w.translation)+'” lug‘atdan butunlay o‘chirilsinmi?</p>',[{text:'Bekor qilish',value:false},{text:'O‘chirish',value:true,primary:true}]);if(!ok)return;S.words=S.words.filter(x=>x.id!==id);for(const p of Object.values(S.progress||{})){if(Array.isArray(p.words))p.words=p.words.filter(x=>x!==id)}save();render();toast('So‘z o‘chirildi.');openWordList()}
function openTodayWords(){const list=dueWords();modal('Bugungi so‘zlar',list.length?`<p class="subhead">${list.length} ta so‘z mashq uchun tayyor. Inglizcha tarjimalar yashirilgan.</p><div style="max-height:55vh;overflow:auto">${list.map((w,i)=>`<div class="list-item"><b>${i+1}. ${esc(w.translation)}</b><span class="badge">Bugun</span></div>`).join('')}</div>`:'<p class="subhead">Bugun uchun so‘z yo‘q. Lug‘atga yangi so‘z qo‘shishingiz mumkin.</p>')}
let calendarMonthOffset=0;
function changeCalendarMonth(delta){calendarMonthOffset+=delta;openCalendar()}
function openCalendar(){
  const monthDate=new Date(new Date().getFullYear(),new Date().getMonth()+calendarMonthOffset,1);
  const year=monthDate.getFullYear(),month=monthDate.getMonth(),first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7;
  const monthKey=`${year}-${String(month+1).padStart(2,'0')}`;
  let cells='';
  for(let i=0;i<offset;i++)cells+='<span></span>';
  for(let n=1;n<=days;n++){
    const d=new Date(year,month,n),k=dateKey(d),p=S.progress[k],count=Object.keys(p?.modes||{}).length;
    const cls=count===4?'full':count?'partial':'',tod=k===today()?'today':'';
    cells+=`<div class="cal-day ${cls} ${tod}" title="${count}/4 vazifa" aria-label="${k}: ${count}/4">${n}</div>`;
  }
  const completeDays=Object.keys(S.progress||{}).filter(k=>k.startsWith(monthKey+'-')&&Object.keys(S.progress[k]?.modes||{}).length===4).length;
  modal('Mashqlar kalendari',`<div class="row spread" style="align-items:center;gap:8px"><button class="btn ghost small" onclick="changeCalendarMonth(-1)" aria-label="Oldingi oy">‹ Oldingi</button><b>${monthDate.toLocaleDateString('uz-UZ',{month:'long',year:'numeric'})}</b><button class="btn ghost small" onclick="changeCalendarMonth(1)" aria-label="Keyingi oy">Keyingi ›</button></div><p class="subhead" style="margin-top:10px">🟢 4/4 bajarilgan · 🟡 qisman · oddiy rang — bajarilmagan</p><div class="calendar" style="margin-top:15px">${['Du','Se','Ch','Pa','Ju','Sh','Ya'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells}</div><div class="row spread" style="margin-top:15px"><span class="badge">Joriy zanjir: ${streak()} kun</span><span class="badge">Bu oy: ${completeDays} to‘liq kun</span></div>`)
}
async function confirmLogout(){const ok=await modal('Google profilidan chiqilsinmi?','<p class="subhead">Chiqishdan oldin saqlash tugaydi. Lug‘at Google Drive va shu hisobga bog‘langan zaxirada saqlanadi.</p>',[{text:'Bekor qilish',value:false},{text:'Ha, chiqish',value:true,primary:true}]);if(ok&&typeof cloudLogout==='function'){await cloudLogout();toast('Google profili uzildi.');render()}}
function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`english-soz-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast('Zaxira fayli tayyor.')}
async function importData(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.words))throw Error('format');const ok=await modal('Ma’lumotni tiklash','<p class="subhead">Joriy lug‘at o‘rniga zaxiradagi ma’lumotlar yuklanadi. Avval eksport qilib qo‘yish tavsiya etiladi.</p>',[{text:'Bekor qilish',value:false},{text:'Tiklash',value:true,primary:true}]);if(!ok)return;S={...defaults(),...data,set:{...defaults().set,...data.set}};S.words=S.words.map(w=>({...w,id:String(w.id||uid()),done:Array.isArray(w.done)?w.done:[],examples:normalizeExamples(w.examples,w.example)}));save();render();toast('Ma’lumot tiklandi.')}catch{toast('JSON faylni o‘qib bo‘lmadi.')}}
async function aiRegenerate(id){const w=S.words.find(x=>x.id===id);if(!w)return;toast('AI misollar tayyorlanmoqda…');try{w.examples={...w.examples,...await aiExamples(w.word,w.translation)};save();render();toast('Misollar yangilandi.')}catch(e){console.warn(e);toast('Groq API kalitini tekshiring yoki qayta kiriting.')}}
function init(){progressFor();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn)}init();
</script></body></html>
